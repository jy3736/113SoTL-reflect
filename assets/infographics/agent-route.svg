<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="266" viewBox="0 0 1120 266" role="img" aria-labelledby="title desc"><title id="title">從課堂實踐走向教學反思</title><desc id="desc">四段分享路線：做什麼、為什麼做、怎麼做、做完的反思。圖示為概念說明；箭頭表示分享順序，AI Agent 為最後延伸的構想。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="258" height="246" rx="18" fill="#D5E5DF"/><g transform="translate(77 29) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="92" height="29" rx="4"/><path d="M27 13 h66 M27 23 h45"/><circle cx="26" cy="47" r="8"/><circle cx="60" cy="47" r="8"/><circle cx="94" cy="47" r="8"/><path d="M11 79 V66 q15-15 30 0 v13 M45 79 V66 q15-15 30 0 v13 M79 79 V66 q15-15 30 0 v13"/></g><text x="137" y="151" font-size="27" fill="#163D40" font-weight="800" text-anchor="middle">做什麼</text><text x="137" y="195" font-size="19" fill="#506764" font-weight="600" text-anchor="middle">一門課・四階段</text><text x="137" y="230" font-size="16" fill="#167C80" font-weight="500" text-anchor="middle">課堂實踐的起點</text><path d="M269 131 H287 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="8" width="258" height="246" rx="18" fill="#D5E5DF"/><g transform="translate(359 29) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="81" height="58" rx="5"/><path d="M19 27 l-7 8 7 8 M42 27 l7 8-7 8 M33 66 v11 M18 79 h32"/><circle cx="93" cy="50" r="24" fill="#F7F4EC"/><path d="M85 42 q0-12 14-8 q12 5-2 14 l-4 5 M93 64 h0"/></g><text x="419" y="151" font-size="27" fill="#163D40" font-weight="800" text-anchor="middle">為什麼做</text><text x="419" y="195" font-size="19" fill="#506764" font-weight="600" text-anchor="middle">學生困難・教師負荷</text><text x="419" y="230" font-size="16" fill="#167C80" font-weight="500" text-anchor="middle">從現場問題出發</text><path d="M551 131 H569 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="572" y="8" width="258" height="246" rx="18" fill="#D5E5DF"/><g transform="translate(641 29) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="18" width="42" height="44" rx="5"/><rect x="75" y="18" width="42" height="44" rx="5"/><path d="M45 40 h30 M22 8 v10 M22 62 v10 M96 8 v10 M96 62 v10 M14 31 h20 M86 31 h20 M14 47 h20 M86 47 h20"/></g><text x="701" y="151" font-size="27" fill="#163D40" font-weight="800" text-anchor="middle">怎麼做</text><text x="701" y="195" font-size="19" fill="#506764" font-weight="600" text-anchor="middle">AI 協作・評量與選擇</text><text x="701" y="230" font-size="16" fill="#167C80" font-weight="500" text-anchor="middle">教學與驗收一起設計</text><path d="M833 131 H851 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="854" y="8" width="258" height="246" rx="18" fill="#F1E2D3"/><g transform="translate(923 29) scale(1)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="983" y="151" font-size="27" fill="#163D40" font-weight="800" text-anchor="middle">做完的反思</text><text x="983" y="195" font-size="19" fill="#506764" font-weight="600" text-anchor="middle">好消息・警訊・下一步</text><text x="983" y="230" font-size="16" fill="#A85F29" font-weight="500" text-anchor="middle">對回證據，再談 Agent 構想</text></g></svg>