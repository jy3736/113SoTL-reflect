<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">PEA 每週循環</title><desc id="desc">預習、參與、評估循環，資料回到老師補強下週內容。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="48" fill="#163D40" font-size="26" font-weight="800" text-anchor="middle">每週一圈，資料回到老師</text><circle cx="200" cy="120" r="52" fill="#167C80"/><text x="200" y="140" fill="#fff" font-size="54" font-weight="800" text-anchor="middle">P</text><circle cx="318" cy="300" r="52" fill="#163D40"/><text x="318" y="320" fill="#fff" font-size="54" font-weight="800" text-anchor="middle">E</text><circle cx="82" cy="300" r="52" fill="#167C80"/><text x="82" y="320" fill="#fff" font-size="54" font-weight="800" text-anchor="middle">A</text><path d="M238 172 L292 248" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><path d="M262 300 L140 300" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><path d="M106 250 L160 172" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><text x="200" y="410" fill="#A85F29" font-size="21" font-weight="700" text-anchor="middle">金色箭頭：補強下週內容</text></g></svg>