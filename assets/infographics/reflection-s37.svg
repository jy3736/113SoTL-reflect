<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">三個風險，各配一道要驗證的防線</title><desc id="desc">以上為報告建議；尚未證實各項防線的防護效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="20" y="26" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">報告提醒的風險</text><text x="644" y="26" font-size="22" fill="#A85F29" font-weight="800" text-anchor="start">報告建議的防線</text><rect x="8" y="44" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">動機退縮的風險</text><text x="32" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">學生的起點與進度不同</text><rect x="632" y="44" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">及早辨識、分層支援</text><text x="656" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">調整任務並給個別引導</text><path d="M504 90.0 L616 90.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="77.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">回應</text><rect x="8" y="148" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">過度依賴 AI</text><text x="32" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">直接接受答案，未必理解</text><rect x="632" y="148" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">分析與驗證 AI 產出</text><text x="656" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">用錯誤案例練習判斷</text><path d="M504 194.0 L616 194.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="181.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">回應</text><rect x="8" y="252" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">工具誤用</text><text x="32" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">只看到成品，看不到歷程</text><rect x="632" y="252" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">規範與過程評量</text><text x="656" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">檢視思考歷程與互動紀錄</text><path d="M504 298.0 L616 298.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="285.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">回應</text></g></svg>