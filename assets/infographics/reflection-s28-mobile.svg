<svg xmlns="http://www.w3.org/2000/svg" width="360" height="548" viewBox="0 0 360 548" role="img" aria-labelledby="title desc"><title id="title">總指數未達顯著，不代表四種動機沒變</title><desc id="desc">表二 n = 41；這是報告值。RAI 含外在調節，題項版本與重算一致性仍待核對。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="76" rx="18" fill="#D5E5DF"/><text x="24" y="55" font-size="22" fill="#163D40" font-weight="700" text-anchor="start">內在動機</text><text x="327" y="55" font-size="26" fill="#167C80" font-weight="800" text-anchor="end">× 2</text><rect x="8" y="98" width="344" height="76" rx="18" fill="#D5E5DF"/><text x="24" y="145" font-size="22" fill="#163D40" font-weight="700" text-anchor="start">認同調節</text><text x="327" y="145" font-size="26" fill="#167C80" font-weight="800" text-anchor="end">× 1</text><rect x="8" y="188" width="344" height="76" rx="18" fill="#F1E2D3"/><text x="24" y="235" font-size="22" fill="#163D40" font-weight="700" text-anchor="start">外在調節</text><text x="327" y="235" font-size="26" fill="#A85F29" font-weight="800" text-anchor="end">× −1</text><rect x="8" y="278" width="344" height="76" rx="18" fill="#F1E2D3"/><text x="24" y="325" font-size="22" fill="#163D40" font-weight="700" text-anchor="start">動機缺乏</text><text x="327" y="325" font-size="26" fill="#A85F29" font-weight="800" text-anchor="end">× −2</text><rect x="8" y="382" width="344" height="150" rx="18" fill="#F1E2D3"/><text x="30" y="414" font-size="18" fill="#A85F29" font-weight="800" text-anchor="start">相對自主指數</text><text x="30" y="454" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">3.431 → 3.553</text><text x="30" y="490" font-size="20" fill="#506764" font-weight="500" text-anchor="start">p = .677，未達顯著</text><text x="30" y="518" font-size="20" fill=