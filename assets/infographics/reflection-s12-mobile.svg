<svg xmlns="http://www.w3.org/2000/svg" width="360" height="716" viewBox="0 0 360 716" role="img" aria-labelledby="title desc"><title id="title">三個研究問題，先想好怎麼回答</title><desc id="desc">右欄是依研究問題整理的資料需求；不表示報告已完成所有分析。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="36" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告的研究問題</text><text x="24" y="67" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">教師負擔能減輕嗎？</text><text x="24" y="94" font-size="18" fill="#506764" font-weight="500" text-anchor="start">教材編寫與評量設計</text><path d="M24 109 L336 109" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="134" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">本次分享整理：需要的證據</text><text x="24" y="165" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">需要教師工時資料</text><text x="24" y="193" font-size="18" fill="#506764" font-weight="500" text-anchor="start">起草、查核、維護與支援</text><rect x="8" y="232" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="260" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告的研究問題</text><text x="24" y="291" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">動機與參與能提升嗎？</text><text x="24" y="318" font-size="18" fill="#506764" font-weight="500" text-anchor="start">AI 協作中的學習經驗</text><path d="M24 333 L336 333" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="358" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">本次分享整理：需要的證據</text><text x="24" y="389" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">需要動機與歷程資料</text><text x="24" y="417" font-size="18" fill="#506764" font-weight="500" text-anchor="start">SIMS、參與紀錄與回饋</text><rect x="8" y="456" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="484" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告的研究問題</text><text x="24" y="515" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">落差與分化會擴大嗎？</text><text x="24" y="542" font-size="18" fill="#506764" font-weight="500" text-anchor="start">不同起點的學生如何回應</text><path d="M24 557 L336 557" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="582" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">本次分享整理：需要的證據</text><text x="24" y="613" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">需要個別變化資料</text><text x="24" y="641" font-size="18" fill="#506764" font-weight="500" text-anchor="start">逐人追蹤，避免只看平均</text></g></svg>