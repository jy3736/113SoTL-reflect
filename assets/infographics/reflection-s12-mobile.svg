<svg xmlns="http://www.w3.org/2000/svg" width="360" height="906" viewBox="0 0 360 906" role="img" aria-labelledby="title desc"><title id="title">研究問題要對回資料</title><desc id="desc">三個研究問題分別對應教師工時、動機與歷程、個別變化資料；資料需求是本次分享整理，不表示報告已完成所有分析。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="280" rx="18" fill="#D5E5DF"/><g transform="translate(24 31) scale(0.66)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="118" y="51" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">教師負擔</text><text x="28" y="119" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">教師負擔能減輕嗎？</text><text x="28" y="153" font-size="17" fill="#506764" font-weight="500" text-anchor="start">教材編寫與評量設計</text><path d="M28 174 L332 174" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="205" font-size="17" fill="#A85F29" font-weight="800" text-anchor="start">需要的證據</text><text x="28" y="238" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">教師工時資料</text><text x="28" y="270" font-size="17" fill="#506764" font-weight="500" text-anchor="start">起草、查核、維護與支援</text><rect x="8" y="308" width="344" height="280" rx="18" fill="#D5E5DF"/><g transform="translate(24 331) scale(0.66)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="92" height="29" rx="4"/><path d="M27 13 h66 M27 23 h45"/><circle cx="26" cy="47" r="8"/><circle cx="60" cy="47" r="8"/><circle cx="94" cy="47" r="8"/><path d="M11 79 V66 q15-15 30 0 v13 M45 79 V66 q15-15 30 0 v13 M79 79 V66 q15-15 30 0 v13"/></g><text x="118" y="351" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">學生動機與參與</text><text x="28" y="419" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">動機與參與能提升嗎？</text><text x="28" y="453" font-size="17" fill="#506764" font-weight="500" text-anchor="start">AI 協作中的學習經驗</text><path d="M28 474 L332 474" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="505" font-size="17" fill="#A85F29" font-weight="800" text-anchor="start">需要的證據</text><text x="28" y="538" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">動機與歷程資料</text><text x="28" y="570" font-size="17" fill="#506764" font-weight="500" text-anchor="start">SIMS、參與紀錄與回饋</text><rect x="8" y="608" width="344" height="280" rx="18" fill="#D5E5DF"/><g transform="translate(24 631) scale(0.66)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="118" y="651" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">個別差異與風險</text><text x="28" y="719" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">落差與分化會擴大嗎？</text><text x="28" y="753" font-size="17" fill="#506764" font-weight="500" text-anchor="start">不同起點的學生如何回應</text><path d="M28 774 L332 774" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="805" font-size="17" fill="#A85F29" font-weight="800" text-anchor="start">需要的證據</text><text x="28" y="838" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">個別變化資料</text><text x="28" y="870" font-size="17" fill="#506764" font-weight="500" text-anchor="start">逐人追蹤，避免只看平均</text></g></svg>