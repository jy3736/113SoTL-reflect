<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">計畫書規劃的，報告交出了什麼</title><desc id="desc">教材開發日誌未列時數；成績分布未分析；與學生共設計 AI 助教未交代；情境動機由兩次增為四次。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="28" y="28" fill="#167C80" font-size="22" font-weight="800" text-anchor="start">計畫書規劃</text><text x="392" y="28" fill="#167C80" font-size="22" font-weight="800" text-anchor="start">報告交出</text><text x="776" y="28" fill="#A85F29" font-size="22" font-weight="800" text-anchor="start">下一輪要補</text><rect x="8" y="44.0" width="324" height="70.0" rx="14" fill="#D5E5DF"/><text x="28" y="73.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">教材開發日誌</text><text x="28" y="105.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">每週記錄備課時間</text><path d="M337 79.0 L366 79.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="44.0" width="344" height="70.0" rx="14" fill="#D5E5DF"/><text x="392" y="73.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">沒有列出時數</text><text x="392" y="105.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">只有文字描述</text><path d="M721 79.0 L750 79.0" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="44.0" width="356" height="70.0" rx="14" fill="#F1E2D3"/><text x="776" y="73.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">記四類工時</text><text x="776" y="105.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">起草、查核、維護、支援</text><rect x="8" y="126.0" width="324" height="70.0" rx="14" fill="#D5E5DF"/><text x="28" y="155.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">班級成績分布</text><text x="28" y="187.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">低成就者有沒有靠攏</text><path d="M337 161.0 L366 161.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="126.0" width="344" height="70.0" rx="14" fill="#D5E5DF"/><text x="392" y="155.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">未呈現成績分析</text><text x="392" y="187.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">報告主要呈現動機資料</text><path d="M721 161.0 L750 161.0" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="126.0" width="356" height="70.0" rx="14" fill="#F1E2D3"/><text x="776" y="155.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">看逐人變化</text><text x="776" y="187.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">中段標記、後續追蹤</text><rect x="8" y="208.0" width="324" height="70.0" rx="14" fill="#D5E5DF"/><text x="28" y="237.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">與學生共設計 AI 助教</text><text x="28" y="269.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">自評「不確定性最高」</text><path d="M337 243.0 L366 243.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="208.0" width="344" height="70.0" rx="14" fill="#D5E5DF"/><text x="392" y="237.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">報告沒有交代</text><text x="392" y="269.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">做到哪裡沒有寫</text><path d="M721 243.0 L750 243.0" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="208.0" width="356" height="70.0" rx="14" fill="#F1E2D3"/><text x="776" y="237.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">補說執行情形</text><text x="776" y="269.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">未報告不等於未執行</text><rect x="8" y="290.0" width="324" height="70.0" rx="14" fill="#D5E5DF"/><text x="28" y="319.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">情境動機兩次</text><text x="28" y="351.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">學期前後 t 檢定</text><path d="M337 325.0 L366 325.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="290.0" width="344" height="70.0" rx="14" fill="#D5E5DF"/><text x="392" y="319.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">實際測了四次</text><text x="392" y="351.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">才看得到第 3 次低點</text><path d="M721 325.0 L750 325.0" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="290.0" width="356" height="70.0" rx="14" fill="#F1E2D3"/><text x="776" y="319.5" fill="#163D40" font-size="22" font-weight="800" text-anchor="start">題目一字不差</text><text x="776" y="351.5" fill="#506764" font-size="17" font-weight="500" text-anchor="start">第 11 題的教訓</text></g></svg>