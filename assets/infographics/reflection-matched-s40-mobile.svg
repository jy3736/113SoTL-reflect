<svg xmlns="http://www.w3.org/2000/svg" width="360" height="945" viewBox="0 0 360 945" role="img" aria-labelledby="title desc"><title id="title">第 40 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="292" rx="18" fill="#D5E5DF"/><g transform="translate(26 28) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="125" y="50" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">113 留下的證據缺口</text><text x="125" y="86" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">教師負擔：缺時數</text><path d="M27 118 L333 118" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="154" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">記四類工時</text><text x="28" y="190" font-size="17" fill="#506764" font-weight="500" text-anchor="start">起草、查核、維護、支援</text><text x="28" y="230" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">要回答的問題</text><text x="28" y="268" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">省下的時間去哪裡</text><rect x="8" y="323" width="344" height="292" rx="18" fill="#D5E5DF"/><g transform="translate(26 343) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="125" y="365" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">113 留下的證據缺口</text><text x="125" y="401" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">落差：只有平均與 SD</text><path d="M27 433 L333 433" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="469" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">追蹤每位學生變化</text><text x="28" y="505" font-size="17" fill="#506764" font-weight="500" text-anchor="start">中段訊號、後續進展</text><text x="28" y="545" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">要回答的問題</text><text x="28" y="583" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">有沒有接住學生</text><rect x="8" y="638" width="344" height="292" rx="18" fill="#D5E5DF"/><g transform="translate(26 658) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="125" y="680" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">113 留下的證據缺口</text><text x="125" y="716" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">判斷 AI：缺直接測量</text><path d="M27 748 L333 748" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="784" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">設計錯誤案例任務</text><text x="28" y="820" font-size="17" fill="#506764" font-weight="500" text-anchor="start">找錯、驗證、修正與說明</text><text x="28" y="860" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">要回答的問題</text><text x="28" y="898" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">能否獨立判斷</text></g></svg>