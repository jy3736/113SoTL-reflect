<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">老師的三種負荷，Agent 可以接手與老師不能放手的部分</title><desc id="desc">教材、評量、追蹤三種負荷，分別對應 Agent 可接手的工作與老師必須把關的事。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="28" y="28" fill="#167C80" font-size="22" font-weight="800" text-anchor="start">113 的負荷</text><text x="392" y="28" fill="#167C80" font-size="22" font-weight="800" text-anchor="start">Agent 可以接手</text><text x="776" y="28" fill="#A85F29" font-size="22" font-weight="800" text-anchor="start">老師不能放手</text><rect x="8" y="44.0" width="324" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="28" y="86.66666666666666" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">教材：編寫負荷</text><text x="28" y="120.66666666666666" fill="#506764" font-size="19" font-weight="500" text-anchor="start">補說明、補範例</text><path d="M337 92.66666666666666 L366 92.66666666666666" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="44.0" width="344" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="392" y="86.66666666666666" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">教材生成計畫</text><text x="392" y="120.66666666666666" fill="#506764" font-size="19" font-weight="500" text-anchor="start">依大綱分批起草、留紀錄</text><path d="M721 92.66666666666666 L750 92.66666666666666" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="44.0" width="356" height="97.33333333333333" rx="14" fill="#F1E2D3"/><text x="776" y="86.66666666666666" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">查概念與範例</text><text x="776" y="120.66666666666666" fill="#506764" font-size="19" font-weight="500" text-anchor="start">錯的不能上線</text><rect x="8" y="153.33333333333331" width="324" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="28" y="195.99999999999997" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">評量：出題與批閱</text><text x="28" y="229.99999999999997" fill="#506764" font-size="19" font-weight="500" text-anchor="start">題目多、回饋慢</text><path d="M337 201.99999999999997 L366 201.99999999999997" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="153.33333333333331" width="344" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="392" y="195.99999999999997" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">動態出題、自建批閱</text><text x="392" y="229.99999999999997" fill="#506764" font-size="19" font-weight="500" text-anchor="start">歷屆題目整理、測驗網頁</text><path d="M721 201.99999999999997 L750 201.99999999999997" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="153.33333333333331" width="356" height="97.33333333333333" rx="14" fill="#F1E2D3"/><text x="776" y="195.99999999999997" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">驗答案與測資</text><text x="776" y="229.99999999999997" fill="#506764" font-size="19" font-weight="500" text-anchor="start">抽查再開放</text><rect x="8" y="262.66666666666663" width="324" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="28" y="305.3333333333333" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">追蹤：資料看不完</text><text x="28" y="339.3333333333333" fill="#506764" font-size="19" font-weight="500" text-anchor="start">問卷、進度分散</text><path d="M337 311.3333333333333 L366 311.3333333333333" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="262.66666666666663" width="344" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="392" y="305.3333333333333" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">問卷分析、進度工具</text><text x="392" y="339.3333333333333" fill="#506764" font-size="19" font-weight="500" text-anchor="start">整理成可讀的摘要</text><path d="M721 311.3333333333333 L750 311.3333333333333" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="262.66666666666663" width="356" height="97.33333333333333" rx="14" fill="#F1E2D3"/><text x="776" y="305.3333333333333" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">決定怎麼介入</text><text x="776" y="339.3333333333333" fill="#506764" font-size="19" font-weight="500" text-anchor="start">不交給 AI 判斷學生</text></g></svg>