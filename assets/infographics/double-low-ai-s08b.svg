<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">過去與現在：動機能否拉動成就</title><desc id="desc">上排為過去：提高動機後，被基礎不足擋住，成就未必跟上。下排為有了 AI：動機提高、AI 補上地基，學生能做出高品質產出，成就有機會跟上。為講者觀察示意，不代表因果證據。</desc><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="30" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">動機拉得動成就嗎？</text><text x="200" y="70" font-size="19" fill="#A85F29" font-weight="800" text-anchor="middle">過去</text><rect x="12" y="88" width="104" height="84" rx="12" fill="#D5E5DF"/><text x="64" y="124" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">動機 ↑</text><text x="64" y="152" font-size="15" fill="#506764" font-weight="600" text-anchor="middle">活動拉起來</text><path d="M120 130 H144 M137 124 L145 130 L137 136" fill="none" stroke="#A85F29" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="148" y="88" width="104" height="84" rx="12" fill="#F1E2D3" stroke="#A85F29" stroke-width="2" stroke-dasharray="6 5"/><text x="200" y="124" font-size="21" fill="#A85F29" font-weight="800" text-anchor="middle">基礎不足</text><text x="200" y="152" font-size="15" fill="#506764" font-weight="600" text-anchor="middle">資質與背景</text><path d="M260 120 L276 140 M276 120 L260 140" stroke="#A85F29" stroke-width="3" stroke-linecap="round"/><rect x="284" y="88" width="104" height="84" rx="12" fill="none" stroke="#9AA8A6" stroke-width="2" stroke-dasharray="6 5"/><text x="336" y="124" font-size="23" fill="#9AA8A6" font-weight="800" text-anchor="middle">成就</text><text x="336" y="152" font-size="15" fill="#9AA8A6" font-weight="600" text-anchor="middle">未必跟上</text><path d="M40 208 H360" stroke="#D5E5DF" stroke-width="2"/><text x="200" y="250" font-size="19" fill="#167C80" font-weight="800" text-anchor="middle">有了 AI</text><rect x="12" y="268" width="104" height="84" rx="12" fill="#D5E5DF"/><text x="64" y="304" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">動機 ↑</text><text x="64" y="332" font-size="15" fill="#506764" font-weight="600" text-anchor="middle">願意動手</text><path d="M120 310 H144 M137 304 L145 310 L137 316" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="148" y="268" width="104" height="84" rx="12" fill="#FFFFFF" stroke="#167C80" stroke-width="2.4"/><text x="200" y="304" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">AI 補位</text><text x="200" y="332" font-size="15" fill="#506764" font-weight="600" text-anchor="middle">補上地基</text><path d="M256 310 H280 M273 304 L281 310 L273 316" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="284" y="268" width="104" height="84" rx="12" fill="#167C80"/><text x="336" y="304" font-size="23" fill="#FFFFFF" font-weight="800" text-anchor="middle">成就 ↑</text><text x="336" y="332" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="middle">高品質產出</text><text x="200" y="400" font-size="22" fill="#163D40" font-weight="800" text-anchor="middle">動機，有機會拉動成就</text><text x="200" y="428" font-size="14" fill="#506764" font-weight="500" text-anchor="middle">講者觀察，非因果證據</text></g></svg>
