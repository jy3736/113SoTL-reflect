<svg xmlns="http://www.w3.org/2000/svg" width="360" height="950" viewBox="0 0 360 950" role="img" aria-labelledby="title desc"><title id="title">AI 能寫程式之後，評量要看見理解</title><desc id="desc">兩種期末組合擇優計分；這是評量安排，尚無此安排本身的效果比較。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="150" rx="18" fill="#D5E5DF"/><g transform="translate(20 38) scale(0.8)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M48 57 q-24-22-11-39 q23-25 46 0 q13 17-11 39 Z M48 66 h24 M52 76 h16 M60 4 v-4 M23 17 l-7-5 M97 17 l7-5 M17 43 h-9 M103 43 h9"/></g><text x="134" y="46" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">評量焦點</text><text x="134" y="84" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">概念＋設計思路</text><text x="134" y="119" font-size="16" fill="#506764" font-weight="500" text-anchor="start">實作附簡要設計說明</text><rect x="8" y="184" width="344" height="144" rx="18" fill="#167C80"/><g transform="translate(22 210) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3 h48 l16 16 v60 H29 Z M77 3 v17 h16 M40 36 h7 M54 36 h26 M40 52 h7 M54 52 h26 M40 68 h7 M54 68 h26"/></g><text x="137" y="222" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">期末共同部分</text><text x="137" y="261" font-size="24" fill="#FFFFFF" font-weight="800" text-anchor="start">選擇題 60 題</text><text x="137" y="299" font-size="17" fill="#FFFFFF" font-weight="500" text-anchor="start">檢查統整與應用</text><path d="M180 329 V345 H18 V757" fill="none" stroke="#167C80" stroke-width="2.5"/><path d="M18 481 L38 481" fill="none" stroke="#167C80" stroke-width="3"/><rect x="40" y="366" width="312" height="230" rx="18" fill="#F1E2D3"/><g transform="translate(136 386) scale(1)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="14" r="11"/><path d="M39 54 V38 q21-18 42 0 v16"/><rect x="20" y="48" width="80" height="29" rx="4" fill="#F7F4EC"/><path d="M10 81 h100 M42 55 l-6 7 6 7 M69 55 l6 7-6 7"/></g><text x="60" y="507" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">＋專題實作</text><text x="60" y="551" font-size="18" fill="#506764" font-weight="500" text-anchor="start">功能、架構與邏輯品質</text><path d="M18 741 L38 741" fill="none" stroke="#167C80" stroke-width="3"/><rect x="40" y="626" width="312" height="230" rx="18" fill="#F1E2D3"/><g transform="translate(136 646) scale(1)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 17 Q35 4 8 14 v57 q27-10 52 3 q25-13 52-3 V14 Q85 4 60 17 Z M60 17 v57 M20 29 h24 M20 42 h24 M20 55 h17 M77 29 l-7 8 7 8 M94 29 l7 8-7 8"/></g><text x="60" y="767" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">＋補救觀念 40 題</text><text x="60" y="811" font-size="18" fill="#506764" font-weight="500" text-anchor="start">處理器規格與核心架構</text><text x="180" y="897" font-size="22" fill="#167C80" font-weight="800" text-anchor="middle">兩組擇優計分</text><text x="180" y="932" font-size="17" fill="#506764" font-weight="500" text-anchor="middle">平時 50%・期中 20%・期末 30%</text></g></svg>