<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">今天每一頁都分清楚：做過、看到、想做</title><desc id="desc">三類平行呈現：已執行的生成式 AI 協作；有資料的報告結果；尚待驗證的 AI Agent 延伸構想。圖示為概念示意，不代表因果或已完成 Agent。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="352" height="344" rx="18" fill="#D5E5DF"/><text x="32" y="42" font-size="21" fill="#167C80" font-weight="800" text-anchor="start">已執行</text><g transform="translate(104.0 63)" fill="none" stroke="#167C80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="29" width="96" height="65" rx="6"/><path d="M19 94 v8 h70 v-8 M5 105 h100 M35 48 l-10 10 10 10 M58 48 l10 10-10 10"/><path d="M91 41 h-9 V6 h70 v37 h-45 l-16 12 Z" fill="#F7F4EC"/><path d="M96 18 h40 M96 29 h28"/><circle cx="131" cy="89" r="20" fill="#D5E5DF"/><path d="M121 89 l7 7 13-15"/></g><text x="32" y="221" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">生成式 AI 協作</text><text x="32" y="265" font-size="21" fill="#506764" font-weight="500" text-anchor="start">113 課程：LLM Coding</text><text x="32" y="297" font-size="21" fill="#506764" font-weight="500" text-anchor="start">自動批閱、活教材</text><rect x="384" y="8" width="352" height="344" rx="18" fill="#D5E5DF"/><text x="408" y="42" font-size="21" fill="#167C80" font-weight="800" text-anchor="start">有資料</text><g transform="translate(480.0 63)" fill="none" stroke="#167C80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="12" width="65" height="94" rx="7"/><rect x="24" y="5" width="32" height="15" rx="4" fill="#D5E5DF"/><path d="M20 37 l4 4 7-9 M40 37 h20"/><path d="M20 62 l4 4 7-9 M40 62 h20"/><path d="M20 87 l4 4 7-9 M40 87 h20"/><path d="M91 22 v83 h63"/><rect x="100" y="74" width="11" height="24" rx="2"/><rect x="120" y="45" width="11" height="53" rx="2"/><rect x="140" y="61" width="11" height="37" rx="2"/></g><text x="408" y="221" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">報告裡的結果</text><text x="408" y="265" font-size="21" fill="#506764" font-weight="500" text-anchor="start">四次 SIMS、45 人自評</text><text x="408" y="297" font-size="21" fill="#506764" font-weight="500" text-anchor="start">單組，不作因果宣稱</text><rect x="760" y="8" width="352" height="344" rx="18" fill="#F1E2D3"/><rect x="761" y="9" width="350" height="342" rx="18" fill="none" stroke="#A85F29" stroke-width="2" stroke-dasharray="8 7"/><text x="784" y="42" font-size="21" fill="#A85F29" font-weight="800" text-anchor="start">延伸構想</text><g transform="translate(856.0 63)" fill="none" stroke="#A85F29" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="80" cy="12" r="9"/><path d="M62 41 v-9 q18-16 36 0 v9 M80 43 v10"/><ellipse cx="80" cy="83" rx="66" ry="29" stroke-dasharray="6 6"/><rect x="23" y="70" width="26" height="26" rx="5" fill="#F7F4EC"/><rect x="67" y="70" width="26" height="26" rx="5" fill="#F7F4EC"/><rect x="111" y="70" width="26" height="26" rx="5" fill="#F7F4EC"/><path d="M49 83 h17 M93 83 h17 M29 83 h14 M80 76 v14 M117 83 l5 5 9-12"/></g><text x="784" y="221" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">AI Agent 流程</text><text x="784" y="265" font-size="21" fill="#506764" font-weight="500" text-anchor="start">113 沒有做 Agent</text><text x="784" y="297" font-size="21" fill="#506764" font-weight="500" text-anchor="start">課堂成效尚待驗證</text></g></svg>