<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1260" viewBox="0 0 360 1260" role="img" aria-labelledby="title desc"><title id="title">第 34 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="292" rx="18" fill="#D5E5DF"/><g transform="translate(26 28) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="125" y="50" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">計畫書規劃</text><text x="125" y="86" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">教材開發日誌</text><path d="M27 118 L333 118" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="154" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">報告未列時數</text><text x="28" y="190" font-size="17" fill="#506764" font-weight="500" text-anchor="start">起草、查核、維護、支援</text><text x="28" y="230" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">下一輪要補</text><text x="28" y="268" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">補記四類工時</text><rect x="8" y="323" width="344" height="292" rx="18" fill="#D5E5DF"/><g transform="translate(26 343) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 v72 h102 M22 58 l18-16 22 9 25-31 18 9"/><circle cx="40" cy="42" r="4"/><circle cx="62" cy="51" r="4"/><circle cx="87" cy="20" r="4"/></g><text x="125" y="365" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">計畫書規劃</text><text x="125" y="401" font-size="21" fill="#163D40" font-weight="800" text-anc