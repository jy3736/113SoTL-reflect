<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">人機共學的三個原則</title><desc id="desc">人機共學的三個原則。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><circle cx="186.66666666666666" cy="95" r="44" fill="#D5E5DF"/><g transform="translate(158.34666666666666 66.68) scale(1.18)"><path d="M24 23 A8 8 0 1 0 24 7 A8 8 0 1 0 24 23 M8 43 V38 Q8 28 24 28 Q40 28 40 38 V43" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="186.66666666666666" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">人為主體</text><text x="186.66666666666666" y="225" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">釐清角色</text><text x="186.66666666666666" y="269" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">AI 輔助，學生仍要思考</text><circle cx="560.0" cy="95" r="44" fill="#D5E5DF"/><g transform="translate(531.68 66.68) scale(1.18)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="560.0" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">批判素養</text><text x="560.0" y="225" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">審視與驗證</text><text x="560.0" y="269" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">主動檢查 AI 產出</text><circle cx="933.3333333333333" cy="95" r="44" fill="#F1E2D3"/><g transform="translate(905.0133333333332 66.68) scale(1.18)"><path d="M24 22 A7 7 0 1 0 24 8 A7 7 0 1 0 24 22 M12 43 V37 Q12 28 24 28 Q36 28 36 37 V43 M7 25 A5 5 0 1 0 7 15 M41 25 A5 5 0 1 1 41 15 M3 32 V42 M45 32 V42" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="933.3333333333333" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#A85F29">共學文化</text><text x="933.3333333333333" y="225" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">協作式任務</text><text x="933.3333333333333" y="269" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">善用工具，不依賴解答</text></g></svg>