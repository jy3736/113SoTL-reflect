<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">自然班級的追蹤設計，有所得也有所限</title><desc id="desc">自然班級的追蹤設計，有所得也有所限。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><circle cx="280.0" cy="95" r="44" fill="#D5E5DF"/><g transform="translate(251.68 66.68) scale(1.18)"><path d="M24 22 A7 7 0 1 0 24 8 A7 7 0 1 0 24 22 M12 43 V37 Q12 28 24 28 Q36 28 36 37 V43 M7 25 A5 5 0 1 0 7 15 M41 25 A5 5 0 1 1 41 15 M3 32 V42 M45 32 V42" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="280.0" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">換到的</text><text x="280.0" y="225" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">真實、可行</text><text x="280.0" y="269" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">保留原班級</text><text x="280.0" y="303" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">同一班追蹤四次</text><circle cx="840.0" cy="95" r="44" fill="#F1E2D3"/><g transform="translate(811.68 66.68) scale(1.18)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="840.0" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#A85F29">付出的</text><text x="840.0" y="225" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">因果推論受限</text><text x="840.0" y="269" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">沒有對照組</text><text x="840.0" y="303" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">其他因素難以排除</text></g></svg>