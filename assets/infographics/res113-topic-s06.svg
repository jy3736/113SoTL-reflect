<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">兩個困難，同時要面對</title><desc id="desc">兩個困難，同時要面對。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">兩個困難，同時要面對</text><circle cx="140" cy="172" r="94" fill="#D5E5DF"/><circle cx="260" cy="172" r="94" fill="#F1E2D3" fill-opacity=".8"/><text x="118" y="156" text-anchor="middle" font-size="29" font-weight="800" fill="#167C80">低動機</text><text x="118" y="194" text-anchor="middle" font-size="21" font-weight="700" fill="#506764">不想投入</text><text x="283" y="156" text-anchor="middle" font-size="29" font-weight="800" fill="#A85F29">低成就</text><text x="283" y="194" text-anchor="middle" font-size="21" font-weight="700" fill="#506764">學習受挫</text><path d="M200 270 V307" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(174.8 323.8) scale(1.05)"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200" y="406" text-anchor="middle" font-size="24" font-weight="800" fill="#163D40">回到課程與支援設計</text></g></svg>