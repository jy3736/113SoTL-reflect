<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">雙低：低學習動機與低學習成就同時出現</title><desc id="desc">左圈為低動機，右圈為低成就；深色交集明確標示雙低，表示兩者同時出現。箭頭指向課程與支援設計，為教學回應示意，不代表因果證據。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="30" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">兩個困難，同時要面對</text><text x="200" y="62" font-size="17" fill="#506764" font-weight="500" text-anchor="middle">交集＝低動機與低成就同時出現</text><circle cx="140" cy="172" r="94" fill="#D5E5DF"/><circle cx="260" cy="172" r="94" fill="#F1E2D3"/><defs><clipPath id="low-motivation-circle"><circle cx="140" cy="172" r="94"/></clipPath></defs><circle cx="260" cy="172" r="94" fill="#167C80" clip-path="url(#low-motivation-circle)"/><text x="103" y="157" font-size="27" fill="#167C80" font-weight="800" text-anchor="middle">低動機</text><text x="103" y="194" font-size="20" fill="#506764" font-weight="600" text-anchor="middle">不想投入</text><text x="297" y="157" font-size="27" fill="#A85F29" font-weight="800" text-anchor="middle">低成就</text><text x="297" y="194" font-size="20" fill="#506764" font-weight="600" text-anchor="middle">學習受挫</text><text x="200" y="181" font-size="25" fill="#FFFFFF" font-weight="800" text-anchor="middle">雙低</text><path d="M200 274 V310 M194 302 L200 312 L206 302" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(175 325)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34"/></g><text x="200" y="406" font-size="24" fill="#163D40" font-weight="800" text-anchor="middle">回到課程與支援設計</text></g></svg>