<svg xmlns="http://www.w3.org/2000/svg" width="360" height="878" viewBox="0 0 360 878" role="img" aria-labelledby="title desc"><title id="title">四個可以帶回自己課堂的做法</title><desc id="desc">四個可以帶回自己課堂的做法。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><circle cx="58" cy="50" r="29" fill="#D5E5DF"/><g transform="translate(38.8 30.799999999999997) scale(0.8)"><path d="M4 6 H44 V31 H4 Z M11 15 H25 M11 23 H35 M24 31 V43 M16 43 H32" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="57" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">分階段</text><text x="23" y="130" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">AI 慢慢放進來</text><text x="23" y="168" text-anchor="start" font-size="19" font-weight="500" fill="#506764">先打基礎，再正式協作</text><circle cx="58" cy="262" r="29" fill="#D5E5DF"/><g transform="translate(38.8 242.8) scale(0.8)"><path d="M24 43 A19 19 0 1 0 24 5 A19 19 0 1 0 24 43 M24 34 A10 10 0 1 0 24 14 A10 10 0 1 0 24 34 M24 24 L43 5 M34 5 H43 V14" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="269" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">給選擇</text><text x="23" y="342" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">同題多條路</text><text x="23" y="380" text-anchor="start" font-size="19" font-weight="500" fill="#506764">也預想補救路徑</text><circle cx="58" cy="474" r="29" fill="#D5E5DF"/><g transform="translate(38.8 454.8) scale(0.8)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="481" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">看兩面</text><text x="23" y="554" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">好壞一起看</text><text x="23" y="592" text-anchor="start" font-size="19" font-weight="500" fill="#506764">平均之外，也看分散</text><circle cx="58" cy="686" r="29" fill="#F1E2D3"/><g transform="translate(38.8 666.8) scale(0.8)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="693" text-anchor="start" font-size="22" font-weight="800" fill="#A85F29">對證據</text><text x="23" y="766" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">每題回頭查</text><text x="23" y="804" text-anchor="start" font-size="19" font-weight="500" fill="#506764">規劃先想資料，結案核對</text></g></svg>