<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1136" viewBox="0 0 360 1136" role="img" aria-labelledby="title desc"><title id="title">「活」教材：從卡關訊號，到下一輪更新</title><desc id="desc">Notion、影音與形成性評量支援課堂回饋；流程圖為報告內容的整理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="40" y="8" width="312" height="242" rx="18" fill="#D5E5DF"/><text x="58" y="39" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">01 察覺</text><g transform="translate(136.0 57)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="20" r="11"/><path d="M5 69 V49 q17-18 34 0 v20 M53 7 h59 v37 H84 L70 58 V44 H53 Z M67 21 h29 M67 32 h18"/><rect x="54" y="63" width="58" height="17" rx="3"/><path d="M64 71 h7 M78 71 h7 M93 71 h7"/></g><text x="58" y="167" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">找到卡關點</text><text x="58" y="208" font-size="18" fill="#506764" font-weight="500" text-anchor="start">提問、課堂觀察、Zuvio</text><path d="M196 254 v18 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.5"/><rect x="40" y="278" width="312" height="242" rx="18" fill="#D5E5DF"/><text x="58" y="309" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">02 起草</text><g transform="translate(136.0 327)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 h45 l15 16 v60 H9 Z M54 5 v17 h15 M21 37 h30 M21 51 h30 M21 65 h21"/><path d="M79 8 h35 v36 H96 L85 55 V44 H79 Z" fill="#F7F4EC"/><path d="M88 21 l-4 5 4 5 M102 21 l4 5-4 5 M80 70 h34 M100 63 l14 7-14 7"/></g><text x="58" y="437" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">AI 補說明與例題</text><text x="58" y="478" font-size="18" fill="#506764" font-weight="500" text-anchor="start">回應學生當下的需要</text><path d="M196 524 v18 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.5"/><rect x="40" y="548" width="312" height="242" rx="18" fill="#D5E5DF"/><text x="58" y="579" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">03 查核</text><g transform="translate(136.0 597)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="18" r="11"/><path d="M4 68 V47 q18-18 36 0 v21"/><rect x="53" y="7" width="61" height="72" rx="5"/><path d="M65 26 l5 5 10-13 M88 26 h13 M65 48 l5 5 10-13 M88 48 h13 M65 67 h36"/></g><text x="58" y="707" font-size="23" fill="#167C80" font-weight="800" text-anchor="start">教師驗證與修正</text><text x="58" y="748" font-size="18" fill="#506764" font-weight="500" text-anchor="start">概念、答案、例子要對</text><path d="M196 794 v18 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.5"/><rect x="40" y="818" width="312" height="242" rx="18" fill="#F1E2D3"/><text x="58" y="849" font-size="20" fill="#A85F29" font-weight="800" text-anchor="start">04 更新</text><g transform="translate(136.0 867)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="110" height="75" rx="6"/><path d="M4 20 h110 M14 12 h0 M23 12 h0 M32 12 h0"/><path d="M59 38 q-17-10-34-3 v31 q17-6 34 3 q17-9 34-3 V35 q-17-7-34 3 Z M59 38 v31"/></g><text x="58" y="977" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">補進 Notion 教材</text><text x="58" y="1018" font-size="18" fill="#506764" font-weight="500" text-anchor="start">再觀察學生如何使用</text><path d="M196 1065 V1092 H14 V129 H37 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="1121" font-size="18" fill="#167C80" font-weight="700" text-anchor="middle">更新後，再看學生回應</text></g></svg>