<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">帶回自己的一門課：四個可以開始的做法</title><desc id="desc">本頁為報告與本次反思的實務整理；應依各課程情境調整。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="20" y="26" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">帶回自己的課</text><text x="644" y="26" font-size="22" fill="#A85F29" font-weight="800" text-anchor="start">一起準備的條件</text><rect x="8" y="44" width="480" height="135" rx="18" fill="#D5E5DF"/><text x="32" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">設計課程</text><text x="32" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">先建立基礎，再逐步加入 AI</text><rect x="632" y="44" width="480" height="135" rx="18" fill="#F1E2D3"/><text x="656" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">留出選擇</text><text x="656" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">同題多路徑，也備補救選項</text><path d="M504 111.5 L616 111.5" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="98.5" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">搭配</text><rect x="8" y="191" width="480" height="135" rx="18" fill="#D5E5DF"/><text x="32" y="228" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">看見學生</text><text x="32" y="261" font-size="20" fill="#506764" font-weight="500" text-anchor="start">同時看動機、分散與回饋</text><rect x="632" y="191" width="480" height="135" rx="18" fill="#F1E2D3"/><text x="656" y="228" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">對回證據</text><text x="656" y="261" font-size="20" fill="#506764" font-weight="500" text-anchor="start">每個結論配得上手上的資料</text><path d="M504 258.5 L616 258.5" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="245.5" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">搭配</text></g></svg>