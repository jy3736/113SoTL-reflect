<svg xmlns="http://www.w3.org/2000/svg" width="360" height="945" viewBox="0 0 360 945" role="img" aria-labelledby="title desc"><title id="title">第 39 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="292" rx="18" fill="#D5E5DF"/><g transform="translate(26 28) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 17 Q35 4 8 14 v57 q27-10 52 3 q25-13 52-3 V14 Q85 4 60 17 Z M60 17 v57 M20 29 h24 M20 42 h24 M20 55 h17 M77 29 l-7 8 7 8 M94 29 l7 8-7 8"/></g><text x="125" y="50" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">113 的負荷</text><text x="125" y="86" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">教材：起草負荷</text><path d="M27 118 L333 118" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="154" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">Agent 分批起草</text><text x="28" y="190" font-size="17" fill="#506764" font-weight="500" text-anchor="start">依大綱起草，留下紀錄</text><text x="28" y="230" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">教師必須把關</text><text x="28" y="268" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">教師查概念與範例</text><rect x="8" y="323" width="344" height="292" rx="18" fill="#D5E5DF"/><g transform="translate(26 343) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="125" y="365" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">113 的負荷</text><text x="125" y="401" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">評量：出題與批閱</text><path d="M27 433 L333 433" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="469" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">產生題目、測資、程式</text><text x="28" y="505" font-size="17" fill="#506764" font-weight="500" text-anchor="start">先產生草稿，再逐一查核</text><text x="28" y="545" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">教師必須把關</text><text x="28" y="583" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">教師驗答案與測資</text><rect x="8" y="638" width="344" height="292" rx="18" fill="#D5E5DF"/><g transform="translate(26 658) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="125" y="680" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">113 的負荷</text><text x="125" y="716" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">追蹤：資料看不完</text><path d="M27 748 L333 748" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="784" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">整理問卷與進度摘要</text><text x="28" y="820" font-size="17" fill="#506764" font-weight="500" text-anchor="start">整理訊號，不能代替判斷</text><text x="28" y="860" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">教師必須把關</text><text x="28" y="898" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">教師決定怎麼介入</text></g></svg>