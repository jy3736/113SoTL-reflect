<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">PEA 每週循環</title><desc id="desc">P 預習（課前＋課初 15 分）：先看過，不求全懂，影片、Podcast、數位教材，可重做的預習評量；E 參與（課中）：聽講・討論・實作，IRS、課堂溫度計、選我選我，小組討論、自動批閱實作；A 評估（課末 20 分）：形成性評量檢核，可重做的多選題，學生自檢、老師看整體。老師依課堂觀察與評量數據，修正、補強下週內容。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="6" width="348" height="268" rx="14" fill="#D5E5DF"/><circle cx="70" cy="66" r="44" fill="#167C80"/><text x="70" y="84" fill="#fff" font-size="50" font-weight="800" text-anchor="middle">P</text><text x="130" y="56" fill="#163D40" font-size="30" font-weight="800" text-anchor="start">預習</text><text x="130" y="92" fill="#167C80" font-size="20" font-weight="700" text-anchor="start">課前＋課初 15 分</text><text x="30" y="158" fill="#163D40" font-size="26" font-weight="800" text-anchor="start">先看過，不求全懂</text><text x="30" y="204" fill="#506764" font-size="21" font-weight="500" text-anchor="start">影片、Podcast、數位教材</text><text x="30" y="240" fill="#506764" font-size="21" font-weight="500" text-anchor="start">可重做的預習評量</text><path d="M358 140 L384 140" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="386" y="6" width="348" height="268" rx="14" fill="#D5E5DF"/><circle cx="448" cy="66" r="44" fill="#163D40"/><text x="448" y="84" fill="#fff" font-size="50" font-weight="800" text-anchor="middle">E</text><text x="508" y="56" fill="#163D40" font-size="30" font-weight="800" text-anchor="start">參與</text><text x="508" y="92" fill="#167C80" font-size="20" font-weight="700" text-anchor="start">課中</text><text x="408" y="158" fill="#163D40" font-size="26" font-weight="800" text-anchor="start">聽講・討論・實作</text><text x="408" y="204" fill="#506764" font-size="21" font-weight="500" text-anchor="start">IRS、課堂溫度計、選我選我</text><text x="408" y="240" fill="#506764" font-size="21" font-weight="500" text-anchor="start">小組討論、自動批閱實作</text><path d="M736 140 L762 140" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="764" y="6" width="348" height="268" rx="14" fill="#D5E5DF"/><circle cx="826" cy="66" r="44" fill="#167C80"/><text x="826" y="84" fill="#fff" font-size="50" font-weight="800" text-anchor="middle">A</text><text x="886" y="56" fill="#163D40" font-size="30" font-weight="800" text-anchor="start">評估</text><text x="886" y="92" fill="#167C80" font-size="20" font-weight="700" text-anchor="start">課末 20 分</text><text x="786" y="158" fill="#163D40" font-size="26" font-weight="800" text-anchor="start">形成性評量檢核</text><text x="786" y="204" fill="#506764" font-size="21" font-weight="500" text-anchor="start">可重做的多選題</text><text x="786" y="240" fill="#506764" font-size="21" font-weight="500" text-anchor="start">學生自檢、老師看整體</text><path d="M930 276 V312 M190 312 V280" fill="none" stroke="#A85F29" stroke-width="3" stroke-dasharray="7 6"/><path d="M190 296 V278" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="120" y="292" width="880" height="58" rx="14" fill="#F1E2D3"/><text x="560" y="330" fill="#A85F29" font-size="25" font-weight="800" text-anchor="middle">老師看課堂觀察＋評量數據，修正、補強下週內容</text></g></svg>