<svg xmlns="http://www.w3.org/2000/svg" width="360" height="492" viewBox="0 0 360 492" role="img" aria-labelledby="title desc"><title id="title">帶回自己的一門課：四個可以開始的做法</title><desc id="desc">本頁為報告與本次反思的實務整理；應依各課程情境調整。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="36" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">帶回自己的課</text><text x="24" y="67" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">設計課程</text><text x="24" y="94" font-size="18" fill="#506764" font-weight="500" text-anchor="start">先建立基礎，再逐步加入 AI</text><path d="M24 109 L336 109" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="134" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">一起準備的條件</text><text x="24" y="165" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">留出選擇</text><text x="24" y="193" font-size="18" fill="#506764" font-weight="500" text-anchor="start">同題多路徑，也備補救選項</text><rect x="8" y="232" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="260" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">帶回自己的課</text><text x="24" y="291" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">看見學生</text><text x="24" y="318" font-size="18" fill="#506764" font-weight="500" text-anchor="start">同時看動機、分散與回饋</text><path d="M24 333 L336 333" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="358" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">一起準備的條件</text><text x="24" y="389" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">對回證據</text><text x="24" y="417" font-size="18" fill="#506764" font-weight="500" text-anchor="start">每個結論配得上手上的資料</text></g></svg>