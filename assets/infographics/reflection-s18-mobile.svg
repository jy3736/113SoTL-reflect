<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1036" viewBox="0 0 360 1036" role="img" aria-labelledby="title desc"><title id="title">自動批閱：讓提交、回饋、修正接成一圈</title><desc id="desc">62.2% 選為喜愛的教法（45 人複選）；偏好與功能測試都不能代替理解測量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="40" y="8" width="312" height="140" rx="18" fill="#D5E5DF"/><text x="58" y="38" font-size="19" fill="#167C80" font-weight="800" text-anchor="start">HDLBits</text><text x="58" y="64" font-size="17" fill="#163D40" font-weight="600" text-anchor="start">指定 71 題・班平均 62 題</text><line x1="58" y1="80" x2="334" y2="80" stroke="#FFFFFF" stroke-width="2"/><text x="58" y="108" font-size="19" fill="#A85F29" font-weight="800" text-anchor="start">Verilog 自動批閱</text><text x="58" y="134" font-size="17" fill="#163D40" font-weight="600" text-anchor="start">平時 25 題・期中 4 題・期末 12 組</text><rect x="40" y="168" width="312" height="242" rx="18" fill="#D5E5DF"/><text x="60" y="199" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">提交</text><g transform="translate(136.0 215) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="14" r="11"/><path d="M39 54 V38 q21-18 42 0 v16"/><rect x="20" y="48" width="80" height="29" rx="4" fill="#F7F4EC"/><path d="M10 81 h100 M42 55 l-6 7 6 7 M69 55 l6 7-6 7"/></g><text x="60" y="326" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">學生交程式</text><text x="60" y="369" font-size="18" fill="#506764" font-weight="500" text-anchor="start">留下實作結果</text><path d="M196 414 V433 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="440" width="312" height="242" rx="18" fill="#D5E5DF"/><text x="60" y="471" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">比對</text><g transform="translate(136.0 487) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="60" y="598" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">自動測試功能</text><text x="60" y="641" font-size="18" fill="#506764" font-weight="500" text-anchor="start">標準答案與測資</text><path d="M196 686 V705 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="712" width="312" height="242" rx="18" fill="#F1E2D3"/><text x="60" y="743" font-size="20" fill="#A85F29" font-weight="800" text-anchor="start">回饋</text><g transform="translate(136.0 759) scale(1)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="78" height="55" rx="5"/><path d="M18 24 h47 M18 38 h35 M34 62 v12 M20 76 h54 M110 22.9 A14 14 0 1 1 96 22.9 M88.1 21.5 L96 22.9 L93.3 30.4"/></g><text x="60" y="870" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">學生修正再試</text><text x="60" y="913" font-size="18" fill="#506764" font-weight="500" text-anchor="start">錯誤訊息與測試結果</text><path d="M196 960 V989 H14 V289.0 H37 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="1020" font-size="17" fill="#167C80" font-weight="700" text-anchor="middle">修正後再提交；功能 ≠ 理解</text></g></svg>