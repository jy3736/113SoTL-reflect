<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">SIMS十六題分屬四構面，各有四題，不能只看一個總分</title><desc id="desc">SIMS十六題分屬四構面，各有四題，不能只看一個總分。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="260" height="340" rx="18" fill="#D5E5DF"/><text x="26" y="40" font-size="23" fill="#167C80" font-weight="800" text-anchor="start">內在動機</text><g transform="translate(78 60) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 5 l15 24 29 5-21 22 4 27-27-13-27 13 4-27-21-22 29-5 Z"/></g><text x="138" y="187" font-size="21" fill="#163D40" font-weight="800" text-anchor="middle">因為有趣</text><text x="26" y="228" font-size="16" fill="#506764" font-weight="500" text-anchor="start">題號</text><rect x="26" y="251" width="42" height="48" rx="18" fill="#F7F4EC"/><text x="47.0" y="285" font-size="24" fill="#167C80" font-weight="800" text-anchor="middle">1</text><rect x="82" y="251" width="42" height="48" rx="18" fill="#F7F4EC"/><text x="103.0" y="285" font-size="24" fill="#167C80" font-weight="800" text-anchor="middle">5</text><rect x="138" y="251" width="42" height="48" rx="18" fill="#F7F4EC"/><text x="159.0" y="285" font-size="24" fill="#167C80" font-weight="800" text-anchor="middle">9</text><rect x="194" y="251" width="42" height="48" rx="18" fill="#F7F4EC"/><text x="215.0" y="285" font-size="24" fill="#167C80" font-weight="800" text-anchor="middle">13</text><rect x="288" y="8" width="260" height="340" rx="18" fill="#D5E5DF"/><text x="306" y="40" font-size="23" fill="#167C80" font-weight="800" text-anchor="start">認同調節</text><g transform="translate(358 60) scale(1)" fill=