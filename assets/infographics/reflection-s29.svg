<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">同一句英文，前後測的中文卻不同</title><desc id="desc">定稿表二已列 p = .075；筆記提供含題／排除比較，未重新取得原始資料重算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="20" y="26" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">量測問題／分析筆記</text><text x="644" y="26" font-size="22" fill="#A85F29" font-weight="800" text-anchor="start">核對與定稿結果</text><rect x="8" y="44" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">前後測用語不同</text><text x="32" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">「別無選擇」／「一定得來」</text><rect x="632" y="44" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">先核對題項版本</text><text x="656" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">英文相同，中文翻譯不一致</text><path d="M504 90.0 L616 90.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="77.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">核對</text><rect x="8" y="148" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">筆記：含第 11 題</text><text x="32" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">前測 α .357；成長 +0.68</text><rect x="632" y="148" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">筆記：排除第 11 題</text><text x="656" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">前測 α .925；成長 +0.27</text><path d="M504 194.0 L616 194.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="181.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">核對</text><rect x="8" y="252" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">筆記敏感度比較</text><text x="32" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">含題 p &lt; .001；排除 p = .075</text><rect x="632" y="252" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">定稿報告表二</text><text x="656" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">p = .075，已列為未達顯著</text><path d="M504 298.0 L616 298.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="285.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">核對</text></g></svg>