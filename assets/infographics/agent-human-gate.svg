<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">Agent 可以整理與建議；介入學生的決定留給老師</title><desc id="desc">觀察，整合學習紀錄，練習、測驗、回饋，保留來源與時間；建議，標出可能卡關，附上證據，老師可以修正；教師決定，選擇介入方式，補教材、改節奏，或個別談；追蹤，下次再檢視，還需要支持嗎？，判斷有沒有對</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8.0" y="80" width="243.0" height="210" rx="14" fill="#D5E5DF"/><text x="30.0" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">觀察</text><text x="30.0" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">整合學習紀錄</text><text x="30.0" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">練習、測驗、回饋</text><text x="30.0" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">保留來源與時間</text><path d="M256.0 185 L289.0 185" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="295.0" y="80" width="243.0" height="210" rx="14" fill="#D5E5DF"/><text x="317.0" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">建議</text><text x="317.0" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">標出可能卡關</text><text x="317.0" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">附上證據</text><text x="317.0" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">老師可以修正</text><path d="M543.0 185 L576.0 185" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="582.0" y="80" width="243.0" height="210" rx="14" fill="#F1E2D3"/><text x="604.0" y="120" fill="#A85F29" font-size="24" font-weight="800" text-anchor="start">教師決定</text><text x="604.0" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">選擇介入方式</text><text x="604.0" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">補教材、改節奏</text><text x="604.0" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">或個別談</text><path d="M830.0 185 L863.0 185" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="869.0" y="80" width="243.0" height="210" rx="14" fill="#D5E5DF"/><text x="891.0" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">追蹤</text><text x="891.0" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">下次再檢視</text><text x="891.0" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">還需要支持嗎？</text><text x="891.0" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">判斷有沒有對</text></g></svg>