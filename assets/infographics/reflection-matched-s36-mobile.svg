<svg xmlns="http://www.w3.org/2000/svg" width="360" height="852" viewBox="0 0 360 852" role="img" aria-labelledby="title desc"><title id="title">第 36 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 30) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="118" y="45" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">這一輪看見</text><text x="118" y="82" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">動機缺乏升高</text><path d="M26 118 L334 118" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="152" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">下一輪建議</text><text x="28" y="191" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">中段診斷與歷程追蹤</text><text x="28" y="233" font-size="17" fill="#506764" font-weight="500" text-anchor="start">在期末前看見卡關訊號</text><rect x="8" y="292" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 314) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 77 h27 V56 h26 V34 h26 V12 h24 M17 67 h9 M43 46 h9 M69 24 h9"/></g><text x="118" y="329" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">這一輪看見</text><text x="118" y="366" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">學生回饋負荷過高</text><path d="M26 402 L334 402" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="436" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">下一輪建議</text><text x="28" y="475" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">任務設明確難度階梯</text><text x="28" y="517" font-size="17" fill="#506764" font-weight="500" text-anchor="start">引導提示、模組範例、進階挑戰</text><rect x="8" y="576" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 598) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="118" y="613" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">這一輪看見</text><text x="118" y="650" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">後段整合時間吃緊</text><path d="M26 686 L334 686" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="720" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">下一輪建議</text><text x="28" y="759" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">重分配時數，專題拆關卡</text><text x="28" y="801" font-size="17" fill="#506764" font-weight="500" text-anchor="start">精簡前段練習，留後段整合時間</text></g></svg>