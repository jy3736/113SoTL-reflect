<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">下一輪怎麼改，要接回這一輪看到什麼</title><desc id="desc">右欄為報告建議與本次整理，尚未驗證調整成效。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="20" y="26" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">這一輪看見</text><text x="644" y="26" font-size="22" fill="#A85F29" font-weight="800" text-anchor="start">下一輪建議</text><rect x="8" y="44" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">動機缺乏升高</text><text x="32" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">需要在期末之前看見卡關</text><rect x="632" y="44" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">中段診斷</text><text x="656" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">動機與歷程紀錄一起看</text><path d="M504 90.0 L616 90.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="77.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">設計</text><rect x="8" y="148" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">學生回饋負荷過高</text><text x="32" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">希望有中間階段的任務</text><rect x="632" y="148" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">任務設難度階梯</text><text x="656" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">提示、模組化範例、進階挑戰</text><path d="M504 194.0 L616 194.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="181.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">設計</text><rect x="8" y="252" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">後段整合時間吃緊</text><text x="32" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">第三階段僅少數完成上板</text><rect x="632" y="252" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">重分配教學時數</text><text x="656" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">精簡前段練習，專題拆小關卡</text><path d="M504 298.0 L616 298.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="285.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">設計</text></g></svg>