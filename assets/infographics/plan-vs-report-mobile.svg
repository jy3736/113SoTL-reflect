<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1358" viewBox="0 0 360 1358" role="img" aria-labelledby="title desc"><title id="title">計畫書規劃的，報告交出了什麼</title><desc id="desc">教材開發日誌未列時數；成績分布未分析；與學生共設計 AI 助教未交代；情境動機由兩次增為四次。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="6" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="32" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">計畫書規劃</text><text x="24" y="62" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">教材開發日誌</text><text x="24" y="90" fill="#506764" font-size="17" font-weight="500" text-anchor="start">每週記錄備課時間</text><rect x="8" y="112" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="138" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">報告交出</text><text x="24" y="168" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">沒有列出時數</text><text x="24" y="196" fill="#506764" font-size="17" font-weight="500" text-anchor="start">只有文字描述</text><rect x="8" y="218" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="244" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">下一輪要補</text><text x="24" y="274" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">記四類工時</text><text x="24" y="302" fill="#506764" font-size="17" font-weight="500" text-anchor="start">起草、查核、維護、支援</text><rect x="8" y="344" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="370" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">計畫書規劃</text><text x="24" y="400" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">班級成績分布</text><text x="24" y="428" fill="#506764" font-size="17" font-weight="500" text-anchor="start">低成就者有沒有靠攏</text><rect x="8" y="450" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="476" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">報告交出</text><text x="24" y="506" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">未呈現成績分析</text><text x="24" y="534" fill="#506764" font-size="17" font-weight="500" text-anchor="start">報告主要呈現動機資料</text><rect x="8" y="556" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="582" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">下一輪要補</text><text x="24" y="612" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">看逐人變化</text><text x="24" y="640" fill="#506764" font-size="17" font-weight="500" text-anchor="start">中段標記、後續追蹤</text><rect x="8" y="682" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="708" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">計畫書規劃</text><text x="24" y="738" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">與學生共設計 AI 助教</text><text x="24" y="766" fill="#506764" font-size="17" font-weight="500" text-anchor="start">自評「不確定性最高」</text><rect x="8" y="788" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="814" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">報告交出</text><text x="24" y="844" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">報告沒有交代</text><text x="24" y="872" fill="#506764" font-size="17" font-weight="500" text-anchor="start">做到哪裡沒有寫</text><rect x="8" y="894" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="920" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">下一輪要補</text><text x="24" y="950" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">補說執行情形</text><text x="24" y="978" fill="#506764" font-size="17" font-weight="500" text-anchor="start">未報告不等於未執行</text><rect x="8" y="1020" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="1046" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">計畫書規劃</text><text x="24" y="1076" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">情境動機兩次</text><text x="24" y="1104" fill="#506764" font-size="17" font-weight="500" text-anchor="start">學期前後 t 檢定</text><rect x="8" y="1126" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="1152" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">報告交出</text><text x="24" y="1182" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">實際測了四次</text><text x="24" y="1210" fill="#506764" font-size="17" font-weight="500" text-anchor="start">才看得到第 3 次低點</text><rect x="8" y="1232" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="1258" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">下一輪要補</text><text x="24" y="1288" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">題目一字不差</text><text x="24" y="1316" fill="#506764" font-size="17" font-weight="500" text-anchor="start">第 11 題的教訓</text></g></svg>