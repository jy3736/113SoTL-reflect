<svg xmlns="http://www.w3.org/2000/svg" width="360" height="806" viewBox="0 0 360 806" role="img" aria-labelledby="title desc"><title id="title">有人做不完，保留一條回到概念的路</title><desc id="desc">補救路徑非原計畫內容；報告沒有前後比較可驗證其效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="40" y="8" width="312" height="242" rx="18" fill="#D5E5DF"/><text x="60" y="39" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">看見瓶頸</text><g transform="translate(136.0 55) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="81" height="58" rx="5"/><path d="M19 27 l-7 8 7 8 M42 27 l7 8-7 8 M33 66 v11 M18 79 h32"/><circle cx="93" cy="50" r="24" fill="#F7F4EC"/><path d="M85 42 q0-12 14-8 q12 5-2 14 l-4 5 M93 64 h0"/></g><text x="60" y="166" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">專題難以完成</text><text x="60" y="209" font-size="18" fill="#506764" font-weight="500" text-anchor="start">RTL 設計與驗證卡關</text><path d="M196 254 V273 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="280" width="312" height="242" rx="18" fill="#D5E5DF"/><text x="60" y="311" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">調整任務</text><g transform="translate(136.0 327) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14 q22-10 45 2 v59 q-23-12-45-2 Z M52 16 q23-12 46-2 v59 q-23-10-46 2 Z"/><rect x="66" y="29" width="50" height="37" rx="5" fill="#F7F4EC"/><path d="M85 37 l17 11-17 11 Z"/></g><text x="60" y="438" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">改讀規格書與影片</text><text x="60" y="481" font-size="