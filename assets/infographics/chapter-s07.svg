<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 07 頁主題導讀</title><desc id="desc">本頁三個主題使用相同版型；概念示意，不表示數量或成效。反思頁箭頭表示閱讀順序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="384" height="108" rx="18" fill="#D5E5DF"/><g transform="translate(24 29) scale(0.76)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="81" height="58" rx="5"/><path d="M19 27 l-7 8 7 8 M42 27 l7 8-7 8 M33 66 v11 M18 79 h32"/><circle cx="93" cy="50" r="24" fill="#F7F4EC"/><path d="M85 42 q0-12 14-8 q12 5-2 14 l-4 5 M93 64 h0"/></g><text x="134" y="50" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">學生端的卡關</text><text x="134" y="88" font-size="18" fill="#506764" font-weight="500" text-anchor="start">動機、成就與個別差異</text><rect x="8" y="134" width="384" height="108" rx="18" fill="#D5E5DF"/><g transform="translate(24 155) scale(0.76)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="134" y="176" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">教師端的負荷</text><text x="134" y="214" font-size="18" fill="#506764" font-weight="500" text-anchor="start">教材、評量與驗證</text><rect x="8" y="260" width="384" height="108" rx="18" fill="#F1E2D3"/><g transform="translate(24 281) scale(0.76)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="134" y="302" font-size="24" fill="#163D40" font-weight="800" text-ancho