<svg xmlns="http://www.w3.org/2000/svg" width="360" height="778" viewBox="0 0 360 778" role="img" aria-labelledby="title desc"><title id="title">113 計畫摘要：四階段教學模式</title><desc id="desc">四個教學階段由基礎導入、模組設計、RTL 合成到 AI 協作專題逐步上升，AI 協作逐步加深；學生依能力自選 LLM Coding 或 Vibe Coding；每階段一輪 SIMS 追蹤動機；多層次評量含形成性選擇題、自動批閱 Verilog 與專題鷹架檢核。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="8" y="26" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">四階段教學模式</text><text x="352" y="26" font-size="15" fill="#A85F29" font-weight="800" text-anchor="end">AI 協作逐步加深</text><rect x="8" y="44" width="226" height="74" rx="18" fill="#E7EFEB"/><text x="24" y="70" font-size="14" fill="#167C80" font-weight="800" text-anchor="start">階段 1</text><text x="24" y="100" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">基礎導入</text><text x="218" y="74" font-size="14" fill="#506764" font-weight="600" text-anchor="end">布林・Verilog</text><circle cx="256" cy="81" r="13" fill="#A85F29"/><text x="256" y="86" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">1</text><rect x="8" y="130" width="254" height="74" rx="18" fill="#D5E5DF"/><text x="24" y="156" font-size="14" fill="#167C80" font-weight="800" text-anchor="start">階段 2</text><text x="24" y="186" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">模組設計</text><text x="246" y="160" font-size="14" fill="#506764" font-weight="600" text-anchor="end">模組化・FSM</text><text x="246" y="186" font-size="14" fill="#A85F29" font-weight="800" text-anchor="end">AI 初探</text><circle cx="284" cy="167" r="13" fill="#A85F29"/><text x="284" y="172" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">2</text><rect x="8" y="216" width="282" height="74" rx="18" fill="#C2DCD4"/><text x="24" y="242" font-size="14" fill="#167C80" font-weight="800" text-anchor="start">階段 3</text><text x="24" y="272" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">RTL 合成</text><text x="274" y="246" font-size="14" fill="#506764" font-weight="600" text-anchor="end">可合成 RTL</text><text x="274" y="272" font-size="14" fill="#A85F29" font-weight="800" text-anchor="end">LLM Coding</text><circle cx="312" cy="253" r="13" fill="#A85F29"/><text x="312" y="258" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">3</text><rect x="8" y="302" width="310" height="74" rx="18" fill="#ADD1C7"/><text x="24" y="328" font-size="14" fill="#167C80" font-weight="800" text-anchor="start">階段 4</text><text x="24" y="358" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">AI 協作專題</text><text x="302" y="332" font-size="14" fill="#506764" font-weight="600" text-anchor="end">Toy-Processor</text><text x="302" y="358" font-size="14" fill="#A85F29" font-weight="800" text-anchor="end">分層實作</text><circle cx="340" cy="339" r="13" fill="#A85F29"/><text x="340" y="344" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">4</text><text x="352" y="404" font-size="14" fill="#A85F29" font-weight="800" text-anchor="end">● SIMS 四輪追蹤動機</text><path d="M180 412 V438 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="8" y="466" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">學生依能力自選協作模式</text><rect x="8" y="478" width="168" height="96" rx="18" fill="#fff"/><rect x="8" y="478" width="168" height="96" rx="18" fill="none" stroke="#167C80" stroke-width="2"/><text x="92" y="512" font-size="20" fill="#167C80" font-weight="800" text-anchor="middle">LLM Coding</text><text x="92" y="540" font-size="14" fill="#506764" font-weight="600" text-anchor="middle">主動投入</text><text x="92" y="560" font-size="14" fill="#506764" font-weight="600" text-anchor="middle">設計理解</text><rect x="184" y="478" width="168" height="96" rx="18" fill="#F1E2D3"/><rect x="184" y="478" width="168" height="96" rx="18" fill="none" stroke="#A85F29" stroke-width="2"/><text x="268" y="512" font-size="20" fill="#A85F29" font-weight="800" text-anchor="middle">Vibe Coding</text><text x="268" y="540" font-size="14" fill="#506764" font-weight="600" text-anchor="middle">基礎較弱者</text><text x="268" y="560" font-size="14" fill="#506764" font-weight="600" text-anchor="middle">補救途徑</text><text x="8" y="610" font-size="18" fill="#163D40" font-weight="800" text-anchor="start">多層次評量</text><rect x="8" y="622" width="344" height="40" rx="18" fill="#D5E5DF"/><g transform="translate(20 629) scale(0.3)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3 h48 l16 16 v60 H29 Z M77 3 v17 h16 M40 36 h7 M54 36 h26 M40 52 h7 M54 52 h26 M40 68 h7 M54 68 h26"/></g><text x="64" y="649" font-size="17" fill="#163D40" font-weight="700" text-anchor="start">形成性選擇題</text><rect x="8" y="672" width="344" height="40" rx="18" fill="#D5E5DF"/><g transform="translate(20 679) scale(0.3)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="64" y="699" font-size="17" fill="#163D40" font-weight="700" text-anchor="start">自動批閱 Verilog</text><rect x="8" y="722" width="344" height="40" rx="18" fill="#D5E5DF"/><g transform="translate(20 729) scale(0.3)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 77 h27 V56 h26 V34 h26 V12 h24 M17 67 h9 M43 46 h9 M69 24 h9"/></g><text x="64" y="749" font-size="17" fill="#163D40" font-weight="700" text-anchor="start">專題鷹架檢核</text></g></svg>