<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">同一步，兩面都升高</title><desc id="desc">同一步，兩面都升高。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">同一步，兩面都升高</text><rect x="40" y="82" width="132" height="220" rx="10" fill="#D5E5DF"/><path d="M106 255 V133" fill="none" stroke="#167C80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="106" y="345" text-anchor="middle" font-size="25" font-weight="800" fill="#167C80">正向動機</text><rect x="228" y="82" width="132" height="220" rx="10" fill="#F1E2D3"/><path d="M294 255 V133" fill="none" stroke="#A85F29" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><text x="294" y="345" text-anchor="middle" font-size="25" font-weight="800" fill="#A85F29">動機缺乏</text><path d="M148 387 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="416" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">第 3 → 4 次；非因果證明</text></g></svg>