<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1020" viewBox="0 0 360 1020" role="img" aria-labelledby="title desc"><title id="title">小範圍試用要一起補上 113 的三個證據缺口</title><desc id="desc">教師負擔、落差與分化、判斷 AI 的能力三個缺口，分別配上要收集的資料與要回答的問題。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="6" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="32" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">113 留下的缺口</text><text x="24" y="62" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">教師負擔</text><text x="24" y="90" fill="#506764" font-size="17" font-weight="500" text-anchor="start">報告未列時數</text><rect x="8" y="112" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="138" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">試用時一起收</text><text x="24" y="168" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">記四類工時</text><text x="24" y="196" fill="#506764" font-size="17" font-weight="500" text-anchor="start">起草、查核、維護、支援</text><rect x="8" y="218" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="244" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">要回答的問題</text><text x="24" y="274" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">省下的時間去哪</text><text x="24" y="302" fill="#506764" font-size="17" font-weight="500" text-anchor="start">用前後對照才能說</text><rect x="8" y="344" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="370" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">113 留下的缺口</text><text x="24" y="400" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">落差與分化</text><text x="24" y="428" fill="#506764" font-size="17" font-weight="500" text-anchor="start">只有平均、標準差</text><rect x="8" y="450" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="476" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">試用時一起收</text><text x="24" y="506" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">看逐人變化</text><text x="24" y="534" fill="#506764" font-size="17" font-weight="500" text-anchor="start">中段標記、後續追蹤</text><rect x="8" y="556" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="582" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">要回答的問題</text><text x="24" y="612" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">有沒有接住學生</text><text x="24" y="640" fill="#506764" font-size="17" font-weight="500" text-anchor="start">不靠一個總分</text><rect x="8" y="682" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="708" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">113 留下的缺口</text><text x="24" y="738" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">判斷 AI 的能力</text><text x="24" y="766" fill="#506764" font-size="17" font-weight="500" text-anchor="start">沒有直接測量</text><rect x="8" y="788" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="814" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">試用時一起收</text><text x="24" y="844" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">錯誤案例任務</text><text x="24" y="872" fill="#506764" font-size="17" font-weight="500" text-anchor="start">找錯、驗證、修正的表現</text><rect x="8" y="894" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="920" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">要回答的問題</text><text x="24" y="950" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">誰還在思考</text><text x="24" y="978" fill="#506764" font-size="17" font-weight="500" text-anchor="start">自評不能代替表現</text></g></svg>