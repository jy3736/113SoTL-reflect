<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 03 頁主題導讀</title><desc id="desc">本頁三個主題使用相同版型；概念示意，不表示數量或成效。反思頁箭頭表示閱讀順序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="384" height="108" rx="18" fill="#D5E5DF"/><g transform="translate(24 29) scale(0.76)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="92" height="29" rx="4"/><path d="M27 13 h66 M27 23 h45"/><circle cx="26" cy="47" r="8"/><circle cx="60" cy="47" r="8"/><circle cx="94" cy="47" r="8"/><path d="M11 79 V66 q15-15 30 0 v13 M45 79 V66 q15-15 30 0 v13 M79 79 V66 q15-15 30 0 v13"/></g><text x="134" y="50" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">課堂實踐</text><text x="134" y="88" font-size="18" fill="#506764" font-weight="500" text-anchor="start">一門課，分階段加入 AI</text><rect x="8" y="134" width="384" height="108" rx="18" fill="#D5E5DF"/><g transform="translate(24 155) scale(0.76)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="8" width="68" height="72" rx="5"/><rect x="42" y="2" width="36" height="13" rx="3" fill="#F7F4EC"/><path d="M38 32 l5 5 10-13 M63 32 h19 M38 55 l5 5 10-13 M63 55 h19 M38 71 h44"/></g><text x="134" y="176" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">追蹤同一批學生</text><text x="134" y="214" font-size="18" fill="#506764" font-weight="500" text-anchor="start">分清楚做過與看到</text><rect x="8" y="260" width="384" height="108" rx="18" fill="#F1E2D3"/><g transform="translate(24 281) scale(0.76)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 5 v67 M36 78 h48 M20 20 h80 M28 20 L9 54 h38 Z M92 20 L73 54 h38 Z"/></g><text x="134" y="302" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">同時看兩面</text><text x="134" y="340" font-size="18" fill="#506764" font-weight="500" text-anchor="start">動機變化與個別差異</text><text x="200" y="417" font-size="21" fill="#167C80" font-weight="700" text-anchor="middle">一個學期，從實踐走向反思</text></g></svg>