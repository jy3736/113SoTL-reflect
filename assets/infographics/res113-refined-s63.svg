<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">下一輪的調整，每一項都接回這一輪的結果</title><desc id="desc">下一輪的調整，每一項都接回這一輪的結果。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><circle cx="44" cy="60.0" r="28" fill="#D5E5DF"/><g transform="translate(24.799999999999997 40.8) scale(0.8)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="68.0" text-anchor="start" font-size="25" font-weight="800" fill="#163D40">動機缺乏升高</text><path d="M304 60.0 H370" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="395" y="68.0" text-anchor="start" font-size="27" font-weight="800" fill="#167C80">中段辨識風險</text><text x="1105" y="68.0" text-anchor="end" font-size="22" font-weight="500" fill="#506764">動機診斷、歷程追蹤</text><path d="M88 120.0 H1105" fill="none" stroke="#B5CAC3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="180.0" r="28" fill="#D5E5DF"/><g transform="translate(24.799999999999997 160.8) scale(0.8)"><path d="M24 22 A7 7 0 1 0 24 8 A7 7 0 1 0 24 22 M12 43 V37 Q12 28 24 28 Q36 28 36 37 V43 M7 25 A5 5 0 1 0 7 15 M41 25 A5 5 0 1 1 41 15 M3 32 V42 M45 32 V42" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="188.0" text-anchor="start" font-size="25" font-weight="800" fill="#163D40">學生差距變大</text><path d="M304 180.0 H370" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="395" y="188.0" text-anchor="start" font-size="27" font-weight="800" fill="#167C80">任務設難度階梯</text><text x="1105" y="188.0" text-anchor="end" font-size="22" font-weight="500" fill="#506764">引導提示、模組化範例</text><path d="M88 240.0 H1105" fill="none" stroke="#B5CAC3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="300.0" r="28" fill="#D5E5DF"/><g transform="translate(24.799999999999997 280.8) scale(0.8)"><path d="M24 43 A19 19 0 1 0 24 5 A19 19 0 1 0 24 43 M24 13 V25 L33 30" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="308.0" text-anchor="start" font-size="25" font-weight="800" fill="#163D40">每週壓力過大</text><path d="M304 300.0 H370" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="395" y="308.0" text-anchor="start" font-size="27" font-weight="800" fill="#167C80">專題拆成小關卡</text><text x="1105" y="308.0" text-anchor="end" font-size="22" font-weight="500" fill="#506764">精簡前段練習，時數移到後段</text></g></svg>