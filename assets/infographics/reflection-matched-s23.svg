<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 23 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="30" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">從結果走回教學決策</text><rect x="12" y="55" width="376" height="108" rx="18" fill="#D5E5DF"/><g transform="translate(26 74) scale(0.75)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 v72 h102 M22 58 l18-16 22 9 25-31 18 9"/><circle cx="40" cy="42" r="4"/><circle cx="62" cy="51" r="4"/><circle cx="87" cy="20" r="4"/></g><text x="132" y="98" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">看結果</text><text x="132" y="135" font-size="17" fill="#506764" font-weight="500" text-anchor="start">好消息與警訊</text><path d="M200 165 V179 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="182" width="376" height="108" rx="18" fill="#D5E5DF"/><g transform="translate(26 201) scale(0.75)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="132" y="225" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">查證據</text><text x="132" y="262" font-size="17" fill="#506764" font-weight="500" text-anchor="start">研究問題答到哪裡</text><path d="M200 292 V306 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="309" width="376" height="108" rx="18" fill="#F1E2D3"/><g tr