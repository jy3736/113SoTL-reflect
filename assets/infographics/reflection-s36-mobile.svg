<svg xmlns="http://www.w3.org/2000/svg" width="360" height="716" viewBox="0 0 360 716" role="img" aria-labelledby="title desc"><title id="title">下一輪怎麼改，要接回這一輪看到什麼</title><desc id="desc">右欄為報告建議與本次整理，尚未驗證調整成效。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="36" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">這一輪看見</text><text x="24" y="67" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">動機缺乏升高</text><text x="24" y="94" font-size="18" fill="#506764" font-weight="500" text-anchor="start">需要在期末之前看見卡關</text><path d="M24 109 L336 109" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="134" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">下一輪建議</text><text x="24" y="165" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">中段診斷</text><text x="24" y="193" font-size="18" fill="#506764" font-weight="500" text-anchor="start">動機與歷程紀錄一起看</text><rect x="8" y="232" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="260" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">這一輪看見</text><text x="24" y="291" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">學生回饋負荷過高</text><text x="24" y="318" font-size="18" fill="#506764" font-weight="500" text-anchor="start">希望有中間階段的任務</text><path d="M24 333 L336 333" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="358" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">下一輪建議</text><text x="24" y="389" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">任務設難度階梯</text><text x="24" y="417" font-size="18" fill="#506764" font-weight="500" text-anchor="start">提示、模組化範例、進階挑戰</text><rect x="8" y="456" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="484" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">這一輪看見</text><text x="24" y="515" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">後段整合時間吃緊</text><text x="24" y="542" font-size="18" fill="#506764" font-weight="500" text-anchor="start">第三階段僅少數完成上板</text><path d="M24 557 L336 557" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="582" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">下一輪建議</text><text x="24" y="613" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">重分配教學時數</text><text x="24" y="641" font-size="18" fill="#506764" font-weight="500" text-anchor="start">精簡前段練習，專題拆小關卡</text></g></svg>