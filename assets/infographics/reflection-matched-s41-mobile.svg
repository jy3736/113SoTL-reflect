<svg xmlns="http://www.w3.org/2000/svg" width="360" height="789" viewBox="0 0 360 789" role="img" aria-labelledby="title desc"><title id="title">第 41 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="233" rx="18" fill="#D5E5DF"/><g transform="translate(120.0 36) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="20" r="15"/><path d="M31 80 V58 q0-22 29-22 q29 0 29 22 v22 M42 57 v23 M78 57 v23"/></g><text x="28" y="149" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">學生仍要做決定</text><text x="28" y="187" font-size="18" fill="#506764" font-weight="600" text-anchor="start">AI 支援，不代替學習</text><text x="28" y="219" font-size="16" fill="#506764" font-weight="500" text-anchor="start">保留選擇與解釋責任</text><rect x="8" y="271" width="344" height="233" rx="18" fill="#D5E5DF"/><g transform="translate(120.0 299) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="28" y="412" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">主動審視與檢驗</text><text x="28" y="450" font-size="18" fill="#506764" font-weight="600" text-anchor="start">說明為何接受或修正</text><text x="28" y="482" font-size="16" fill="#506764" font-weight="500" text-anchor="start">以驗證支持自己的判斷</text><rect x="8" y="534" width="344" height="233" rx="18" fill="#F1E2D3"/><g transform="translate(120.0 562) scale(1)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="92" height="29" rx="4"/><path d="M27 13 h66 M27 23 h45"/><circle cx="26" cy="47" r="8"/><circle cx="60" cy="47" r="8"/><circle cx="94" cy="47" r="8"/><path d="M11 79 V66 q15-15 30 0 v13 M45 79 V66 q15-15 30 0 v13 M79 79 V66 q15-15 30 0 v13"/></g><text x="28" y="675" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">分享協作與解題歷程</text><text x="28" y="713" font-size="18" fill="#506764" font-weight="600" text-anchor="start">建立人機共學文化</text><text x="28" y="745" font-size="16" fill="#506764" font-weight="500" text-anchor="start">善用 AI，而非依賴解答</text></g></svg>