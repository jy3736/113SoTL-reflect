<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1066" viewBox="0 0 360 1066" role="img" aria-labelledby="title desc"><title id="title">同一班追蹤四次，能描述什麼？</title><desc id="desc">四輪主樣本 41 人；ANOVA 為 39 人；報告未說明兩者差異的完整原因。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="136" rx="18" fill="#D5E5DF"/><g transform="translate(22 34) scale(0.85)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="92" height="29" rx="4"/><path d="M27 13 h66 M27 23 h45"/><circle cx="26" cy="47" r="8"/><circle cx="60" cy="47" r="8"/><circle cx="94" cy="47" r="8"/><path d="M11 79 V66 q15-15 30 0 v13 M45 79 V66 q15-15 30 0 v13 M79 79 V66 q15-15 30 0 v13"/></g><text x="152" y="56" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">同一個自然班級</text><text x="152" y="98" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">重複量測四次</text><path d="M180 150 L180 520" fill="none" stroke="#B5CAC3" stroke-width="3"/><rect x="70" y="166" width="220" height="72" rx="18" fill="#D5E5DF"/><g transform="translate(83 172) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3 h48 l16 16 v60 H29 Z M77 3 v17 h16 M40 36 h7 M54 36 h26 M40 52 h7 M54 52 h26 M40 68 h7 M54 68 h26"/></g><text x="202" y="210" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">SIMS 1</text><rect x="70" y="258" width="220" height="72" rx="18" fill="#D5E5DF"/><g transform="translate(83 264) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3 h48 l16 16 v60 H29 Z M77 3 v17 h16 M40 36 h7 M54 36 h26 M40 52 h7 M54 52 h26 M40 68 h7 M54 68 h26"/></g><text x="202" y="302" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">SIMS 2</text><rect x="70" y="350" width="220" height="72" rx="18" fill="#D5E5DF"/><g transform="translate(83 356) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3 h48 l16 16 v60 H29 Z M77 3 v17 h16 M40 36 h7 M54 36 h26 M40 52 h7 M54 52 h26 M40 68 h7 M54 68 h26"/></g><text x="202" y="394" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">SIMS 3</text><rect x="70" y="442" width="220" height="72" rx="18" fill="#D5E5DF"/><g transform="translate(83 448) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3 h48 l16 16 v60 H29 Z M77 3 v17 h16 M40 36 h7 M54 36 h26 M40 52 h7 M54 52 h26 M40 68 h7 M54 68 h26"/></g><text x="202" y="486" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">SIMS 4</text><text x="180" y="564" font-size="16" fill="#506764" font-weight="500" text-anchor="middle">量測次序示意，不代表等長時段</text><rect x="8" y="598" width="344" height="214" rx="18" fill="#D5E5DF"/><text x="28" y="631" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">能描述</text><g transform="translate(220 616) scale(0.8)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="28" y="726" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">動機如何改變</text><text x="28" y="772" font-size="17" fill="#506764" font-weight="500" text-anchor="start">四次 SIMS 與期末回饋</text><rect x="8" y="832" width="344" height="214" rx="18" fill="#F1E2D3"/><text x="28" y="865" font-size="20" fill="#A85F29" font-weight="800" text-anchor="start">推論界線</text><g transform="translate(220 850) scale(0.8)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42 h36 M38 35 l8 7-8 7 M77 42 h32 M101 35 l8 7-8 7 M62 7 v70" stroke-dasharray="5 5"/><path d="M55 28 l14 28 M69 28 L55 56"/></g><text x="28" y="960" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">不能直接歸因於 AI</text><text x="28" y="1006" font-size="17" fill="#506764" font-weight="500" text-anchor="start">沒有對照組；其他因素難排除</text></g></svg>