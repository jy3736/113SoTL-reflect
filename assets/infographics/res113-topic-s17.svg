<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">逐步加入 AI，再提供選擇</title><desc id="desc">逐步加入 AI，再提供選擇。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">逐步加入 AI，再提供選擇</text><rect x="32" y="286" width="84" height="62" rx="4" fill="#D5E5DF"/><text x="74" y="270" text-anchor="middle" font-size="25" font-weight="800" fill="#167C80">一</text><text x="74" y="376" text-anchor="middle" font-size="18" font-weight="600" fill="#163D40">不用 AI</text><rect x="123" y="240" width="84" height="108" rx="4" fill="#D5E5DF"/><text x="165" y="224" text-anchor="middle" font-size="25" font-weight="800" fill="#167C80">二</text><text x="165" y="376" text-anchor="middle" font-size="18" font-weight="600" fill="#163D40">自由選用</text><rect x="214" y="194" width="84" height="154" rx="4" fill="#D5E5DF"/><text x="256" y="178" text-anchor="middle" font-size="25" font-weight="800" fill="#167C80">三</text><text x="256" y="376" text-anchor="middle" font-size="18" font-weight="600" fill="#163D40">正式協作</text><rect x="305" y="148" width="84" height="200" rx="4" fill="#F1E2D3"/><text x="347" y="132" text-anchor="middle" font-size="25" font-weight="800" fill="#A85F29">四</text><text x="347" y="376" text-anchor="middle" font-size="18" font-weight="600" fill="#163D40">三種模式</text><path d="M148 403 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="432" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">支援與評量也一起調整</text></g></svg>