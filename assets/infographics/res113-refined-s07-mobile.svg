<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">109 → 111 學年：平均未顯著改變，標準差增加</title><desc id="desc">109 學年，10.95，標準差；111 學年，14.65，標準差。線長依標準差比例繪製；不是學生成績分布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#087f7d" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="180" y="43" fill="#087f7d" font-size="24" font-weight="800" text-anchor="middle">109 學年　10.95</text><path d="M70.5,75 L289.5,75" fill="none" stroke="#087f7d" stroke-width="3"/><path d="M70.5,63 L70.5,87" fill="none" stroke="#153f40" stroke-width="3"/><path d="M289.5,63 L289.5,87" fill="none" stroke="#153f40" stroke-width="3"/><circle cx="180" cy="75" r="6" fill="#153f40"/><text x="180" y="208" fill="#995722" font-size="24" font-weight="800" text-anchor="middle">111 學年　14.65</text><path d="M33.5,240 L326.5,240" fill="none" stroke="#995722" stroke-width="3"/><path d="M33.5,228 L33.5,252" fill="none" stroke="#153f40" stroke-width="3"/><path d="M326.5,228 L326.5,252" fill="none" stroke="#153f40" stroke-width="3"/><circle cx="180" cy="240" r="6" fill="#153f40"/><text x="180" y="326" fill="#995722" font-size="25" font-weight="800" text-anchor="middle">標準差增加近 34%</text></g></svg>