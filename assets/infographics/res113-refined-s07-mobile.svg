<svg xmlns="http://www.w3.org/2000/svg" width="360" height="674" viewBox="0 0 360 674" role="img" aria-labelledby="title desc"><title id="title">平均未顯著改變，標準差由 10.95 增至 14.65</title><desc id="desc">109 學年標準差 10.95 分，111 學年 14.65 分；共用從零起算的 0–15 分刻度。標準差增加 3.70 分，約 33.8%，表示分數更分散，不是平均成績上升 34%，也不是實際成績分布圖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="94" rx="18" fill="#D5E5DF"/><text x="28" y="40" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">前期資料：成績平均</text><text x="28" y="76" font-size="25" fill="#167C80" font-weight="800" text-anchor="start">未達顯著改變</text><text x="28" y="142" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">109 學年</text><text x="328" y="142" font-size="23" fill="#167C80" font-weight="800" text-anchor="end">10.95 分</text><path d="M28 162 L28 222" fill="none" stroke="#D5E5DF" stroke-width="3"/><path d="M128 162 L128 222" fill="none" stroke="#D5E5DF" stroke-width="3"/><path d="M228 162 L228 222" fill="none" stroke="#D5E5DF" stroke-width="3"/><path d="M328 162 L328 222" fill="none" stroke="#D5E5DF" stroke-width="3"/><rect x="28" y="172" width="219.00" height="34" rx="5" fill="#167C80"/><text x="28" y="244" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">0</text><text x="128" y="244" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">5</text><text x="228" y="244" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">10</text><text x="328" y="244" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">15</text><text x="28" y="296" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">111 學年</text><text x="328" y="296" font-size="23" fill="#A85F29" font-weight="800" text-anchor="end">14.65 分</text><path d="M28 316 L28 376" fill="none" stroke="#D5E5DF" stroke-width="3"/><path d="M128 316 L128 376" fill="none" stroke="#D5E5DF" stroke-width="3"/><path d="M228 316 L228 376" fill="none" stroke="#D5E5DF" stroke-width="3"/><path d="M328 316 L328 376" fill="none" stroke="#D5E5DF" stroke-width="3"/><rect x="28" y="326" width="293.00" height="34" rx="5" fill="#A85F29"/><text x="28" y="398" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">0</text><text x="128" y="398" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">5</text><text x="228" y="398" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">10</text><text x="328" y="398" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">15</text><text x="180" y="444" font-size="17" fill="#506764" font-weight="500" text-anchor="middle">標準差（分）・兩列共用相同刻度</text><rect x="8" y="474" width="344" height="186" rx="18" fill="#F1E2D3"/><text x="180" y="520" font-size="22" fill="#A85F29" font-weight="800" text-anchor="middle">標準差增加</text><text x="180" y="565" font-size="29" fill="#A85F29" font-weight="800" text-anchor="middle">+3.70 分｜近 +34%</text><text x="180" y="612" font-size="24" fill="#163D40" font-weight="800" text-anchor="middle">分數更分散</text><text x="180" y="642" font-size="18" fill="#506764" font-weight="500" text-anchor="middle">不是平均成績增加 34%</text></g></svg>