<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="386" viewBox="0 0 1120 386" role="img" aria-labelledby="title desc"><title id="title">第 33 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="125" y="26" font-size="21" fill="#167C80" font-weight="800" text-anchor="start">研究問題與現有資料</text><text x="684" y="26" font-size="21" fill="#A85F29" font-weight="800" text-anchor="start">結論的範圍</text><rect x="8" y="44" width="506" height="98" rx="18" fill="#D5E5DF"/><g transform="translate(27 60) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="125" y="99" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">教師負擔：有流程經驗</text><path d="M526 93 H591 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="604" y="44" width="508" height="98" rx="18" fill="#F1E2D3"/><text x="628" y="82" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">還缺教師工時比較</text><text x="628" y="119" font-size="19" fill="#506764" font-weight="500" text-anchor="start">不能量化節省多少時間</text><rect x="8" y="156" width="506" height="98" rx="18" fill="#D5E5DF"/><g transform="translate(27 172) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 v72 h102 M22 58 l18-16 22 9 25-31 18 9"/><circle cx="40" cy="42" r="4"/><circle cx="62" cy="51" r="4"/><circle cx="87" cy="20" r="4"/></g><text x="125" y="211" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">動機：正向與警訊並存</text><path d="M526 205 H591 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="604" y="156" width="508" height="98" rx="18" fill="#F1E2D3"/><text x="628" y="194" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">還缺對照與參與趨勢</text><text x="628" y="231" font-size="19" fill="#506764" font-weight="500" text-anchor="start">不能直接歸因於 AI</text><rect x="8" y="268" width="506" height="98" rx="18" fill="#D5E5DF"/><g transform="translate(27 284) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="125" y="323" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">分散：動機缺乏 SD 增加</text><path d="M526 317 H591 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="604" y="268" width="508" height="98" rx="18" fill="#F1E2D3"/><text x="628" y="306" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">還缺逐人變化分析</text><text x="628" y="343" font-size="19" fill="#506764" font-weight="500" text-anchor="start">不能證明兩群或成績落差擴大</text></g></svg>