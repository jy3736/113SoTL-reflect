<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 25 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="31" font-size="24" fill="#163D40" font-weight="800" text-anchor="middle">同一段變化，兩面都看</text><rect x="12" y="64" width="376" height="140" rx="18" fill="#D5E5DF"/><g transform="translate(26 89) scale(0.85)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 5 l15 24 29 5-21 22 4 27-27-13-27 13 4-27-21-22 29-5 Z"/></g><text x="148" y="119" font-size="25" fill="#167C80" font-weight="800" text-anchor="start">正向動機</text><text x="148" y="160" font-size="20" fill="#163D40" font-weight="600" text-anchor="start">第 3 → 4 次升高</text><rect x="12" y="219" width="376" height="140" rx="18" fill="#F1E2D3"/><g transform="translate(26 244) scale(0.85)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7 h100 v54 H65 L47 78 V61 H10 Z"/><path d="M49 24 q0-15 17-11 q16 6-1 17 l-5 6 M60 48 h0"/></g><text x="148" y="274" font-size="25" fill="#A85F29" font-weight="800" text-anchor="start">動機缺乏</text><text x="148" y="315" font-size="20" fill="#163D40" font-weight="600" text-anchor="start">第 3 → 4 次也升高</text><text x="200" y="414" font-size="22" fill="#163D40" font-weight="800" text-anchor="middle">不能只選有利的構面</text></g></svg>