<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">發現專題做不完，期末臨時加開一條路</title><desc id="desc">發現專題做不完，期末臨時加開一條路。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><path d="M241.66666666666666 95 H503.0" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M615.0 95 H876.3333333333333" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="186.66666666666666" cy="95" r="44" fill="#D5E5DF"/><g transform="translate(158.34666666666666 66.68) scale(1.18)"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="186.66666666666666" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">觀察</text><text x="186.66666666666666" y="225" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">專題卡關</text><text x="186.66666666666666" y="269" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">RTL 設計與驗證難完成</text><circle cx="560.0" cy="95" r="44" fill="#D5E5DF"/><g transform="translate(531.68 66.68) scale(1.18)"><path d="M24 11 Q13 3 3 9 V39 Q13 33 24 41 Q35 33 45 39 V9 Q35 3 24 11 V41 M9 16 L17 17 M31 17 L39 16 M9 23 L17 24 M31 24 L39 23" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="560.0" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">調整</text><text x="560.0" y="225" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">40 題觀念測驗</text><text x="560.0" y="269" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">讀規格書、影片，測理解</text><circle cx="933.3333333333333" cy="95" r="44" fill="#F1E2D3"/><g transform="translate(905.0133333333332 66.68) scale(1.18)"><path d="M9 4 H39 V44 H9 Z M15 16 L19 20 L26 12 M15 33 L19 37 L26 29 M30 17 H33 M30 34 H33" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="933.3333333333333" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#A85F29">計分</text><text x="933.3333333333333" y="225" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">與專題擇優</text><text x="933.3333333333333" y="269" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">避免在終點前放棄</text></g></svg>