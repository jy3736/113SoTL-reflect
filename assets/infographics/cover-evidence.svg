<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="title desc"><title id="title">興趣與警訊一起看</title><desc id="desc">113 成果報告表二：第 3 到第 4 次，內在動機、認同調節與動機缺乏都升高。箭頭只表示變化方向，不表示幅度或 AI 因果效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="24" y="32" font-size="20" fill="#163D40" font-weight="700" text-anchor="start">113 計畫｜同一份資料，兩種信號</text><rect x="8" y="60" width="464" height="108" rx="18" fill="#D5E5DF"/><text x="30" y="103" font-size="29" fill="#167C80" font-weight="800" text-anchor="start">興趣升高</text><text x="30" y="139" font-size="20" fill="#506764" font-weight="500" text-anchor="start">內在動機・認同調節</text><path d="M427 137 V91 m-12 12 12-12 12 12" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="186" width="464" height="108" rx="18" fill="#F1E2D3"/><text x="30" y="229" font-size="29" fill="#A85F29" font-weight="800" text-anchor="start">警訊也升高</text><text x="30" y="265" font-size="20" fill="#506764" font-weight="500" text-anchor="start">動機缺乏</text><path d="M427 263 V217 m-12 12 12-12 12 12" fill="none" stroke="#A85F29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="332" font-size="19" fill="#506764" font-weight="500" text-anchor="start">單組追蹤：描述變化，謹慎解讀</text></g></svg>