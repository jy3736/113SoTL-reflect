<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 27 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><g transform="translate(140 6) scale(1)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 v72 h102 M22 58 l18-16 22 9 25-31 18 9"/><circle cx="40" cy="42" r="4"/><circle cx="62" cy="51" r="4"/><circle cx="87" cy="20" r="4"/></g><text x="200" y="119" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">分散增加，要往下追</text><rect x="12" y="145" width="376" height="118" rx="18" fill="#F1E2D3"/><text x="200" y="184" font-size="23" fill="#A85F29" font-weight="800" text-anchor="middle">動機缺乏標準差</text><text x="200" y="233" font-size="23" fill="#163D40" font-weight="800" text-anchor="middle">1.08 → 1.43（約 +33%）</text><rect x="12" y="280" width="376" height="111" rx="18" fill="#D5E5DF"/><text x="200" y="321" font-size="24" fill="#167C80" font-weight="800" text-anchor="middle">還要看逐人變化</text><text x="200" y="361" font-size="21" fill="#163D40" font-weight="700" text-anchor="middle">不能推定已分成兩群</text><text x="200" y="427" font-size="17" fill="#506764" font-weight="500" text-anchor="middle">不以虛構點圖代替個別資料</text></g></svg>