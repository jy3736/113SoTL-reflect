<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">三種可以先試的做法，成熟度各不相同</title><desc id="desc">理解，先用 AI，再斷網，開放 AI 理解題目，斷網做變化題；判斷，拿 AI 的錯來練，找錯、驗證、修正，來自學生建議；歷程，看過程，不只看成品，思考歷程，AI 互動紀錄</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8.0" y="80" width="350.6666666666667" height="210" rx="14" fill="#D5E5DF"/><text x="30.0" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">理解</text><text x="30.0" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">先用 AI，再斷網</text><text x="30.0" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">開放 AI 理解題目</text><text x="30.0" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">斷網做變化題</text><rect x="384.6666666666667" y="80" width="350.6666666666667" height="210" rx="14" fill="#D5E5DF"/><text x="406.6666666666667" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">判斷</text><text x="406.6666666666667" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">拿 AI 的錯來練</text><text x="406.6666666666667" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">找錯、驗證、修正</text><text x="406.6666666666667" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">來自學生建議</text><rect x="761.3333333333334" y="80" width="350.6666666666667" height="210" rx="14" fill="#D5E5DF"/><text x="783.3333333333334" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">歷程</text><text x="783.3333333333334" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">看過程，不只看成品</text><text x="783.3333333333334" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">思考歷程</text><text x="783.3333333333334" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">AI 互動紀錄</text></g></svg>