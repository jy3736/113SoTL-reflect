<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">教師給目標，Agent 反覆執行，教師決定</title><desc id="desc">教師先給目標，Agent 反覆做、查、改，最後由教師決定是否採用。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="48" fill="#163D40" font-size="28" font-weight="800" text-anchor="middle">先定目標，最後驗收</text><rect x="90" y="72" width="220" height="60" rx="14" fill="#167C80"/><text x="200" y="111" fill="#fff" font-size="25" font-weight="800" text-anchor="middle">教師給目標</text><path d="M200 134 L200 166" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><circle cx="200" cy="255" r="84" fill="none" stroke="#167C80" stroke-width="5" stroke-dasharray="14 9"/><text x="200" y="245" fill="#167C80" font-size="30" font-weight="800" text-anchor="middle">Agent</text><text x="200" y="280" fill="#506764" font-size="22" font-weight="600" text-anchor="middle">做、查、再改</text><path d="M200 342 L200 370" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="90" y="372" width="220" height="60" rx="14" fill="#A85F29"/><text x="200" y="411" fill="#fff" font-size="25" font-weight="800" text-anchor="middle">教師決定</text></g></svg>