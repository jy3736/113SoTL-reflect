<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="366" viewBox="0 0 1120 366" role="img" aria-labelledby="title desc"><title id="title">第 42 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="544" height="165" rx="18" fill="#D5E5DF"/><g transform="translate(24 40) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 77 h27 V56 h26 V34 h26 V12 h24 M17 67 h9 M43 46 h9 M69 24 h9"/></g><text x="163" y="68" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">分階段</text><text x="163" y="120" font-size="22" fill="#506764" font-weight="500" text-anchor="start">先建立基礎，再逐步加入 AI</text><rect x="568" y="8" width="544" height="165" rx="18" fill="#D5E5DF"/><g transform="translate(584 40) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="18" width="42" height="44" rx="5"/><rect x="75" y="18" width="42" height="44" rx="5"/><path d="M45 40 h30 M22 8 v10 M22 62 v10 M96 8 v10 M96 62 v10 M14 31 h20 M86 31 h20 M14 47 h20 M86 47 h20"/></g><text x="723" y="68" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">給選擇</text><text x="723" y="120" font-size="22" fill="#506764" font-weight="500" text-anchor="start">同題多路徑，也備補救選項</text><rect x="8" y="189" width="544" height="165" rx="18" fill="#D5E5DF"/><g transform="translate(24 221) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 5 v67 M36 78 h48 M20 20 h80 M28 20 L9 54 h38 Z M92 20 L73 54 h38 Z"/></g><text x="163" y="249" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">看兩面</text><text x="163" y="301" font-size="22" fill="#506764" font-weight="500" text-anchor="start">同時看動機、分散與回饋</text><rect x="568" y="189" width="544" height="165" rx="18" fill="#F1E2D3"/><g transform="translate(584 221) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="723" y="249" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">對證據</text><text x="723" y="301" font-size="22" fill="#506764" font-weight="500" text-anchor="start">每個結論對回手上的資料</text></g></svg>