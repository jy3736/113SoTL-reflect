<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc"><title id="title">第 38 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="180" y="30" font-size="25" fill="#167C80" font-weight="800" text-anchor="middle">聊天式 AI</text><rect x="8" y="53" width="344" height="94" rx="18" fill="#D5E5DF"/><g transform="translate(25 69) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7 h96 v49 H56 L34 77 V56 H7 Z M23 23 h61 M23 38 h43"/></g><text x="133" y="108" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">老師提問</text><path d="M180 149 V166 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="168" width="344" height="94" rx="18" fill="#D5E5DF"/><g transform="translate(25 184) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 h68 v65 H10 Z M23 19 h42 M23 34 h31 M23 49 h39 M81 17 h22 v64 H36 v-9"/></g><text x="133" y="223" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">AI 回答文字</text><path d="M180 264 V281 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="283" width="344" height="94" rx="18" fill="#D5E5DF"/><g transform="translate(25 299) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="133" y="338" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">老師測試、修改</text><text x="180" y="448" font-size="23" fill="#A85F29" font-weight="800" text-anchor="middle">AI Agent（本場工作定義）</text><rect x="8" y="474" width="344" height="100" rx="18" fill="#F1E2D3"/><text x="180" y="511" font-size="22" fill="#163D40" font-weight="800" text-anchor="middle">教師先定目標與資料範圍</text><text x="180" y="549" font-size="20" fill="#163D40" font-weight="700" text-anchor="middle">說清楚驗收條件</text><rect x="37" y="602" width="315" height="94" rx="18" fill="#D5E5DF"/><g transform="translate(49 618) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="8" width="68" height="72" rx="5"/><rect x="42" y="2" width="36" height="13" rx="3" fill="#F7F4EC"/><path d="M38 32 l5 5 10-13 M63 32 h19 M38 55 l5 5 10-13 M63 55 h19 M38 71 h44"/></g><text x="157" y="656" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">規劃步驟</text><path d="M194 698 V715 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="37" y="717" width="315" height="94" rx="18" fill="#D5E5DF"/><g transform="translate(49 733) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 h54 v74 H12 Z M24 22 h29 M24 37 h24 M24 52 h17"/><path d="M76 80 l5-19 23-28 12 10-23 28 Z M81 61 l12 10 M99 39 l12 10"/></g><text x="157" y="771" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">動手執行</text><path d="M194 813 V830 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="37" y="832" width="315" height="94" rx="18" fill="#D5E5DF"/><g transform="translate(49 848) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="157" y="886" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">檢查結果</text><path d="M194 930 V952 H16 V647 H35" fill="none" stroke="#167C80" stroke-width="2.5" marker-end="url(#arrow)"/><text x="180" y="988" font-size="19" fill="#167C80" font-weight="700" text-anchor="middle">未符合條件，就回頭修正</text><rect x="8" y="1014" width="344" height="89" rx="18" fill="#F1E2D3"/><text x="180" y="1051" font-size="23" fill="#163D40" font-weight="800" text-anchor="middle">教師看成果與紀錄</text><text x="180" y="1087" font-size="20" fill="#163D40" font-weight="700" text-anchor="middle">最後決定是否採用</text></g></svg>