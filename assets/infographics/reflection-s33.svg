<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">回到研究問題：哪些答了，哪些還缺資料？</title><desc id="desc">證據缺口是本次分享對報告的檢視；未報告資料不等於工作未執行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="20" y="26" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">研究問題與現有資料</text><text x="644" y="26" font-size="22" fill="#A85F29" font-weight="800" text-anchor="start">結論的範圍</text><rect x="8" y="44" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">教師負擔</text><text x="32" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">有教材與批閱流程的經驗描述</text><rect x="632" y="44" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">缺工時比較</text><text x="656" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">不能量化說省下多少時間</text><path d="M504 90.0 L616 90.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="77.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">界線</text><rect x="8" y="148" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">動機與參與</text><text x="32" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">內在、認同上升；動機缺乏也上升</text><rect x="632" y="148" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">缺對照與參與趨勢</text><text x="656" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">不能直接歸因於 AI</text><path d="M504 194.0 L616 194.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="181.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">界線</text><rect x="8" y="252" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">落差與分化</text><text x="32" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">動機缺乏標準差增加 33.1%</text><rect x="632" y="252" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">缺逐人變化分析</text><text x="656" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">不能證明兩群或成績落差擴大</text><path d="M504 298.0 L616 298.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="285.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">界線</text></g></svg>