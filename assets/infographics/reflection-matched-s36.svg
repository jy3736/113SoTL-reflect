<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="386" viewBox="0 0 1120 386" role="img" aria-labelledby="title desc"><title id="title">第 36 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="125" y="26" font-size="21" fill="#167C80" font-weight="800" text-anchor="start">這一輪看見</text><text x="684" y="26" font-size="21" fill="#A85F29" font-weight="800" text-anchor="start">下一輪建議</text><rect x="8" y="44" width="506" height="98" rx="18" fill="#D5E5DF"/><g transform="translate(27 60) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="125" y="99" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">動機缺乏升高</text><path d="M526 93 H591 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="604" y="44" width="508" height="98" rx="18" fill="#F1E2D3"/><text x="628" y="82" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">中段診斷與歷程追蹤</text><text x="628" y="119" font-size="19" fill="#506764" font-weight="500" text-anchor="start">在期末前看見卡關訊號</text><rect x="8" y="156" width="506" height="98" rx="18" fill="#D5E5DF"/><g transform="translate(27 172) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 77 h27 V56 h26 V34 h26 V12 h24 M17 67 h9 M43 46 h9 M69 24 h9"/></g><text x="125" y="211" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">學生回饋負荷過高</text><path d="M526 205 H591 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="604" y="156" width="508" height="98" rx="18" fill="#F1E2D3"/><text x="628" y="194" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">任務設明確難度階梯</text><text x="628" y="231" font-size="19" fill="#506764" font-weight="500" text-anchor="start">引導提示、模組範例、進階挑戰</text><rect x="8" y="268" width="506" height="98" rx="18" fill="#D5E5DF"/><g transform="translate(27 284) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="125" y="323" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">後段整合時間吃緊</text><path d="M526 317 H591 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="604" y="268" width="508" height="98" rx="18" fill="#F1E2D3"/><text x="628" y="306" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">重分配時數，專題拆關卡</text><text x="628" y="343" font-size="19" fill="#506764" font-weight="500" text-anchor="start">精簡前段練習，留後段整合時間</text></g></svg>