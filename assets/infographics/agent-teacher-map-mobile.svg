<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1020" viewBox="0 0 360 1020" role="img" aria-labelledby="title desc"><title id="title">老師的三種負荷，Agent 可以接手與老師不能放手的部分</title><desc id="desc">教材、評量、追蹤三種負荷，分別對應 Agent 可接手的工作與老師必須把關的事。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="6" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="32" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">113 的負荷</text><text x="24" y="62" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">教材：編寫負荷</text><text x="24" y="90" fill="#506764" font-size="17" font-weight="500" text-anchor="start">補說明、補範例</text><rect x="8" y="112" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="138" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">Agent 可以接手</text><text x="24" y="168" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">教材生成計畫</text><text x="24" y="196" fill="#506764" font-size="17" font-weight="500" text-anchor="start">依大綱分批起草、留紀錄</text><rect x="8" y="218" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="244" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">老師不能放手</text><text x="24" y="274" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">查概念與範例</text><text x="24" y="302" fill="#506764" font-size="17" font-weight="500" text-anchor="start">錯的不能上線</text><rect x="8" y="344" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="370" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">113 的負荷</text><text x="24" y="400" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">評量：出題與批閱</text><text x="24" y="428" fill="#506764" font-size="17" font-weight="500" text-anchor="start">題目多、回饋慢</text><rect x="8" y="450" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="476" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">Agent 可以接手</text><text x="24" y="506" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">出題與批閱程式</text><text x="24" y="534" fill="#506764" font-size="17" font-weight="500" text-anchor="start">題目、測資、測試程式</text><rect x="8" y="556" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="582" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">老師不能放手</text><text x="24" y="612" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">驗答案與測資</text><text x="24" y="640" fill="#506764" font-size="17" font-weight="500" text-anchor="start">抽查再開放</text><rect x="8" y="682" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="708" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">113 的負荷</text><text x="24" y="738" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">追蹤：資料看不完</text><text x="24" y="766" fill="#506764" font-size="17" font-weight="500" text-anchor="start">問卷、進度分散</text><rect x="8" y="788" width="344" height="100" rx="14" fill="#D5E5DF"/><text x="24" y="814" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">Agent 可以接手</text><text x="24" y="844" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">問卷與進度摘要</text><text x="24" y="872" fill="#506764" font-size="17" font-weight="500" text-anchor="start">整理成可讀的摘要</text><rect x="8" y="894" width="344" height="100" rx="14" fill="#F1E2D3"/><text x="24" y="920" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">老師不能放手</text><text x="24" y="950" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">決定怎麼介入</text><text x="24" y="978" fill="#506764" font-size="17" font-weight="500" text-anchor="start">不交給 AI 判斷學生</text></g></svg>