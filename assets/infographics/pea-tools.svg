<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">六套自建教學工具對應 PEA</title><desc id="desc">P 預習，Live 教材／學習單，23 份；課前讀、課後看；E 參與，IRS 即時互動，15 堂；平均 86 次／人；E 參與，實作自動批閱，27 題；平均提交 10.4 次／人；A 評估，Formative 形成性評量，平均作答 1,118 題／人；A 評估，Summative 總結評量，46 人；學期成績分布；省思，SIMS 動機分析，前後測，供老師調整</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="6" width="352" height="168" rx="14" fill="#D5E5DF"/><text x="30" y="46" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">P 預習</text><text x="30" y="96" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">Live 教材／學習單</text><text x="30" y="138" fill="#506764" font-size="22" font-weight="500" text-anchor="start">23 份；課前讀、課後看</text><rect x="384" y="6" width="352" height="168" rx="14" fill="#D5E5DF"/><text x="406" y="46" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">E 參與</text><text x="406" y="96" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">IRS 即時互動</text><text x="406" y="138" fill="#506764" font-size="22" font-weight="500" text-anchor="start">15 堂；平均 86 次／人</text><rect x="760" y="6" width="352" height="168" rx="14" fill="#D5E5DF"/><text x="782" y="46" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">E 參與</text><text x="782" y="96" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">實作自動批閱</text><text x="782" y="138" fill="#506764" font-size="22" font-weight="500" text-anchor="start">27 題；平均提交 10.4 次／人</t