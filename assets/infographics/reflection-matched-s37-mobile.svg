<svg xmlns="http://www.w3.org/2000/svg" width="360" height="852" viewBox="0 0 360 852" role="img" aria-labelledby="title desc"><title id="title">第 37 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 30) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 7 h100 v54 H65 L47 78 V61 H10 Z"/><path d="M49 24 q0-15 17-11 q16 6-1 17 l-5 6 M60 48 h0"/></g><text x="118" y="45" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告提醒的風險</text><text x="118" y="82" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">動機退縮的風險</text><path d="M26 118 L334 118" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="152" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">尚待驗證的防線</text><text x="28" y="191" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">及早辨識、分層支援</text><text x="28" y="233" font-size="17" fill="#506764" font-weight="500" text-anchor="start">調整任務並給個別引導</text><rect x="8" y="292" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 314) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="118" y="329" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告提醒的風險</text><text x="118" y="366" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">過度依賴 AI</text><path d="M26 402 L334 402" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="436" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">尚待驗證的防線</text><text x="28" y="475" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">分析與驗證 AI 產出</text><text x="28" y="517" font-size="17" fill="#506764" font-weight="500" text-anchor="start">用錯誤案例練習判斷</text><rect x="8" y="576" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 598) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 2 L99 17 v26 q-6 29-39 39 Q27 72 21 43 V17 Z M41 41 l13 14 27-30"/></g><text x="118" y="613" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告提醒的風險</text><text x="118" y="650" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">工具誤用</text><path d="M26 686 L334 686" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="720" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">尚待驗證的防線</text><text x="28" y="759" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">訂規範，也檢視過程</text><text x="28" y="801" font-size="17" fill="#506764" font-weight="500" text-anchor="start">看思考歷程與 AI 互動紀錄</text></g></svg>