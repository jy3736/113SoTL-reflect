<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">平均未顯著改變，標準差由 10.95 增至 14.65</title><desc id="desc">109 學年標準差 10.95 分，111 學年 14.65 分；共用從零起算的 0–15 分刻度。標準差增加 3.70 分，約 33.8%，表示分數更分散，不是平均成績上升 34%，也不是實際成績分布圖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="4" width="784" height="52" rx="18" fill="#D5E5DF"/><text x="32" y="38" font-size="25" fill="#167C80" font-weight="800" text-anchor="start">前期資料：成績平均未達顯著改變</text><path d="M250 80 L250 274" fill="none" stroke="#D5E5DF" stroke-width="3"/><text x="250" y="310" font-size="20" fill="#506764" font-weight="600" text-anchor="middle">0</text><path d="M420 80 L420 274" fill="none" stroke="#D5E5DF" stroke-width="3"/><text x="420" y="310" font-size="20" fill="#506764" font-weight="600" text-anchor="middle">5</text><path d="M590 80 L590 274" fill="none" stroke="#D5E5DF" stroke-width="3"/><text x="590" y="310" font-size="20" fill="#506764" font-weight="600" text-anchor="middle">10</text><path d="M760 80 L760 274" fill="none" stroke="#D5E5DF" stroke-width="3"/><text x="760" y="310" font-size="20" fill="#506764" font-weight="600" text-anchor="middle">15</text><text x="26" y="138" font-size="27" fill="#163D40" font-weight="800" text-anchor="start">109 學年</text><rect x="250" y="104" width="372.30" height="50" rx="6" fill="#167C80"/><text x="607.3" y="139" font-size="27" fill="#FFFFFF" font-weight="800" text-anchor="end">10.95</text><text x="26" y="238" font-size="27" fill="#163D40" font-weight="800" text-anchor="start">111 學年</text><rect x="250" y="204" width="498.10" height="50" rx="6" fill="#A85F29"/><text x="733.1" y="239" font-size="27" fill="#FFFFFF" font-weight="800" text-anchor="end">14.65</text><path d="M250 276 L760 276" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="505" y="350" font-size="21" fill="#506764" font-weight="500" text-anchor="middle">標準差（分）｜長條從 0 起算</text><rect x="824" y="4" width="288" height="344" rx="18" fill="#F1E2D3"/><g fill="none" stroke="#A85F29" stroke-width="3" stroke-linecap="round"><circle cx="955" cy="60" r="24"/><path d="M973 78 l22 22 M940 60 h30 M940 54 v12 M970 54 v12"/></g><text x="968" y="145" font-size="36" fill="#A85F29" font-weight="800" text-anchor="middle">+3.70 分</text><text x="968" y="207" font-size="38" fill="#A85F29" font-weight="800" text-anchor="middle">近 +34%</text><text x="968" y="249" font-size="24" fill="#A85F29" font-weight="800" text-anchor="middle">標準差增加</text><text x="968" y="292" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">分數更分散</text><text x="968" y="326" font-size="19" fill="#506764" font-weight="500" text-anchor="middle">不是平均成績增加 34%</text></g></svg>