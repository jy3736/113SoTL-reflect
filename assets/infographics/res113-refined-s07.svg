<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">109 → 111 學年：平均未顯著改變，標準差增加</title><desc id="desc">109 學年，10.95，標準差；111 學年，14.65，標準差。線長依標準差比例繪製；不是學生成績分布。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#087f7d" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="140" y="95" fill="#153f40" font-size="28" font-weight="800" text-anchor="middle">109 學年</text><text x="140" y="133" fill="#526a68" font-size="24" font-weight="600" text-anchor="middle">標準差 10.95</text><path d="M404.8,105 L755.2,105" fill="none" stroke="#087f7d" stroke-width="3"/><path d="M404.8,90 L404.8,120" fill="none" stroke="#153f40" stroke-width="3"/><path d="M755.2,90 L755.2,120" fill="none" stroke="#153f40" stroke-width="3"/><circle cx="580" cy="105" r="8" fill="#153f40"/><text x="140" y="240" fill="#153f40" font-size="28" font-weight="800" text-anchor="middle">111 學年</text><text x="140" y="278" fill="#526a68" font-size="24" font-weight="600" text-anchor="middle">標準差 14.65</text><path d="M345.6,250 L814.4,250" fill="none" stroke="#995722" stroke-width="3"/><path d="M345.6,235 L345.6,265" fill="none" stroke="#153f40" stroke-width="3"/><path d="M814.4,235 L814.4,265" fill="none" stroke="#153f40" stroke-width="3"/><circle cx="580" cy="250" r="8" fill="#153f40"/><text x="993" y="150" fill="#995722" font-size="43" font-weight="800" text-anchor="middle">近 +34%</text><text x="993" y="194" fill="#526a68" font-size="26" font-weight="600" text-anchor="middle">標準差增加</text></g></svg>