<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 26 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><g transform="translate(140 8) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 5 v67 M36 78 h48 M20 20 h80 M28 20 L9 54 h38 Z M92 20 L73 54 h38 Z"/></g><text x="200" y="119" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">變化要並列呈現</text><rect x="12" y="145" width="376" height="69" rx="18" fill="#D5E5DF"/><text x="30" y="173" font-size="19" fill="#167C80" font-weight="800" text-anchor="start">好消息</text><text x="30" y="200" font-size="21" fill="#163D40" font-weight="700" text-anchor="start">內在動機、認同升高</text><rect x="12" y="228" width="376" height="69" rx="18" fill="#F1E2D3"/><text x="30" y="256" font-size="19" fill="#A85F29" font-weight="800" text-anchor="start">警訊</text><text x="30" y="283" font-size="21" fill="#163D40" font-weight="700" text-anchor="start">動機缺乏也升高</text><rect x="12" y="311" width="376" height="69" rx="18" fill="#D5E5DF"/><text x="30" y="339" font-size="19" fill="#167C80" font-weight="800" text-anchor="start">總指數</text><text x="30" y="366" font-size="21" fill="#163D40" font-weight="700" text-anchor="start">RAI 未達顯著</text><text x="200" y="428" font-size="19" fill="#506764" font-weight="500" text-anchor="middle">構面抵銷：仍是可能解釋</text></g></svg>