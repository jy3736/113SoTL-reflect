<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">總指數未達顯著，不代表四種動機沒變</title><desc id="desc">表二 n = 41；這是報告值。RAI 含外在調節，題項版本與重算一致性仍待核對。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="560" y="25" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">把不同動機加權，得到 RAI</text><rect x="8" y="50" width="260" height="105" rx="18" fill="#D5E5DF"/><text x="138" y="87" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">內在動機</text><text x="138" y="132" font-size="29" fill="#167C80" font-weight="800" text-anchor="middle">× 2</text><path d="M138 160 L138 188" fill="none" stroke="#167C80" stroke-width="3"/><rect x="288" y="50" width="260" height="105" rx="18" fill="#D5E5DF"/><text x="418" y="87" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">認同調節</text><text x="418" y="132" font-size="29" fill="#167C80" font-weight="800" text-anchor="middle">× 1</text><path d="M418 160 L418 188" fill="none" stroke="#167C80" stroke-width="3"/><rect x="568" y="50" width="260" height="105" rx="18" fill="#F1E2D3"/><text x="698" y="87" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">外在調節</text><text x="698" y="132" font-size="29" fill="#A85F29" font-weight="800" text-anchor="middle">× −1</text><path d="M698 160 L698 188" fill="none" stroke="#167C80" stroke-width="3"/><rect x="848" y="50" width="260" height="105" rx="18" fill="#F1E2D3"/><text x="978" y="87" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">動機缺乏</text><text x="978" y="132" font-size="29" fill="#A85F29" font-weight="800" text-anchor="middle">× −2</text><path d="M978 160 L978 188" fill="none" stroke="#167C80" stroke-width="3"/><path d="M138 188 L978 188" fill="none" stroke="#167C80" stroke-width="3"/><path d="M560 188 L560 220" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="225" width="540" height="102" rx="18" fill="#D5E5DF"/><text x="560" y="264" font-size="34" fill="#167C80" font-weight="800" text-anchor="middle">3.431 → 3.553</text><text x="560" y="303" font-size="22" fill="#506764" font-weight="600" text-anchor="middle">p = .677；未顯著不代表「證明不變」</text></g></svg>