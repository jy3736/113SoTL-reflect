<svg xmlns="http://www.w3.org/2000/svg" width="360" height="644" viewBox="0 0 360 644" role="img" aria-labelledby="title desc"><title id="title">114-2 兩班前後測：第一週 vs 期末（n = 35）</title><desc id="desc">內在動機，5.14 → 5.57，p = .004，d = 0.52，達顯著；相對自主指數，4.22 → 5.69，p = .005，d = 0.51，達顯著；動機缺乏，3.41 → 3.12，p = .057，向下趨勢，未達顯著</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="6" width="344" height="190" rx="14" fill="#D5E5DF"/><text x="30" y="46" fill="#167C80" font-size="20" font-weight="800" text-anchor="start">內在動機</text><text x="30" y="91" fill="#163D40" font-size="23" font-weight="800" text-anchor="start">5.14 → 5.57</text><text x="30" y="133" fill="#506764" font-size="18" font-weight="500" text-anchor="start">p = .004，d = 0.52</text><text x="30" y="164" fill="#506764" font-size="18" font-weight="500" text-anchor="start">達顯著</text><rect x="8" y="220" width="344" height="190" rx="14" fill="#D5E5DF"/><text x="30" y="260" fill="#167C80" font-size="20" font-weight="800" text-anchor="start">相對自主指數</text><text x="30" y="305" fill="#163D40" font-size="23" font-weight="800" text-anchor="start">4.22 → 5.69</text><text x="30" y="347" fill="#506764" font-size="18" font-weight="500" text-anchor="start">p = .005，d = 0.51</text><text x="30" y="378" fill="#506764" font-size="18" font-weight="500" text-anchor="start">達顯著</text><rect x="8" y="434" width="344" height="190" rx="14" fill="#F1E2D3"/><text x="30" y="474" fill="#A85F29" font-size="20" font-weight="800" text-anchor="start">動機缺乏</text><text x="30" y="519" fill="#163D40" font-size="23" font