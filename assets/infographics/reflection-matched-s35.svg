<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 35 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><g transform="translate(130 12) scale(1.2)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6 h65 v74 H16 Z M29 21 h36 M29 36 h29 M29 51 h18 M65 70 l33-37 12 11-33 37-17 4 Z M93 39 l12 11"/></g><text x="200" y="147" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">每個動詞，都要查證</text><rect x="12" y="173" width="376" height="68" rx="18" fill="#D5E5DF"/><text x="30" y="201" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">描述變化</text><text x="30" y="229" font-size="21" fill="#163D40" font-weight="700" text-anchor="start">對回完整曲線</text><rect x="12" y="255" width="376" height="68" rx="18" fill="#D5E5DF"/><text x="30" y="283" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">推論分群</text><text x="30" y="311" font-size="21" fill="#163D40" font-weight="700" text-anchor="start">先查個別資料</text><rect x="12" y="337" width="376" height="68" rx="18" fill="#F1E2D3"/><text x="30" y="365" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">主張效果</text><text x="30" y="393" font-size="21" fill="#163D40" font-weight="700" text-anchor="start">需要比較設計</text></g></svg>