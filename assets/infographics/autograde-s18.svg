<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">兩種自動批閱：HDLBits 課後自主練習，自建 Docker 系統課堂受控測驗</title><desc id="desc">左為 HDLBits 線上平台：課後自主練習，指定 71 題，交答案即自動合成、模擬、判對錯；網路上找得到答案，所以只記錄練了幾題。右為 Verilog 自動批閱（合成/模擬/驗證）：平時 25 題、期中 4 題、期末 12 組功能測試，在課堂現場受控完成，用來確認是不是真的學會。共同點是交了馬上知道對不對，可以修正再試。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="4" width="540" height="250" rx="16" fill="#D5E5DF"/><text x="34" y="44" font-size="19" fill="#167C80" font-weight="800" text-anchor="start">課後｜自主練習</text><text x="34" y="88" font-size="28" fill="#163D40" font-weight="800" text-anchor="start">HDLBits 線上平台</text><circle cx="40" cy="131" r="4.5" fill="#167C80"/><text x="56" y="138" font-size="20" fill="#163D40" font-weight="600" text-anchor="start">指定 71 題（平台超過百題）</text><circle cx="40" cy="169" r="4.5" fill="#167C80"/><text x="56" y="176" font-size="20" fill="#163D40" font-weight="600" text-anchor="start">交答案，自動合成、模擬、判對錯</text><circle cx="40" cy="207" r="4.5" fill="#167C80"/><text x="56" y="214" font-size="20" fill="#163D40" font-weight="600" text-anchor="start">網路找得到答案 → 只記錄練了幾題</text><rect x="572" y="4" width="540" height="250" rx="16" fill="#FFFFFF" stroke="#A85F29" stroke-width="2.4"/><text x="598" y="44" font-size="19" fill="#A85F29" font-weight="800" text-anchor="start">課堂｜受控測驗</text><text x="598" y="88" font-size="28" fill="#163D40" font-weight="800" text-anchor="start">Verilog 自動批閱 (合成/模擬/驗證)</text><circle cx="604" cy="131" r="4.5" fill="#A85F29"/><text x="620" y="138" font-size="20" fill="#163D40" font-weight="600" text-anchor="start">平時 25 題・期中 4 題・期末 12 組</text><circle cx="604" cy="169" r="4.5" fill="#A85F29"/><text x="620" y="176" font-size="20" fill="#163D40" font-weight="600" text-anchor="start">課堂現場完成，不帶回家做</text><circle cx="604" cy="207" r="4.5" fill="#A85F29"/><text x="620" y="214" font-size="20" fill="#163D40" font-weight="600" text-anchor="start">確認是不是真的學會</text><rect x="8" y="274" width="1104" height="76" rx="16" fill="#D5E5DF"/><text x="560" y="321" font-size="23" fill="#167C80" font-weight="800" text-anchor="middle">共同點：交了馬上知道對不對，修正再試，不必等老師或助教改</text></g></svg>