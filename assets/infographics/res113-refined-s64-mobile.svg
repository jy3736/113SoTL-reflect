<svg xmlns="http://www.w3.org/2000/svg" width="360" height="666" viewBox="0 0 360 666" role="img" aria-labelledby="title desc"><title id="title">三種風險，配上三種待驗證的防線</title><desc id="desc">三種風險，配上三種待驗證的防線。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><circle cx="58" cy="50" r="29" fill="#D5E5DF"/><g transform="translate(38.8 30.799999999999997) scale(0.8)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="57" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">動機兩極化風險</text><text x="23" y="130" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">及早辨識、差異化任務</text><text x="23" y="168" text-anchor="start" font-size="19" font-weight="500" fill="#506764">增加個別化引導</text><path d="M59 85 V96" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="58" cy="262" r="29" fill="#D5E5DF"/><g transform="translate(38.8 242.8) scale(0.8)"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="269" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">過度依賴 AI</text><text x="23" y="342" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">分析與驗證產出</text><text x="23" y="380" text-anchor="start" font-size="19" font-weight="500" fill="#506764">避免被動接受答案</text><path d="M59 297 V308" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="58" cy="474" r="29" fill="#F1E2D3"/><g transform="translate(38.8 454.8) scale(0.8)"><path d="M24 3 L42 10 V24 Q42 37 24 46 Q6 37 6 24 V10 Z M15 24 L21 30 L33 17" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="481" text-anchor="start" font-size="22" font-weight="800" fill="#A85F29">工具誤用</text><text x="23" y="554" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">訂規範、看過程</text><text x="23" y="592" text-anchor="start" font-size="19" font-weight="500" fill="#506764">檢視思考與 AI 互動紀錄</text><path d="M59 509 V520" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/></g></svg>