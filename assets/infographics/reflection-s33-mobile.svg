<svg xmlns="http://www.w3.org/2000/svg" width="360" height="716" viewBox="0 0 360 716" role="img" aria-labelledby="title desc"><title id="title">回到研究問題：哪些答了，哪些還缺資料？</title><desc id="desc">證據缺口是本次分享對報告的檢視；未報告資料不等於工作未執行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="36" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">研究問題與現有資料</text><text x="24" y="67" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">教師負擔</text><text x="24" y="94" font-size="18" fill="#506764" font-weight="500" text-anchor="start">有教材與批閱流程的經驗描述</text><path d="M24 109 L336 109" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="134" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">結論的範圍</text><text x="24" y="165" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">缺工時比較</text><text x="24" y="193" font-size="18" fill="#506764" font-weight="500" text-anchor="start">不能量化說省下多少時間</text><rect x="8" y="232" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="260" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">研究問題與現有資料</text><text x="24" y="291" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">動機與參與</text><text x="24" y="318" font-size="18" fill="#506764" font-weight="500" text-anchor="start">內在、認同上升；動機缺乏也上升</text><path d="M24 333 L336 333" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="358" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">結論的範圍</text><text x="24" y="389" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">缺對照與參與趨勢</text><text x="24" y="417" font-size="18" fill="#506764" font-weight="500" text-anchor="start">不能直接歸因於 AI</text><rect x="8" y="456" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="484" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">研究問題與現有資料</text><text x="24" y="515" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">落差與分化</text><text x="24" y="542" font-size="18" fill="#506764" font-weight="500" text-anchor="start">動機缺乏標準差增加 33.1%</text><path d="M24 557 L336 557" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="582" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">結論的範圍</text><text x="24" y="613" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">缺逐人變化分析</text><text x="24" y="641" font-size="18" fill="#506764" font-weight="500" text-anchor="start">不能證明兩群或成績落差擴大</text></g></svg>