<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">聊天式 AI 與 AI Agent 的差別</title><desc id="desc">聊天式 AI：老師提問、AI 回答、老師自己測試修改。AI Agent：老師給目標、資料範圍與驗收條件，Agent 規劃、動手、檢查並反覆修改，老師收成果與紀錄後再決定是否採用。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="400" height="344" rx="14" fill="#D5E5DF"/><text x="208" y="50" fill="#167C80" font-size="28" font-weight="800" text-anchor="middle">聊天式 AI</text><rect x="36" y="76" width="344" height="62" rx="14" fill="#fff"/><text x="208" y="115" fill="#163D40" font-size="23" font-weight="700" text-anchor="middle">老師提問</text><path d="M208 139 L208 162" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="164" width="344" height="62" rx="14" fill="#fff"/><text x="208" y="203" fill="#163D40" font-size="23" font-weight="700" text-anchor="middle">AI 回答一段文字</text><path d="M208 227 L208 250" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="36" y="252" width="344" height="62" rx="14" fill="#fff"/><text x="208" y="291" fill="#163D40" font-size="23" font-weight="700" text-anchor="middle">老師自己複製、測試、修改</text><rect x="444" y="8" width="668" height="344" rx="14" fill="#F1E2D3"/><text x="778" y="50" fill="#A85F29" font-size="28" font-weight="800" text-anchor="middle">AI Agent</text><rect x="472" y="76" width="612" height="56" rx="14" fill="#fff" stroke="#A85F29" stroke-width="2.5"/><text x="778" y="112" fill="#163D40" font-size="23" font-weight="800" text-anchor="middle">老師給：目標、資料範圍、驗收條件</text><rect x="472" y="170" width="188" height="72" rx="14" fill="#167C80"/><text x="566" y="215" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">規劃步驟</text><path d="M662 206 L682 206" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="684" y="170" width="188" height="72" rx="14" fill="#167C80"/><text x="778" y="215" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">動手做</text><path d="M874 206 L894 206" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="896" y="170" width="188" height="72" rx="14" fill="#167C80"/><text x="990" y="215" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">檢查結果</text><path d="M778 133 L778 168" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><path d="M 990 243 V 262 H 566 V 247" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="718" y="250" width="120" height="25" rx="14" fill="#F1E2D3"/><text x="778" y="269" fill="#167C80" font-size="17" font-weight="700" text-anchor="middle">沒過就再改</text><rect x="472" y="278" width="612" height="56" rx="14" fill="#fff" stroke="#A85F29" stroke-width="2.5"/><text x="778" y="314" fill="#163D40" font-size="23" font-weight="800" text-anchor="middle">老師收：成果與紀錄，再決定要不要用</text></g></svg>