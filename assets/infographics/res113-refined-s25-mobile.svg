<svg xmlns="http://www.w3.org/2000/svg" width="360" height="666" viewBox="0 0 360 666" role="img" aria-labelledby="title desc"><title id="title">同一個 Toy-Processor，學生自己選做法</title><desc id="desc">同一個 Toy-Processor，學生自己選做法。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><path d="M7 50 V474" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 50 H58" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="50" r="29" fill="#D5E5DF"/><g transform="translate(38.8 30.799999999999997) scale(0.8)"><path d="M24 23 A8 8 0 1 0 24 7 A8 8 0 1 0 24 23 M8 43 V38 Q8 28 24 28 Q40 28 40 38 V43" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="57" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">LLM Coding</text><text x="23" y="130" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">學生主導</text><text x="23" y="168" text-anchor="start" font-size="19" font-weight="500" fill="#506764">AI 生成；學生整合測試</text><text x="23" y="198" text-anchor="start" font-size="19" font-weight="500" fill="#506764">多數高完成度者選用</text><path d="M7 262 H58" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="262" r="29" fill="#D5E5DF"/><g transform="translate(38.8 242.8) scale(0.8)"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="269" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">Vibe Coding</text><text x="23" y="342" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">AI 引導</text><text x="23" y="380" text-anchor="start" font-size="19" font-weight="500" fill="#506764">協助完成核心設計</text><text x="23" y="410" text-anchor="start" font-size="19" font-weight="500" fill="#506764">許多學生順利完成</text><path d="M7 474 H58" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="474" r="29" fill="#F1E2D3"/><g transform="translate(38.8 454.8) scale(0.8)"><path d="M9 4 H39 V44 H9 Z M15 16 L19 20 L26 12 M15 33 L19 37 L26 29 M30 17 H33 M30 34 H33" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="481" text-anchor="start" font-size="22" font-weight="800" fill="#A85F29">全手作</text><text x="23" y="554" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">不使用 AI</text><text x="23" y="592" text-anchor="start" font-size="19" font-weight="500" fill="#506764">保留自我挑戰</text><text x="23" y="622" text-anchor="start" font-size="19" font-weight="500" fill="#506764">時限內無人完成</text></g></svg>