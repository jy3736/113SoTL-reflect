<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">第 11 題：前後測的中文用語不同</title><desc id="desc">題目，同一句英文，兩種翻譯，前：「別無選擇，只能參加」，後：「一定得來參加」；信度，前測 α 只有 .357，這題與同構面負相關，排除後 α = .925；結論，外在調節不再顯著，含此題 +0.68，p &lt; .001，排除後 +0.27，p = .075</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8.0" y="80" width="350.6666666666667" height="210" rx="14" fill="#D5E5DF"/><text x="30.0" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">題目</text><text x="30.0" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">同一句英文，兩種翻譯</text><text x="30.0" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">前：「別無選擇，只能參加」</text><text x="30.0" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">後：「一定得來參加」</text><rect x="384.6666666666667" y="80" width="350.6666666666667" height="210" rx="14" fill="#D5E5DF"/><text x="406.6666666666667" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">信度</text><text x="406.6666666666667" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">前測 α 只有 .357</text><text x="406.6666666666667" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">這題與同構面負相關</text><text x="406.6666666666667" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">排除後 α = .925</text><rect x="761.3333333333334" y="80" width="350.6666666666667" height="210" rx="14" fill="#F1E2D3"/><text x="783.3333333333334" y="120" fill="#A85F29" font-size="24" font-weight="800" text-anchor="start">結論</text><text x="783.3333333333334" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">外在調節不再顯著</text><text x="783.3333333333334" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">含此題 +0.68，p &lt; .001</text><text x="783.3333333333334" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">排除後 +0.27，p = .075</text></g></svg>