<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">AI 分擔之後：每門課都照顧得到</title><desc id="desc">教材設計、測驗批改、練習批閱三項工作交給 AI 分擔與自動化，老師的心力回來，平均照顧實驗課與其他課程。為期待的示意，不代表已驗證的成效。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="30" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">AI 分擔之後</text><rect x="14" y="52" width="120" height="56" rx="12" fill="#F1E2D3"/><text x="74" y="88" font-size="19" fill="#A85F29" font-weight="800" text-anchor="middle">教材設計</text><path d="M74 112 L160 134" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="140" y="52" width="120" height="56" rx="12" fill="#F1E2D3"/><text x="200" y="88" font-size="19" fill="#A85F29" font-weight="800" text-anchor="middle">測驗批改</text><path d="M200 112 L200 134" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="266" y="52" width="120" height="56" rx="12" fill="#F1E2D3"/><text x="326" y="88" font-size="19" fill="#A85F29" font-weight="800" text-anchor="middle">練習批閱</text><path d="M326 112 L240 134" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="140" width="320" height="52" rx="12" fill="#167C80"/><text x="200" y="174" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle">AI 分擔・自動化</text><path d="M200 196 L200 220" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120" y="226" width="160" height="60" rx="12" fill="#D5E5DF"/><text x="200" y="254" font-size="21" fill="#167C80" font-weight="800" text-anchor="middle">老師</text><text x="200" y="276" font-size="15" fill="#506764" font-weight="600" text-anchor="middle">心力回來</text><path d="M200 290 L74 322" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="14" y="328" width="120" height="52" rx="12" fill="#FFFFFF" stroke="#167C80" stroke-width="2.4"/><text x="74" y="361" font-size="19" fill="#167C80" font-weight="800" text-anchor="middle">實驗課</text><path d="M200 290 L200 322" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="140" y="328" width="120" height="52" rx="12" fill="#FFFFFF" stroke="#167C80" stroke-width="2.4"/><text x="200" y="361" font-size="19" fill="#167C80" font-weight="800" text-anchor="middle">課程 B</text><path d="M200 290 L326 322" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="266" y="328" width="120" height="52" rx="12" fill="#FFFFFF" stroke="#167C80" stroke-width="2.4"/><text x="326" y="361" font-size="19" fill="#167C80" font-weight="800" text-anchor="middle">課程 C</text><text x="200" y="418" font-size="20" fill="#163D40" font-weight="800" text-anchor="middle">每門課都照顧得到，不再大小眼</text></g></svg>