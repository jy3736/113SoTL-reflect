<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">同一班追蹤四次，能描述什麼？</title><desc id="desc">四輪主樣本 41 人；ANOVA 為 39 人；報告未說明兩者差異的完整原因。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="1104" height="56" rx="18" fill="#D5E5DF"/><g transform="translate(24 14) scale(0.55)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="92" height="29" rx="4"/><path d="M27 13 h66 M27 23 h45"/><circle cx="26" cy="47" r="8"/><circle cx="60" cy="47" r="8"/><circle cx="94" cy="47" r="8"/><path d="M11 79 V66 q15-15 30 0 v13 M45 79 V66 q15-15 30 0 v13 M79 79 V66 q15-15 30 0 v13"/></g><text x="110" y="46" font-size="25" fill="#167C80" font-weight="800" text-anchor="start">同一個自然班級，重複量測四次</text><path d="M144 125 L984 125" fill="none" stroke="#B5CAC3" stroke-width="3"/><rect x="68" y="82" width="152" height="86" rx="18" fill="#D5E5DF"/><g transform="translate(76 90) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3 h48 l16 16 v60 H29 Z M77 3 v17 h16 M40 36 h7 M54 36 h26 M40 52 h7 M54 52 h26 M40 68 h7 M54 68 h26"/></g><text x="173" y="133" font-size="32" fill="#167C80" font-weight="800" text-anchor="middle">1</text><rect x="348" y="82" width="152" height="86" rx="18" fill="#D5E5DF"/><g transform="translate(356 90) scale(0.7)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3 h48 l16 16 v60 H29 Z M77 3 v17 h16 M40 36 h7 M54 36 h26 M40 52 h7 M54 52 h26 M40 68 h7 M54 68 h26"/></g><text x="453" y="133" font-size="32" fill="#167C80" font-weight="800" text-ancho