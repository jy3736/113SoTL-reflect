<svg xmlns="http://www.w3.org/2000/svg" width="360" height="852" viewBox="0 0 360 852" role="img" aria-labelledby="title desc"><title id="title">第 33 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 30) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="118" y="45" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">研究問題與現有資料</text><text x="118" y="82" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">教師負擔：有流程經驗</text><path d="M26 118 L334 118" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="152" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">結論的範圍</text><text x="28" y="191" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">還缺教師工時比較</text><text x="28" y="233" font-size="17" fill="#506764" font-weight="500" text-anchor="start">不能量化節省多少時間</text><rect x="8" y="292" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 314) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5 v72 h102 M22 58 l18-16 22 9 25-31 18 9"/><circle cx="40" cy="42" r="4"/><circle cx="62" cy="51" r="4"/><circle cx="87" cy="20" r="4"/></g><text x="118" y="329" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">研究問題與現有資料</text><text x="118" y="366" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">動機：正向與警訊並存</text><path d="M26 402 L334 402" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="436" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">結論的範圍</text><text x="28" y="475" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">還缺對照與參與趨勢</text><text x="28" y="517" font-size="17" fill="#506764" font-weight="500" text-anchor="start">不能直接歸因於 AI</text><rect x="8" y="576" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 598) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="118" y="613" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">研究問題與現有資料</text><text x="118" y="650" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">分散：動機缺乏 SD 增加</text><path d="M26 686 L334 686" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="720" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">結論的範圍</text><text x="28" y="759" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">還缺逐人變化分析</text><text x="28" y="801" font-size="17" fill="#506764" font-weight="500" text-anchor="start">不能證明兩群或成績落差擴大</text></g></svg>