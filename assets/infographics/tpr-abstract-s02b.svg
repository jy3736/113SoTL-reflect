<svg xmlns="http://www.w3.org/2000/svg" width="708" height="462" viewBox="0 0 708 462" role="img" aria-labelledby="title desc"><title id="title">113 計畫摘要：四階段教學模式</title><desc id="desc">四個教學階段由基礎導入、模組設計、RTL 合成到 AI 協作專題逐步上升，AI 協作逐步加深；學生依能力自選 LLM Coding 或 Vibe Coding；每階段一輪 SIMS 追蹤動機；多層次評量含形成性選擇題、自動批閱 Verilog 與專題鷹架檢核。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="0" y="28" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">四階段教學模式</text><rect x="0" y="220" width="128" height="118" rx="18" fill="#E7EFEB"/><rect x="0" y="320" width="128" height="20" fill="#E7EFEB"/><text x="16" y="248" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">階段 1</text><text x="16" y="280" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">基礎導入</text><text x="16" y="308" font-size="14" fill="#506764" font-weight="600" text-anchor="start">布林・Verilog</text><circle cx="64" cy="358" r="12" fill="#A85F29"/><text x="64" y="363" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">1</text><rect x="138" y="176" width="128" height="162" rx="18" fill="#D5E5DF"/><rect x="138" y="320" width="128" height="20" fill="#D5E5DF"/><text x="154" y="204" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">階段 2</text><text x="154" y="236" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">模組設計</text><text x="154" y="264" font-size="14" fill="#506764" font-weight="600" text-anchor="start">模組化・FSM</text><text x="154" y="292" font-size="14" fill="#A85F29" font-weight="800" text-anchor="start">AI 初探</text><circle cx="202" cy="358" r="12" fill="#A85F29"/><text x="202" y="363" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">2</text><rect x="276" y="132" width="128" height="206" rx="18" fill="#C2DCD4"/><rect x="276" y="320" width="128" height="20" fill="#C2DCD4"/><text x="292" y="160" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">階段 3</text><text x="292" y="192" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">RTL 合成</text><text x="292" y="220" font-size="14" fill="#506764" font-weight="600" text-anchor="start">可合成 RTL</text><text x="292" y="248" font-size="14" fill="#A85F29" font-weight="800" text-anchor="start">LLM Coding</text><circle cx="340" cy="358" r="12" fill="#A85F29"/><text x="340" y="363" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">3</text><rect x="414" y="88" width="128" height="250" rx="18" fill="#ADD1C7"/><rect x="414" y="320" width="128" height="20" fill="#ADD1C7"/><text x="430" y="116" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">階段 4</text><text x="430" y="148" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">AI 協作專題</text><text x="430" y="176" font-size="14" fill="#506764" font-weight="600" text-anchor="start">Toy-Processor</text><text x="430" y="204" font-size="14" fill="#A85F29" font-weight="800" text-anchor="start">分層實作</text><circle cx="478" cy="358" r="12" fill="#A85F29"/><text x="478" y="363" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">4</text><path d="M20 202 L454 70" fill="none" stroke="#A85F29" stroke-width="2.6" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="96" y="166" font-size="16" fill="#A85F29" font-weight="800" transform="rotate(-17 96 166)">AI 協作逐步加深</text><text x="0" y="388" font-size="15" fill="#A85F29" font-weight="800" text-anchor="start">● SIMS 四輪情境動機問卷，跟著四個階段追蹤</text><path d="M548 124 H562 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="638" y="40" font-size="16" fill="#167C80" font-weight="800" text-anchor="middle">學生依能力自選</text><rect x="568" y="54" width="140" height="108" rx="18" f