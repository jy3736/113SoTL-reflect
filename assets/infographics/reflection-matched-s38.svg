<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">第 38 頁概念圖</title><desc id="desc">教師先定目標、資料範圍與驗收條件。Agent 規劃、執行、檢查；未符合條件時，沿連續回路返回規劃步驟修正。教師看成果與紀錄，決定是否採用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="366" height="342" rx="18" fill="#D5E5DF"/><text x="191" y="40" font-size="25" fill="#167C80" font-weight="800" text-anchor="middle">聊天式 AI</text><rect x="24" y="61" width="334" height="81" rx="18" fill="#F7F4EC"/><g transform="translate(36 71) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7 h96 v49 H56 L34 77 V56 H7 Z M23 23 h61 M23 38 h43"/></g><text x="134" y="109" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">老師提問</text><path d="M191 144 V153 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="155" width="334" height="81" rx="18" fill="#F7F4EC"/><g transform="translate(36 165) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 h68 v65 H10 Z M23 19 h42 M23 34 h31 M23 49 h39 M81 17 h22 v64 H36 v-9"/></g><text x="134" y="203" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">AI 回答文字</text><path d="M191 238 V247 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="249" width="334" height="81" rx="18" fill="#F7F4EC"/><g transform="translate(36 259) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="134" y="297" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">老師測試、修改</text><rect x="403" y="8" width="709" height="342" rx="18" fill="#F1E2D3"/><text x="757" y="40" font-size="25" fill="#A85F29" font-weight="800" text-anchor="middle">AI Agent：教師定界線，再驗收</text><rect x="423" y="57" width="669" height="58" rx="18" fill="#F7F4EC"/><text x="757" y="94" font-size="24" fill="#163D40" font-weight="800" text-anchor="middle">目標・資料範圍・驗收條件</text><rect x="424" y="135" width="200" height="116" rx="18" fill="#D5E5DF"/><g transform="translate(483 146) scale(0.68)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="8" width="68" height="72" rx="5"/><rect x="42" y="2" width="36" height="13" rx="3" fill="#F7F4EC"/><path d="M38 32 l5 5 10-13 M63 32 h19 M38 55 l5 5 10-13 M63 55 h19 M38 71 h44"/></g><text x="524" y="236" font-size="22" fill="#163D40" font-weight="800" text-anchor="middle">規劃步驟</text><path d="M631 193 H651 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="658" y="135" width="200" height="116" rx="18" fill="#D5E5DF"/><g transform="translate(717 146) scale(0.68)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 h54 v74 H12 Z M24 22 h29 M24 37 h24 M24 52 h17"/><path d="M76 80 l5-19 23-28 12 10-23 28 Z M81 61 l12 10 M99 39 l12 10"/></g><text x="758" y="236" font-size="22" fill="#163D40" font-weight="800" text-anchor="middle">動手執行</text><path d="M865 193 H885 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="892" y="135" width="200" height="116" rx="18" fill="#D5E5DF"/><g transform="translate(951 146) scale(0.68)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="992" y="236" font-size="22" fill="#163D40" font-weight="800" text-anchor="middle">檢查結果</text><path d="M992 254 V291 H524 V257" fill="none" stroke="#167C80" stroke-width="2.5" marker-end="url(#arrow)"/><text x="757" y="276" font-size="17" fill="#167C80" font-weight="700" text-anchor="middle">未符合條件，回頭修正</text><rect x="423" y="300" width="669" height="36" rx="18" fill="#F7F4EC"/><text x="757" y="326" font-size="22" fill="#163D40" font-weight="800" text-anchor="middle">教師看成果與紀錄，決定是否採用</text></g></svg>