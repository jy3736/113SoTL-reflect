<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">第 38 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="366" height="342" rx="18" fill="#D5E5DF"/><text x="191" y="40" font-size="25" fill="#167C80" font-weight="800" text-anchor="middle">聊天式 AI</text><rect x="24" y="61" width="334" height="81" rx="18" fill="#F7F4EC"/><g transform="translate(36 71) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7 h96 v49 H56 L34 77 V56 H7 Z M23 23 h61 M23 38 h43"/></g><text x="134" y="109" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">老師提問</text><path d="M191 144 V153 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="155" width="334" height="81" rx="18" fill="#F7F4EC"/><g transform="translate(36 165) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 h68 v65 H10 Z M23 19 h42 M23 34 h31 M23 49 h39 M81 17 h22 v64 H36 v-9"/></g><text x="134" y="203" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">AI 回答文字</text><path d="M191 238 V247 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="249" width="334" height="81" rx="18" fill="#F7F4EC"/><g transform="translate(36 259) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0