<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 24 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><g transform="translate(140 8) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="200" y="119" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">把敘述對回原圖</text><rect x="12" y="145" width="376" height="86" rx="18" fill="#D5E5DF"/><text x="32" y="176" font-size="21" fill="#167C80" font-weight="800" text-anchor="start">第 3 次</text><text x="32" y="209" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">三種構面都是低點</text><rect x="12" y="248" width="376" height="86" rx="18" fill="#F1E2D3"/><text x="32" y="279" font-size="21" fill="#167C80" font-weight="800" text-anchor="start">第 4 次</text><text x="32" y="312" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">三種構面都是高點</text><text x="200" y="378" font-size="21" fill="#A85F29" font-weight="800" text-anchor="middle">四次描述 ≠ AI 因果效果</text><text x="200" y="414" font-size="18" fill="#506764" font-weight="500" text-anchor="middle">原始數值與曲線，見左圖</text></g></svg>