<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc"><title id="title">「活」教材：過去老師一人補寫，加入 AI 後由 AI 補強、老師驗證</title><desc id="desc">上排為過去的複習翻轉：察覺卡關點後，由老師自己課後補寫與修訂教材，再補進 Notion，時間與心理負擔沉重。下排為加入 AI 之後：察覺、AI 依課堂訊息與現有教材補強、教師最後驗證與細修、補進 Notion。多出的一步由 AI 協助，不是老師動手。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="8" y="30" font-size="19" fill="#A85F29" font-weight="800" text-anchor="start">過去｜複習翻轉</text><text x="352" y="30" font-size="14" fill="#506764" font-weight="600" text-anchor="end">老師一人完成</text><rect x="8" y="44" width="344" height="84" rx="14" fill="#D5E5DF"/><text x="22" y="70" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">01 察覺</text><text x="22" y="96" font-size="19" fill="#163D40" font-weight="800" text-anchor="start">找到卡關點</text><text x="22" y="118" font-size="14" fill="#506764" font-weight="600" text-anchor="start">反應、Zuvio、助教回饋</text><rect x="8" y="138" width="344" height="84" rx="14" fill="#F1E2D3"/><text x="22" y="164" font-size="15" fill="#A85F29" font-weight="800" text-anchor="start">02＋03 老師自己來</text><text x="22" y="190" font-size="19" fill="#163D40" font-weight="800" text-anchor="start">課後補寫、修訂教材</text><text x="22" y="212" font-size="14" fill="#506764" font-weight="600" text-anchor="start">時間與心理負擔都沉重</text><rect x="8" y="232" width="344" height="84" rx="14" fill="#D5E5DF"/><text x="22" y="258" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">04 更新</text><text x="22" y="284" font-size="19" fill="#163D40" font-weight="800" text-anchor="start">補進 Notion 教材</text><text x="22" y="306" font-size="14" fill="#506764" font-weight="600" text-anchor="start">筆記一改，線上跟著改</text><text x="8" y="366" font-size="19" fill="#167C80" font-weight="800" text-anchor="start">加入 AI 之後</text><text x="352" y="366" font-size="14" fill="#506764" font-weight="600" text-anchor="end">多一步，不是老師動手</text><rect x="8" y="380" width="344" height="84" rx="14" fill="#D5E5DF"/><text x="22" y="406" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">01 察覺</text><text x="22" y="432" font-size="19" fill="#163D40" font-weight="800" text-anchor="start">找到卡關點</text><text x="22" y="454" font-size="14" fill="#506764" font-weight="600" text-anchor="start">反應、Zuvio、助教回饋</text><rect x="8" y="474" width="344" height="84" rx="14" fill="#FFFFFF" stroke="#167C80" stroke-width="2.4"/><text x="22" y="500" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">02 AI 補強</text><text x="22" y="526" font-size="19" fill="#163D40" font-weight="800" text-anchor="start">訊息＋教材交給 AI</text><text x="22" y="548" font-size="14" fill="#506764" font-weight="600" text-anchor="start">補說明、例題、格式</text><rect x="8" y="568" width="344" height="84" rx="14" fill="#D5E5DF"/><text x="22" y="594" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">03 教師驗證</text><text x="22" y="620" font-size="19" fill="#163D40" font-weight="800" text-anchor="start">最後驗證與細修</text><text x="22" y="642" font-size="14" fill="#506764" font-weight="600" text-anchor="start">概念、答案、例子要對</text><rect x="8" y="662" width="344" height="84" rx="14" fill="#D5E5DF"/><text x="22" y="688" font-size="15" fill="#167C80" font-weight="800" text-anchor="start">04 更新</text><text x="22" y="714" font-size="19" fill="#163D40" font-weight="800" text-anchor="start">補進 Notion 教材</text><text x="22" y="736" font-size="14" fill="#506764" font-weight="600" text-anchor="start">再觀察學生如何使用</text></g></svg>