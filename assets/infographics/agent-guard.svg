<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">工具越能動手，三件事越要先講好</title><desc id="desc">資料，學生資料先去識別，雲端模型可能把資料，送到遠端處理；驗證，成品要有驗收條件，測資、對答案、抽查，責任仍在老師；揭露，用了就要說清楚，目的、方式、範圍，內容由主持人負責</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8.0" y="80" width="350.6666666666667" height="210" rx="14" fill="#D5E5DF"/><text x="30.0" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">資料</text><text x="30.0" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">學生資料先去識別</text><text x="30.0" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">雲端模型可能把資料</text><text x="30.0" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">送到遠端處理</text><rect x="384.6666666666667" y="80" width="350.6666666666667" height="210" rx="14" fill="#D5E5DF"/><text x="406.6666666666667" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">驗證</text><text x="406.6666666666667" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">成品要有驗收條件</text><text x="406.6666666666667" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">測資、對答案、抽查</text><text x="406.6666666666667" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">責任仍在老師</text><rect x="761.3333333333334" y="80" width="350.6666666666667" height="210" rx="14" fill="#D5E5DF"/><text x="783.3333333333334" y="120" fill="#167C80" font-size="24" font-weight="800" text-anchor="start">揭露</text><text x="783.3333333333334" y="170" fill="#163D40" font-size="28" font-weight="800" text-anchor="start">用了就要說清楚</text><text x="783.3333333333334" y="212" fill="#506764" font-size="22" font-weight="500" text-anchor="start">目的、方式、範圍</text><text x="783.3333333333334" y="247" fill="#506764" font-size="22" font-weight="500" text-anchor="start">內容由主持人負責</text></g></svg>