<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340" role="img" aria-labelledby="title desc"><title id="title">今天的六段路線</title><desc id="desc">為什麼做：雙低、落差、負荷；新教學設計：四階段、三條路；證據：動機兩面都升高；反思：三個問題答到哪；PEA 與教具：每週循環、六套工具；走向 Agent：教師主導的流程</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="4" width="344" height="46" rx="14" fill="#D5E5DF"/><text x="180" y="35" fill="#163D40" font-size="20" font-weight="800" text-anchor="middle">1　為什麼做</text><rect x="8" y="60" width="344" height="46" rx="14" fill="#D5E5DF"/><text x="180" y="91" fill="#163D40" font-size="20" font-weight="800" text-anchor="middle">2　新教學設計</text><rect x="8" y="116" width="344" height="46" rx="14" fill="#D5E5DF"/><text x="180" y="147" fill="#163D40" font-size="20" font-weight="800" text-anchor="middle">3　證據</text><rect x="8" y="172" width="344" height="46" rx="14" fill="#D5E5DF"/><text x="180" y="203" fill="#163D40" font-size="20" font-weight="800" text-anchor="middle">4　反思</text><rect x="8" y="228" width="344" height="46" rx="14" fill="#D5E5DF"/><text x="180" y="259" fill="#163D40" font-size="20" font-weight="800" text-anchor="middle">5　PEA 與教具</text><rect x="8" y="284" width="344" height="46" rx="14" fill="#F1E2D3"/><text x="180" y="315" fill="#A85F29" font-size="20" font-weight="800" text-anchor="middle">6　走向 Agent</text></g></svg>