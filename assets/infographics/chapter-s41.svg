<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 41 頁主題導讀</title><desc id="desc">本頁三個主題使用相同版型；概念示意，不表示數量或成效。反思頁箭頭表示閱讀順序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="384" height="108" rx="18" fill="#D5E5DF"/><g transform="translate(24 29) scale(0.76)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="20" r="15"/><path d="M31 80 V58 q0-22 29-22 q29 0 29 22 v22 M42 57 v23 M78 57 v23"/></g><text x="134" y="50" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">人為主體</text><text x="134" y="88" font-size="18" fill="#506764" font-weight="500" text-anchor="start">AI 支援，不代替學習</text><rect x="8" y="134" width="384" height="108" rx="18" fill="#D5E5DF"/><g transform="translate(24 155) scale(0.76)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="134" y="176" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">批判使用</text><text x="134" y="214" font-size="18" fill="#506764" font-weight="500" text-anchor="start">主動審視與檢驗產出</text><rect x="8" y="260" width="384" height="108" rx="18" fill="#F1E2D3"/><g transform="translate(24 281) scale(0.76)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="92" height="29" rx="4"/><path d="M27 13 h66 M27 23 h45"/><circle cx="26" cy="47" r="8"/><circle cx="60" cy="47" r="8"/><circle cx="94" cy="47" r="8"/><path d="M11 79 V66 q15-15 30 0 v13 M45 79 V66 q15-15 30 0 v13 M79 79 V66 q15-15 30 0 v13"/></g