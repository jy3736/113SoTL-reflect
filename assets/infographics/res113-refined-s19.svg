<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">18 週，AI 從第二階段開始加入</title><desc id="desc">18 週，AI 從第二階段開始加入。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="139" width="264" height="203" rx="8" fill="#D5E5DF"/><g transform="translate(27.200000000000003 158.2) scale(0.95)"><path d="M24 11 Q13 3 3 9 V39 Q13 33 24 41 Q35 33 45 39 V9 Q35 3 24 11 V41 M9 16 L17 17 M31 17 L39 16 M9 23 L17 24 M31 24 L39 23" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="92" y="188" text-anchor="start" font-size="24" font-weight="800" fill="#167C80">階段一</text><text x="30" y="236" text-anchor="start" font-size="25" font-weight="800" fill="#163D40">不用 AI</text><text x="30" y="274" text-anchor="start" font-size="20" font-weight="500" fill="#506764">基礎複習、Verilog</text><text x="30" y="305" text-anchor="start" font-size="20" font-weight="500" fill="#506764">SIMS ① 課程開始</text><path d="M275 173 H283" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><rect x="286" y="111" width="264" height="231" rx="8" fill="#D5E5DF"/><g transform="translate(305.2 130.2) scale(0.95)"><path d="M4 6 H44 V33 H20 L9 43 V33 H4 Z M12 15 H36 M12 23 H29" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="370" y="160" text-anchor="start" font-size="24" font-weight="800" fill="#1