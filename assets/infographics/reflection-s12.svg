<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="386" viewBox="0 0 1120 386" role="img" aria-labelledby="title desc"><title id="title">研究問題要對回資料</title><desc id="desc">三個研究問題分別對應教師工時、動機與歷程、個別變化資料；資料需求是本次分享整理，不表示報告已完成所有分析。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="130" y="26" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">報告的研究問題</text><text x="628" y="26" font-size="22" fill="#A85F29" font-weight="800" text-anchor="start">本次分享整理：需要的證據</text><rect x="8" y="44" width="506" height="102" rx="18" fill="#D5E5DF"/><g transform="translate(26 64) scale(0.72)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="42" r="35"/><path d="M60 18 v25 l20 12 M48 2 h24"/></g><text x="130" y="84" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">教師負擔能減輕嗎？</text><text x="130" y="122" font-size="20" fill="#506764" font-weight="500" text-anchor="start">教材編寫與評量設計</text><path d="M526 95 H591 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="604" y="44" width="508" height="102" rx="18" fill="#F1E2D3"/><text x="628" y="84" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">教師工時資料</text><text x="628" y="122" font-size="20" fill="#506764" font-weight="500" text-anchor="start">起草、查核、維護與支援</text><rect x="8" y="160" width="506" height="102" rx="18" fill="#D5E5DF"/><g transform="translate(26 180) scale(0.72)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="92" height="29" rx="4"/><path d="M27 13 h66 M27 23 h45"/><circle cx="26" cy="47" r="8"/><circle cx="60" cy="47" r="8"/><circle cx="9