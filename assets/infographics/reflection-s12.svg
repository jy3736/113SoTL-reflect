<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">三個研究問題，先想好怎麼回答</title><desc id="desc">右欄是依研究問題整理的資料需求；不表示報告已完成所有分析。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="20" y="26" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">報告的研究問題</text><text x="644" y="26" font-size="22" fill="#A85F29" font-weight="800" text-anchor="start">本次分享整理：需要的證據</text><rect x="8" y="44" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">教師負擔能減輕嗎？</text><text x="32" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">教材編寫與評量設計</text><rect x="632" y="44" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="81" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">需要教師工時資料</text><text x="656" y="114" font-size="20" fill="#506764" font-weight="500" text-anchor="start">起草、查核、維護與支援</text><path d="M504 90.0 L616 90.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="77.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">對應</text><rect x="8" y="148" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">動機與參與能提升嗎？</text><text x="32" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">AI 協作中的學習經驗</text><rect x="632" y="148" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="185" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">需要動機與歷程資料</text><text x="656" y="218" font-size="20" fill="#506764" font-weight="500" text-anchor="start">SIMS、參與紀錄與回饋</text><path d="M504 194.0 L616 194.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="181.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">對應</text><rect x="8" y="252" width="480" height="92" rx="18" fill="#D5E5DF"/><text x="32" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">落差與分化會擴大嗎？</text><text x="32" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">不同起點的學生如何回應</text><rect x="632" y="252" width="480" height="92" rx="18" fill="#F1E2D3"/><text x="656" y="289" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">需要個別變化資料</text><text x="656" y="322" font-size="20" fill="#506764" font-weight="500" text-anchor="start">逐人追蹤，避免只看平均</text><path d="M504 298.0 L616 298.0" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="285.0" font-size="16" fill="#506764" font-weight="600" text-anchor="middle">對應</text></g></svg>