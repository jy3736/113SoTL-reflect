<svg xmlns="http://www.w3.org/2000/svg" width="360" height="716" viewBox="0 0 360 716" role="img" aria-labelledby="title desc"><title id="title">三個風險，各配一道要驗證的防線</title><desc id="desc">以上為報告建議；尚未證實各項防線的防護效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="36" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告提醒的風險</text><text x="24" y="67" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">動機退縮的風險</text><text x="24" y="94" font-size="18" fill="#506764" font-weight="500" text-anchor="start">學生的起點與進度不同</text><path d="M24 109 L336 109" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="134" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">報告建議的防線</text><text x="24" y="165" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">及早辨識、分層支援</text><text x="24" y="193" font-size="18" fill="#506764" font-weight="500" text-anchor="start">調整任務並給個別引導</text><rect x="8" y="232" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="260" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告提醒的風險</text><text x="24" y="291" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">過度依賴 AI</text><text x="24" y="318" font-size="18" fill="#506764" font-weight="500" text-anchor="start">直接接受答案，未必理解</text><path d="M24 333 L336 333" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="358" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">報告建議的防線</text><text x="24" y="389" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">分析與驗證 AI 產出</text><text x="24" y="417" font-size="18" fill="#506764" font-weight="500" text-anchor="start">用錯誤案例練習判斷</text><rect x="8" y="456" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="484" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">報告提醒的風險</text><text x="24" y="515" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">工具誤用</text><text x="24" y="542" font-size="18" fill="#506764" font-weight="500" text-anchor="start">只看到成品，看不到歷程</text><path d="M24 557 L336 557" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="582" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">報告建議的防線</text><text x="24" y="613" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">規範與過程評量</text><text x="24" y="641" font-size="18" fill="#506764" font-weight="500" text-anchor="start">檢視思考歷程與互動紀錄</text></g></svg>