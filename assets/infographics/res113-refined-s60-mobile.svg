<svg xmlns="http://www.w3.org/2000/svg" width="360" height="666" viewBox="0 0 360 666" role="img" aria-labelledby="title desc"><title id="title">三個研究問題，逐一對回證據與缺口</title><desc id="desc">三個研究問題，逐一對回證據與缺口。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><circle cx="58" cy="50" r="29" fill="#D5E5DF"/><g transform="translate(38.8 30.799999999999997) scale(0.8)"><path d="M24 43 A19 19 0 1 0 24 5 A19 19 0 1 0 24 43 M24 13 V25 L33 30" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="57" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">教師負擔</text><text x="23" y="130" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">有經驗描述</text><text x="23" y="168" text-anchor="start" font-size="19" font-weight="500" fill="#506764">還缺：教師時數比較</text><path d="M59 85 V96" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><circle cx="58" cy="262" r="29" fill="#D5E5DF"/><g transform="translate(38.8 242.8) scale(0.8)"><path d="M24 23 A8 8 0 1 0 24 7 A8 8 0 1 0 24 23 M8 43 V38 Q8 28 24 28 Q40 28 40 38 V43" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="269" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">動機與參與</text><text x="23" y="342" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">正向動機升高</text><text x="23" y="380" text-anchor="start" font-size="19" font-weight="500" fill="#5