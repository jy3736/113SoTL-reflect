<svg xmlns="http://www.w3.org/2000/svg" width="360" height="750" viewBox="0 0 360 750" role="img" aria-labelledby="title desc"><title id="title">PEA 每週循環</title><desc id="desc">P 預習（課前＋課初 15 分）：先看過，不求全懂，影片、Podcast、數位教材，可重做的預習評量；E 參與（課中）：聽講・討論・實作，IRS、課堂溫度計、選我選我，小組討論、自動批閱實作；A 評估（課末 20 分）：形成性評量檢核，可重做的多選題，學生自檢、老師看整體。老師依課堂觀察與評量數據，修正、補強下週內容。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="4" width="344" height="202" rx="14" fill="#D5E5DF"/><circle cx="46" cy="46" r="28" fill="#167C80"/><text x="46" y="58" fill="#fff" font-size="32" font-weight="800" text-anchor="middle">P</text><text x="88" y="40" fill="#163D40" font-size="23" font-weight="800" text-anchor="start">預習</text><text x="88" y="68" fill="#167C80" font-size="16" font-weight="700" text-anchor="start">課前＋課初 15 分</text><text x="24" y="112" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">先看過，不求全懂</text><text x="24" y="146" fill="#506764" font-size="17" font-weight="500" text-anchor="start">影片、Podcast、數位教材</text><text x="24" y="176" fill="#506764" font-size="17" font-weight="500" text-anchor="start">可重做的預習評量</text><rect x="8" y="222" width="344" height="202" rx="14" fill="#D5E5DF"/><circle cx="46" cy="264" r="28" fill="#163D40"/><text x="46" y="276" fill="#fff" font-size="32" font-weight="800" text-anchor="middle">E</text><text x="88" y="258" fill="#163D40" font-size="23" font-weight="800" text-anchor="start">參與</text><text x="88" y="286" fill="#167C80" font-size="16" font-weight="700" text-anchor="start">課中</text><text x="24" y="330" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">聽講・討論・實作</text><text x="24" y="364" fill="#506764" font-size="17" font-weight="500" text-anchor="start">IRS、課堂溫度計、選我選我</text><text x="24" y="394" fill="#506764" font-size="17" font-weight="500" text-anchor="start">小組討論、自動批閱實作</text><rect x="8" y="440" width="344" height="202" rx="14" fill="#D5E5DF"/><circle cx="46" cy="482" r="28" fill="#167C80"/><text x="46" y="494" fill="#fff" font-size="32" font-weight="800" text-anchor="middle">A</text><text x="88" y="476" fill="#163D40" font-size="23" font-weight="800" text-anchor="start">評估</text><text x="88" y="504" fill="#167C80" font-size="16" font-weight="700" text-anchor="start">課末 20 分</text><text x="24" y="548" fill="#163D40" font-size="21" font-weight="800" text-anchor="start">形成性評量檢核</text><text x="24" y="582" fill="#506764" font-size="17" font-weight="500" text-anchor="start">可重做的多選題</text><text x="24" y="612" fill="#506764" font-size="17" font-weight="500" text-anchor="start">學生自檢、老師看整體</text><rect x="8" y="658" width="344" height="84" rx="14" fill="#F1E2D3"/><text x="180" y="692" fill="#A85F29" font-size="19" font-weight="800" text-anchor="middle">老師看課堂觀察＋評量數據</text><text x="180" y="722" fill="#A85F29" font-size="19" font-weight="800" text-anchor="middle">修正、補強下週內容</text></g></svg>