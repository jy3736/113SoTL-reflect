<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="404" viewBox="0 0 1120 404" role="img" aria-labelledby="title desc"><title id="title">同一個專題，三條自選路徑</title><desc id="desc">路徑與結果依報告描述；做不完者另可選補救觀念測驗。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="350" y="0" width="420" height="76" rx="18" fill="#167C80"/><text x="560" y="32" font-size="25" fill="#FFFFFF" font-weight="800" text-anchor="middle">同一個處理器專題</text><text x="560" y="66" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">20 條指令・12 組功能測試</text><path d="M560 77 L560 101" fill="none" stroke="#167C80" stroke-width="3"/><path d="M184 101 L936 101" fill="none" stroke="#167C80" stroke-width="3"/><path d="M184 101 v17 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.5"/><rect x="8" y="122" width="352" height="236" rx="18" fill="#D5E5DF"/><text x="30" y="156" font-size="23" fill="#167C80" font-weight="800" text-anchor="start">LLM Coding</text><g transform="translate(124 177) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="17" r="10"/><path d="M2 54 V40 q15-16 30 0 v14 M39 12 h72 v35 H79 L64 60 V47 H39 Z M52 25 l-5 5 5 5 M69 25 l5 5-5 5 M88 35 h11 M38 72 h69 M49 60 l-8 6 8 6 M98 60 l8 6-8 6"/></g><text x="30" y="289" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">學生主導設計</text><text x="30" y="329" font-size="19" fill="#506764" font-weight="500" text-anchor="start">AI 生成模組，學生整合驗證</text><path d="M560 101 v17 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.5"/><rect x="384" y="122" width="352" height="236" rx="18" fill="#D5E5DF"/><text x="406" y="156" font-size="23" fill="#167C80" font-weight="800" text-anchor="start">Vibe Coding</text><g transform="translate(500 177) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7 h76 v35 H44 L29 56 V42 H4 Z M18 21 h48 M18 31 h27"/><circle cx="98" cy="29" r="11"/><path d="M82 70 V54 q16-16 32 0 v16 M27 67 h46 m-8-6 l8 6-8 6"/></g><text x="406" y="289" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">AI 引導核心設計</text><text x="406" y="329" font-size="19" fill="#506764" font-weight="500" text-anchor="start">完成作品，不代表同等理解</text><path d="M936 101 v17 m-5-7 l5 7 5-7" fill="none" stroke="#167C80" stroke-width="2.5"/><rect x="760" y="122" width="352" height="236" rx="18" fill="#F1E2D3"/><text x="782" y="156" font-size="23" fill="#A85F29" font-weight="800" text-anchor="start">全手作</text><g transform="translate(876 177) scale(1)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="14" r="11"/><path d="M39 54 V38 q21-18 42 0 v16"/><rect x="20" y="48" width="80" height="29" rx="4" fill="#F7F4EC"/><path d="M10 81 h100 M42 55 l-6 7 6 7 M69 55 l6 7-6 7"/></g><text x="782" y="289" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">自行撰寫與驗證</text><text x="782" y="329" font-size="19" fill="#506764" font-weight="500" text-anchor="start">時限內無人完成；非分組實驗</text><text x="560" y="391" font-size="20" fill="#506764" font-weight="600" text-anchor="middle">三種自選方式，共用測試；不是三組效果比較</text></g></svg>