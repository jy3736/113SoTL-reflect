<svg xmlns="http://www.w3.org/2000/svg" width="360" height="562" viewBox="0 0 360 562" role="img" aria-labelledby="title desc"><title id="title">從生成式 AI 協作走到 AI Agent 的時間線</title><desc id="desc">113 計畫，LLM Coding，自建自動批閱，四次 SIMS；114 申請書，Agent 未準備好，我當時的判斷，（該案未獲通過）；2025-09，教師工作坊，教師 AI 賦能，「教與學」；114-2，Agent 整合工具，老師提需求、驗結果，回教室接受檢驗；2026 暑期，九場 Agent 工作坊，智慧雨林計畫，教師主導流程</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><path d="M24 16 V530" stroke="#167C80" stroke-width="4"/><circle cx="24" cy="30" r="9" fill="#167C80"/><rect x="46" y="6" width="306" height="102" rx="14" fill="#D5E5DF"/><text x="60" y="32" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">113 計畫</text><text x="60" y="60" fill="#163D40" font-size="20" font-weight="800" text-anchor="start">LLM Coding</text><text x="60" y="88" fill="#506764" font-size="15" font-weight="500" text-anchor="start">自建自動批閱・四次 SIMS</text><circle cx="24" cy="142" r="9" fill="#A85F29"/><rect x="46" y="118" width="306" height="102" rx="14" fill="#F1E2D3"/><text x="60" y="144" fill="#A85F29" font-size="16" font-weight="800" text-anchor="start">114 申請書</text><text x="60" y="172" fill="#163D40" font-size="20" font-weight="800" text-anchor="start">Agent 未準備好</text><text x="60" y="200" fill="#506764" font-size="15" font-weight="500" text-anchor="start">我當時的判斷・（該案未獲通過）</text><circle cx="24" cy="254" r="9" fill="#167C80"/><rect x="46" y="230" width="306" height="102" rx="14" fill="#D5E5DF"/><text x="60" y="256" fill="#167C80" font-size="16" font-weight="800" text-anchor="start">2025-09</text><text x