<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">自動批閱：讓提交、回饋、修正接成一圈</title><desc id="desc">62.2% 選為喜愛的教法（45 人複選）；偏好與功能測試都不能代替理解測量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="0" width="1104" height="48" rx="18" fill="#D5E5DF"/><line x1="560" y1="11" x2="560" y2="37" stroke="#FFFFFF" stroke-width="2.4"/><text x="284" y="31" font-size="20" fill="#167C80" font-weight="800" text-anchor="middle">HDLBits｜指定 71 題・班平均 62 題</text><text x="836" y="31" font-size="20" fill="#A85F29" font-weight="800" text-anchor="middle">Verilog 自動批閱｜平時 25・期中 4・期末 12 組</text><rect x="8.0" y="66" width="338.6667" height="222" rx="18" fill="#D5E5DF"/><text x="28.0" y="97" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">提交</text><g transform="translate(117.33335 113) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="14" r="11"/><path d="M39 54 V38 q21-18 42 0 v16"/><rect x="20" y="48" width="80" height="29" rx="4" fill="#F7F4EC"/><path d="M10 81 h100 M42 55 l-6 7 6 7 M69 55 l6 7-6 7"/></g><text x="28.0" y="223" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">學生交程式</text><text x="28.0" y="265" font-size="20" fill="#506764" font-weight="500" text-anchor="start">留下實作結果</text><path d="M352.6667 177.0 H383.6667 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="390.6667" y="66" width="338.6667" height="222" rx="18" fill="#D5E5DF"/><text x="410.6667" y="97" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">比對</text><g transform="translate(500.00005 113) scale(1)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="5" width="102" height="72" rx="6"/><path d="M9 22 h102 M20 13 h0 M30 13 h0 M40 13 h0 M24 39 l5 5 10-13 M50 39 h44 M24 62 l5 5 10-13 M50 62 h44"/></g><text x="410.6667" y="223" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">自動測試功能</text><text x="410.6667" y="265" font-size="20" fill="#506764" font-weight="500" text-anchor="start">標準答案與測資</text><path d="M735.3334 177.0 H766.3334 m-7-5 l7 5-7 5" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="773.3334" y="66" width="338.6667" height="222" rx="18" fill="#F1E2D3"/><text x="793.3334" y="97" font-size="20" fill="#A85F29" font-weight="800" text-anchor="start">回饋</text><g transform="translate(882.66675 113) scale(1)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="78" height="55" rx="5"/><path d="M18 24 h47 M18 38 h35 M34 62 v12 M20 76 h54 M110 22.9 A14 14 0 1 1 96 22.9 M88.1 21.5 L96 22.9 L93.3 30.4"/></g><text x="793.3334" y="223" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">學生修正再試</text><text x="793.3334" y="265" font-size="20" fill="#506764" font-weight="500" text-anchor="start">錯誤訊息與測試結果</text><path d="M951 294 V329 H177 V294 m-6 8 l6-8 6 8" fill="none" stroke="#167C80" stroke-width="3"/><rect x="390" y="309" width="340" height="37" rx="18" fill="#F7F4EC"/><text x="560" y="335" font-size="20" fill="#167C80" font-weight="700" text-anchor="middle">修正後再提交；功能 ≠ 理解</text></g></svg>