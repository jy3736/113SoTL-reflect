<svg xmlns="http://www.w3.org/2000/svg" width="360" height="716" viewBox="0 0 360 716" role="img" aria-labelledby="title desc"><title id="title">同一句英文，前後測的中文卻不同</title><desc id="desc">定稿表二已列 p = .075；筆記提供含題／排除比較，未重新取得原始資料重算。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="36" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">量測問題／分析筆記</text><text x="24" y="67" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">前後測用語不同</text><text x="24" y="94" font-size="18" fill="#506764" font-weight="500" text-anchor="start">「別無選擇」／「一定得來」</text><path d="M24 109 L336 109" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="134" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">核對與定稿結果</text><text x="24" y="165" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">先核對題項版本</text><text x="24" y="193" font-size="18" fill="#506764" font-weight="500" text-anchor="start">英文相同，中文翻譯不一致</text><rect x="8" y="232" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="260" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">量測問題／分析筆記</text><text x="24" y="291" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">筆記：含第 11 題</text><text x="24" y="318" font-size="18" fill="#506764" font-weight="500" text-anchor="start">前測 α .357；成長 +0.68</text><path d="M24 333 L336 333" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="358" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">核對與定稿結果</text><text x="24" y="389" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">筆記：排除第 11 題</text><text x="24" y="417" font-size="18" fill="#506764" font-weight="500" text-anchor="start">前測 α .925；成長 +0.27</text><rect x="8" y="456" width="344" height="204" rx="18" fill="#D5E5DF"/><text x="24" y="484" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">量測問題／分析筆記</text><text x="24" y="515" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">筆記敏感度比較</text><text x="24" y="542" font-size="18" fill="#506764" font-weight="500" text-anchor="start">含題 p &lt; .001；排除 p = .075</text><path d="M24 557 L336 557" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="24" y="582" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">核對與定稿結果</text><text x="24" y="613" font-size="23" fill="#163D40" font-weight="800" text-anchor="start">定稿報告表二</text><text x="24" y="641" font-size="18" fill="#506764" font-weight="500" text-anchor="start">p = .075，已列為未達顯著</text></g></svg>