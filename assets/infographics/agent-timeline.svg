<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">從生成式 AI 協作走到 AI Agent 的時間線</title><desc id="desc">113 計畫，LLM Coding，自建自動批閱，四次 SIMS；114 申請書，Agent 未準備好，我當時的判斷，（該案未獲通過）；2025-09，教師工作坊，教師 AI 賦能，「教與學」；114-2，Agent 整合工具，老師提需求、驗結果，回教室接受檢驗；2026 暑期，九場 Agent 工作坊，智慧雨林計畫，教師主導流程</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><path d="M20 70 H1100" stroke="#167C80" stroke-width="4"/><circle cx="114.0" cy="70" r="12" fill="#167C80"/><text x="114.0" y="40" fill="#167C80" font-size="23" font-weight="800" text-anchor="middle">113 計畫</text><rect x="8" y="104" width="212" height="232" rx="14" fill="#D5E5DF"/><text x="114.0" y="164" fill="#163D40" font-size="21" font-weight="800" text-anchor="middle">LLM Coding</text><text x="114.0" y="222" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">自建自動批閱</text><text x="114.0" y="256" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">四次 SIMS</text><circle cx="337.0" cy="70" r="12" fill="#A85F29"/><text x="337.0" y="40" fill="#A85F29" font-size="23" font-weight="800" text-anchor="middle">114 申請書</text><rect x="231" y="104" width="212" height="232" rx="14" fill="#F1E2D3"/><text x="337.0" y="164" fill="#163D40" font-size="21" font-weight="800" text-anchor="middle">Agent 未準備好</text><text x="337.0" y="222" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">我當時的判斷</text><text x="337.0" y="256" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">（該案未獲通過）</text><circle cx="560.0" cy="70" r="12" fill="#167C80"/><text x="560.0" y="40" fill="#167C80" font-size="23" font-weight="800" text-anchor="middle">2025-09</text><rect x="454" y="104" width="212" height="232" rx="14" fill="#D5E5DF"/><text x="560.0" y="164" fill="#163D40" font-size="21" font-weight="800" text-anchor="middle">教師工作坊</text><text x="560.0" y="222" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">教師 AI 賦能</text><text x="560.0" y="256" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">「教與學」</text><circle cx="783.0" cy="70" r="12" fill="#167C80"/><text x="783.0" y="40" fill="#167C80" font-size="23" font-weight="800" text-anchor="middle">114-2</text><rect x="677" y="104" width="212" height="232" rx="14" fill="#D5E5DF"/><text x="783.0" y="164" fill="#163D40" font-size="21" font-weight="800" text-anchor="middle">Agent 整合工具</text><text x="783.0" y="222" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">老師提需求、驗結果</text><text x="783.0" y="256" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">回教室接受檢驗</text><circle cx="1006.0" cy="70" r="12" fill="#167C80"/><text x="1006.0" y="40" fill="#167C80" font-size="23" font-weight="800" text-anchor="middle">2026 暑期</text><rect x="900" y="104" width="212" height="232" rx="14" fill="#D5E5DF"/><text x="1006.0" y="164" fill="#163D40" font-size="21" font-weight="800" text-anchor="middle">九場 Agent 工作坊</text><text x="1006.0" y="222" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">智慧雨林計畫</text><text x="1006.0" y="256" fill="#506764" font-size="19" font-weight="500" text-anchor="middle">教師主導流程</text></g></svg>