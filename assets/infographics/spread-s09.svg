</text><text x="150.8" y="250" font-size="21" fill="#A85F29" font-weight="800" text-anchor="middle">後段拉得更開</text><text x="669.2" y="250" font-size="21" fill="#A85F29" font-weight="800" text-anchor="middle">前段也拉得更開</text><text x="50.0" y="328" font-size="18" fill="#506764" font-weight="600" text-anchor="start">低分</text><text x="770.0" y="328" font-size="18" fill="#506764" font-weight="600" text-anchor="end">高分</text><rect x="824" y="4" width="288" height="344" rx="18" fill="#F1E2D3"/><g fill="none" stroke="#A85F29" stroke-width="3" stroke-linecap="round"><circle cx="955" cy="60" r="24"/><path d="M973 78 l22 22 M940 60 h30 M940 54 v12 M970 54 v12"/></g><text x="968" y="145" font-size="36" fill="#A85F29" font-weight="800" text-anchor="middle">+3.70 分</text><text x="968" y="207" font-size="38" fill="#A85F29" font-weight="800" text-anchor="middle">近 +34%</text><text x="968" y="249" font-size="24" fill="#A85F29" font-weight="800" text-anchor="middle">標準差增加</text><text x="968" y="292" font-size="25" fill="#163D40" font-weight="800" text-anchor="middle">分數更分散</text><text x="968" y="326" font-size="19" fill="#506764" font-weight="500" text-anchor="middle">不是平均成績增加 34%</text></g></svg>