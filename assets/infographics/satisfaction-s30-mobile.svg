<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title desc"><title id="title">把期末自評當成學生滿意度調查</title><desc id="desc">45 位學生在期末對整學期做自我總評；講者以成績核對，回答有提升的學生不一定是高分學生，兩者沒有明確對應；因此把這份結果讀成學生對這次教學改變的滿意度，而不是能力測驗。五項都有過半學生說有提升，說沒有的最多 4 人。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="180.0" y="34" font-size="24" fill="#163D40" font-weight="800" text-anchor="middle">把自評當成滿意度調查</text><rect x="10" y="56" width="340" height="108" rx="18" fill="#D5E5DF"/><text x="28" y="86" font-size="17" fill="#167C80" font-weight="800" text-anchor="start">誰在評</text><text x="28" y="120" font-size="18" fill="#163D40" font-weight="800" text-anchor="start">45 位學生：走完整學期的學習者</text><text x="28" y="148" font-size="15" fill="#506764" font-weight="600" text-anchor="start">期末對整學期的自我總評</text><rect x="10" y="176" width="340" height="108" rx="18" fill="#D5E5DF"/><text x="28" y="206" font-size="17" fill="#167C80" font-weight="800" text-anchor="start">與成績核對</text><text x="28" y="240" font-size="18" fill="#163D40" font-weight="800" text-anchor="start">答「有」的不一定是高分學生</text><text x="28" y="268" font-size="15" fill="#506764" font-weight="600" text-anchor="start">兩者沒有明確對應（講者核對）</text><rect x="10" y="296" width="340" height="108" rx="18" fill="#F1E2D3"/><text x="28" y="326" font-size="17" fill="#A85F29" font-weight="800" text-anchor="start">所以讀成</text><text x="28" y="360" font-size="18" fill="#163D40" font-weight="800" text-anchor="start">對這次教學改變的滿意度</text><text x="28" y="388" font-size="15" fill="#506764" font-weight="600" text-anchor="start">不是能力測驗</text><text x="180.0" y="432" font-size="15" fill="#167C80" font-weight="700" text-anchor="middle">結論：五項都過半說有提升，說「沒有」最多 4 人</text></g></svg>