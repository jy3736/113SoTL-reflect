<svg xmlns="http://www.w3.org/2000/svg" width="360" height="608" viewBox="0 0 360 608" role="img" aria-labelledby="title desc"><title id="title">聊天式 AI 與 AI Agent 的差別</title><desc id="desc">聊天式 AI：老師提問、AI 回答、老師自己測試修改。AI Agent：老師給目標、資料範圍與驗收條件，Agent 規劃、動手、檢查並反覆修改，老師收成果與紀錄後再決定是否採用。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="6" width="344" height="216" rx="14" fill="#D5E5DF"/><text x="180" y="42" fill="#167C80" font-size="24" font-weight="800" text-anchor="middle">聊天式 AI</text><rect x="24" y="62" width="312" height="42" rx="14" fill="#fff"/><text x="180" y="90" fill="#163D40" font-size="18" font-weight="700" text-anchor="middle">老師提問</text><rect x="24" y="112" width="312" height="42" rx="14" fill="#fff"/><text x="180" y="140" fill="#163D40" font-size="18" font-weight="700" text-anchor="middle">AI 回答一段文字</text><rect x="24" y="162" width="312" height="42" rx="14" fill="#fff"/><text x="180" y="190" fill="#163D40" font-size="18" font-weight="700" text-anchor="middle">老師自己複製、測試、修改</text><rect x="8" y="236" width="344" height="366" rx="14" fill="#F1E2D3"/><text x="180" y="272" fill="#A85F29" font-size="24" font-weight="800" text-anchor="middle">AI Agent</text><rect x="24" y="290" width="312" height="44" rx="14" fill="#fff" stroke="#A85F29" stroke-width="2.5"/><text x="180" y="319" fill="#163D40" font-size="18" font-weight="800" text-anchor="middle">老師給：目標、範圍、驗收條件</text><rect x="24" y="348" width="312" height="44" rx="14" fill="#167C80"/><text x="180" y="377" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">規劃步驟</text><rect x="24" y="404" width="312" height="44" rx="14" fill="#167C80"/><text x="180" y="433" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">動手做</text><rect x="24" y="460" width="312" height="44" rx="14" fill="#167C80"/><text x="180" y="489" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">檢查結果（沒過就再改）</text><rect x="24" y="520" width="312" height="66" rx="14" fill="#fff" stroke="#A85F29" stroke-width="2.5"/><text x="180" y="548" fill="#163D40" font-size="18" font-weight="800" text-anchor="middle">老師收：成果與紀錄，</text><text x="180" y="573" fill="#163D40" font-size="18" font-weight="800" text-anchor="middle">再決定要不要用</text></g></svg>