<svg xmlns="http://www.w3.org/2000/svg" width="360" height="488" viewBox="0 0 360 488" role="img" aria-labelledby="title desc"><title id="title">工具改變之後，學習主體仍是人</title><desc id="desc">這些是教學原則與目標，不是已驗證的研究結果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="136" rx="18" fill="#D5E5DF"/><text x="30" y="40" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">學習主體</text><text x="30" y="80" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">學生仍要做決定</text><text x="30" y="116" font-size="20" fill="#506764" font-weight="500" text-anchor="start">AI 支援，不代替學習</text><rect x="8" y="168" width="344" height="136" rx="18" fill="#D5E5DF"/><text x="30" y="200" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">批判使用</text><text x="30" y="240" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">審視與檢驗產出</text><text x="30" y="276" font-size="20" fill="#506764" font-weight="500" text-anchor="start">能說明為何接受或修正</text><rect x="8" y="328" width="344" height="136" rx="18" fill="#F1E2D3"/><text x="30" y="360" font-size="18" fill="#A85F29" font-weight="800" text-anchor="start">共學文化</text><text x="30" y="400" font-size="26" fill="#163D40" font-weight="800" text-anchor="start">分享協作與解題歷程</text><text x="30" y="436" font-size="20" fill="#506764" font-weight="500" text-anchor="start">培養善用而非依賴的自覺</text></g></svg>