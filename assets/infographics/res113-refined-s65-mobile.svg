<svg xmlns="http://www.w3.org/2000/svg" width="360" height="666" viewBox="0 0 360 666" role="img" aria-labelledby="title desc"><title id="title">人機共學的三個原則</title><desc id="desc">人機共學的三個原則。依本頁內容整理；概念圖不代表額外的實證結果。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><circle cx="58" cy="50" r="29" fill="#D5E5DF"/><g transform="translate(38.8 30.799999999999997) scale(0.8)"><path d="M24 23 A8 8 0 1 0 24 7 A8 8 0 1 0 24 23 M8 43 V38 Q8 28 24 28 Q40 28 40 38 V43" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="57" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">人為主體</text><text x="23" y="130" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">釐清角色</text><text x="23" y="168" text-anchor="start" font-size="19" font-weight="500" fill="#506764">AI 輔助，學生仍要思考</text><circle cx="58" cy="262" r="29" fill="#D5E5DF"/><g transform="translate(38.8 242.8) scale(0.8)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="105" y="269" text-anchor="start" font-size="22" font-weight="800" fill="#167C80">批判素養</text><text x="23" y="342" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">審視與驗證</text><text x="23" y="380" text-anchor="start" font-size="19" font-weight="500" fill="#506764">主動檢查 AI 產出</text><circle cx="58" cy="474" r="29" fill="#F1E2D3"/><g transform="translate(38.8 454.8) scale(0.8)"><path d="M24 22 A7 7 0 1 0 24 8 A7 7 0