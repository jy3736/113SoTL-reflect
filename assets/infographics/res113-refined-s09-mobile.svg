<svg xmlns="http://www.w3.org/2000/svg" width="360" height="986" viewBox="0 0 360 986" role="img" aria-labelledby="title desc"><title id="title">112 學年的小試驗：原本、調整、結果</title><desc id="desc">原本精簡版 SPI，全班選實作考試；調整為 AI 協作的完整 SPI 介面，與 Arduino UNO 互傳；連同助教共三組完成，低於期望。箭頭只表示試行先後，不能證明 AI 造成學習提升。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="294" rx="18" fill="#D5E5DF"/><text x="32" y="44" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">原本</text><g transform="translate(100.0 64)" fill="none" stroke="#167C80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="23" width="92" height="65" rx="6"/><path d="M19 88 v10 h58 v-10 M9 103 h79 M25 42 l-9 9 9 9 M47 42 l9 9-9 9"/><path d="M102 5 h40 l15 16 v83 h-55 Z M142 5 v17 h15" fill="#F7F4EC"/><path d="M113 41 l5 5 9-11 M133 41 h13 M113 66 l5 5 9-11 M133 66 h13 M113 86 h31"/></g><text x="32" y="209" font-size="27" fill="#163D40" font-weight="800" text-anchor="start">精簡版 SPI</text><text x="32" y="252" font-size="21" fill="#506764" font-weight="500" text-anchor="start">全班選實作考試</text><path d="M180 307 v20 m-6-8 l6 8 6-8" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="334" width="344" height="294" rx="18" fill="#D5E5DF"/><text x="32" y="370" font-size="22" fill="#167C80" font-weight="800" text-anchor="start">調整</text><g transform="translate(100.0 390)" fill="none" stroke="#167C80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M42 8 h78 v32 h-40 l-10 11 v-11 h-28 Z" fill="#F7F4EC"/><path d="M57 19 l-5 5 5 5 M72 19 l5 5-5 5 M91 28 h15"/><rect x="3" y="60" width="46" height="44" rx="5"/><rect x="13" y="70" width="26" height="24" rx="3"/><rect x="108" y="55" width="50" height="54" rx="6"/><rect x="119" y="70" width="24" height="24" rx="2"/><path d="M115 55 v-6 h13 v6 M146 67 h6 M146 77 h6 M146 87 h6"/><path d="M57 76 h42 M92 70 l8 6-8 6 M100 95 h-42 M65 89 l-8 6 8 6"/></g><text x="32" y="535" font-size="27" fill="#163D40" font-weight="800" text-anchor="start">完整 SPI 介面</text><text x="32" y="578" font-size="21" fill="#506764" font-weight="500" text-anchor="start">與 Arduino UNO 互傳</text><path d="M180 633 v20 m-6-8 l6 8 6-8" fill="none" stroke="#167C80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="660" width="344" height="294" rx="18" fill="#F1E2D3"/><text x="32" y="696" font-size="22" fill="#A85F29" font-weight="800" text-anchor="start">結果</text><g transform="translate(100.0 716)" fill="none" stroke="#A85F29" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 35 h17 l8 9 h21 v60 h-46 Z" fill="#F7F4EC"/><path d="M11 74 l9 9 16-20"/><path d="M57 35 h17 l8 9 h21 v60 h-46 Z" fill="#F7F4EC"/><path d="M67 74 l9 9 16-20"/><path d="M113 35 h17 l8 9 h21 v60 h-46 Z" fill="#F7F4EC"/><path d="M123 74 l9 9 16-20"/><path d="M12 114 h137"/></g><text x="32" y="861" font-size="27" fill="#163D40" font-weight="800" text-anchor="start">共三組完成</text><text x="32" y="904" font-size="21" fill="#506764" font-weight="500" text-anchor="start">包含助教；低於期望</text></g></svg>