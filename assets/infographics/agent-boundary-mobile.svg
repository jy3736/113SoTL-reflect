<svg xmlns="http://www.w3.org/2000/svg" width="360" height="644" viewBox="0 0 360 644" role="img" aria-labelledby="title desc"><title id="title">今天每一頁都分清楚：做過、看到、想做</title><desc id="desc">已執行，生成式 AI 協作，113 課程：LLM Coding，自動批閱、活教材；有資料，報告裡的結果，四次 SIMS、45 人自評，單組，不作因果宣稱；延伸構想，AI Agent 流程，113 沒有做 Agent，課堂成效尚待驗證</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="6" width="344" height="190" rx="14" fill="#D5E5DF"/><text x="30" y="46" fill="#167C80" font-size="20" font-weight="800" text-anchor="start">已執行</text><text x="30" y="91" fill="#163D40" font-size="23" font-weight="800" text-anchor="start">生成式 AI 協作</text><text x="30" y="133" fill="#506764" font-size="18" font-weight="500" text-anchor="start">113 課程：LLM Coding</text><text x="30" y="164" fill="#506764" font-size="18" font-weight="500" text-anchor="start">自動批閱、活教材</text><rect x="8" y="220" width="344" height="190" rx="14" fill="#D5E5DF"/><text x="30" y="260" fill="#167C80" font-size="20" font-weight="800" text-anchor="start">有資料</text><text x="30" y="305" fill="#163D40" font-size="23" font-weight="800" text-anchor="start">報告裡的結果</text><text x="30" y="347" fill="#506764" font-size="18" font-weight="500" text-anchor="start">四次 SIMS、45 人自評</text><text x="30" y="378" fill="#506764" font-size="18" font-weight="500" text-anchor="start">單組，不作因果宣稱</text><rect x="8" y="434" width="344" height="190" rx="14" fill="#F1E2D3"/><text x="30" y="474" fill="#A85F29" font-size="20" font-weight="800" text-anchor="start">延伸構想</text><text x="30" y="519" fill="#163D40" font-size="23" font-weight="800"