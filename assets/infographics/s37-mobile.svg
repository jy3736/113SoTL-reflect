<svg xmlns="http://www.w3.org/2000/svg" width="360" height="674" viewBox="0 0 360 674" role="img" aria-labelledby="title desc"><title id="title">原規劃三階段，實際四階段：中段與期末任務重新安排</title><desc id="desc">原規劃三階段、18 週，期末為乘法器與 SPI。實際執行四階段、18 週，乘法器與 SPI 移至中段，期末改為 Toy-Processor，另新增專題觀念測驗。箭頭只表示任務前移，不表示已驗證的成效。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="294" rx="18" fill="#D5E5DF"/><text x="32" y="43" font-size="23" fill="#167C80" font-weight="800" text-anchor="start">申請規劃</text><g transform="translate(32 70)" fill="none" stroke="#167C80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="78" height="70" rx="6"/><rect x="12" y="11.0" width="8" height="8" rx="1"/><path d="M30 15.0 h38"/><rect x="12" y="33.0" width="8" height="8" rx="1"/><path d="M30 37.0 h38"/><rect x="12" y="55.0" width="8" height="8" rx="1"/><path d="M30 59.0 h38"/></g><text x="129" y="119" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">三階段・18 週</text><text x="32" y="193" font-size="20" fill="#167C80" font-weight="800" text-anchor="start">原期末專題</text><text x="32" y="239" font-size="29" fill="#163D40" font-weight="800" text-anchor="start">乘法器／SPI</text><rect x="8" y="366" width="344" height="294" rx="18" fill="#F1E2D3"/><text x="32" y="401" font-size="23" fill="#A85F29" font-weight="800" text-anchor="start">實際執行</text><g transform="translate(32 428)" fill="none" stroke="#A85F29" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="78" height="70" rx="6"/><rect x="12" y="11.0" width="8" height="8" rx="1"/><path d="M30 15.0 h38"/><rect x="12" y="25.666666666666664" width="8" height="8" rx="1"/><path d="M30 29.666666666666664 h38"/><rect x="12" y="40.33333333333333" width="8" height="8" rx="1"/><path d="M30 44.33333333333333 h38"/><rect x="12" y="55.0" width="8" height="8" rx="1"/><path d="M30 59.0 h38"/></g><text x="129" y="477" font-size="25" fill="#163D40" font-weight="800" text-anchor="start">四階段・18 週</text><text x="129" y="511" font-size="18" fill="#167C80" font-weight="700" text-anchor="start">中段加入 AI 協作</text><text x="32" y="556" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">中段：乘法器／SPI</text><text x="32" y="603" font-size="24" fill="#163D40" font-weight="800" text-anchor="start">期末：Toy-Processor</text><text x="32" y="650" font-size="21" fill="#A85F29" font-weight="800" text-anchor="start">新增專題觀念測驗</text><path d="M180 310 v15 m-6-8 l6 8 6-8" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="352" font-size="18" fill="#506764" font-weight="600" text-anchor="middle">任務前移，期末重排</text></g></svg>