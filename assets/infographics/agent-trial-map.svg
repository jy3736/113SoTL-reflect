<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">小範圍試用要一起補上 113 的三個證據缺口</title><desc id="desc">教師負擔、落差與分化、判斷 AI 的能力三個缺口，分別配上要收集的資料與要回答的問題。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#A85F29" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="28" y="28" fill="#167C80" font-size="22" font-weight="800" text-anchor="start">113 留下的缺口</text><text x="392" y="28" fill="#167C80" font-size="22" font-weight="800" text-anchor="start">試用時一起收</text><text x="776" y="28" fill="#A85F29" font-size="22" font-weight="800" text-anchor="start">要回答的問題</text><rect x="8" y="44.0" width="324" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="28" y="86.41666666666666" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">教師負擔</text><text x="28" y="121.91666666666666" fill="#506764" font-size="19" font-weight="500" text-anchor="start">報告未列時數</text><path d="M337 92.66666666666666 L366 92.66666666666666" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="44.0" width="344" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="392" y="86.41666666666666" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">記四類工時</text><text x="392" y="121.91666666666666" fill="#506764" font-size="19" font-weight="500" text-anchor="start">起草、查核、維護、支援</text><path d="M721 92.66666666666666 L750 92.66666666666666" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="44.0" width="356" height="97.33333333333333" rx="14" fill="#F1E2D3"/><text x="776" y="86.41666666666666" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">省下的時間去哪</text><text x="776" y="121.91666666666666" fill="#506764" font-size="19" font-weight="500" text-anchor="start">用前後對照才能說</text><rect x="8" y="153.33333333333331" width="324" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="28" y="195.74999999999997" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">落差與分化</text><text x="28" y="231.24999999999997" fill="#506764" font-size="19" font-weight="500" text-anchor="start">只有平均、標準差</text><path d="M337 201.99999999999997 L366 201.99999999999997" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="153.33333333333331" width="344" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="392" y="195.74999999999997" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">看逐人變化</text><text x="392" y="231.24999999999997" fill="#506764" font-size="19" font-weight="500" text-anchor="start">中段標記、後續追蹤</text><path d="M721 201.99999999999997 L750 201.99999999999997" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="153.33333333333331" width="356" height="97.33333333333333" rx="14" fill="#F1E2D3"/><text x="776" y="195.74999999999997" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">有沒有接住學生</text><text x="776" y="231.24999999999997" fill="#506764" font-size="19" font-weight="500" text-anchor="start">不靠一個總分</text><rect x="8" y="262.66666666666663" width="324" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="28" y="305.0833333333333" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">判斷 AI 的能力</text><text x="28" y="340.5833333333333" fill="#506764" font-size="19" font-weight="500" text-anchor="start">沒有直接測量</text><path d="M337 311.3333333333333 L366 311.3333333333333" fill="none" stroke="#167C80" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="262.66666666666663" width="344" height="97.33333333333333" rx="14" fill="#D5E5DF"/><text x="392" y="305.0833333333333" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">錯誤案例任務</text><text x="392" y="340.5833333333333" fill="#506764" font-size="19" font-weight="500" text-anchor="start">找錯、驗證、修正的表現</text><path d="M721 311.3333333333333 L750 311.3333333333333" fill="none" stroke="#A85F29" stroke-width="3" marker-end="url(#g)"/><rect x="756" y="262.66666666666663" width="356" height="97.33333333333333" rx="14" fill="#F1E2D3"/><text x="776" y="305.0833333333333" fill="#163D40" font-size="25" font-weight="800" text-anchor="start">誰還在思考</text><text x="776" y="340.5833333333333" fill="#506764" font-size="19" font-weight="500" text-anchor="start">自評不能代替表現</text></g></svg>