<svg xmlns="http://www.w3.org/2000/svg" width="360" height="852" viewBox="0 0 360 852" role="img" aria-labelledby="title desc"><title id="title">第 29 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="8" y="8" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 30) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 h68 v65 H10 Z M23 19 h42 M23 34 h31 M23 49 h39 M81 17 h22 v64 H36 v-9"/></g><text x="118" y="45" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">量測問題／分析筆記</text><text x="118" y="82" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">前後測中文用語不同</text><path d="M26 118 L334 118" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="152" font-size="16" fill="#A85F29" font-weight="800" text-anchor="start">核對與定稿結果</text><text x="28" y="191" font-size="22" fill="#163D40" font-weight="800" text-anchor="start">先核對題項版本</text><text x="28" y="233" font-size="17" fill="#506764" font-weight="500" text-anchor="start">「別無選擇」／「一定得來」</text><rect x="8" y="292" width="344" height="260" rx="18" fill="#D5E5DF"/><g transform="translate(24 314) scale(0.65)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="49" cy="32" r="25"/><path d="M68 51 l26 26 M36 32 h26 M49 19 v26"/></g><text x="118" y="329" font-size="16" fill="#167C80" font-weight="800" text-anchor="start">量測問題／分析筆記</text><text x="118" y="366" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">筆記：含題／排除比較</text><path d="M26 402 L334 402" fill="none" stroke="#B5CAC3" stroke-width="3"/><text x="28" y="436" font-size="16" f