<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc"><title id="title">「活」教材：過去老師一人補寫，加入 AI 後由 AI 補強、老師驗證</title><desc id="desc">上排為過去的複習翻轉：察覺卡關點後，由老師自己課後補寫與修訂教材，再補進 Notion，時間與心理負擔沉重。下排為加入 AI 之後：察覺、AI 依課堂訊息與現有教材補強、教師最後驗證與細修、補進 Notion。多出的一步由 AI 協助，不是老師動手。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="8" y="60" font-size="24" fill="#A85F29" font-weight="800" text-anchor="start">過去</text><text x="8" y="92" font-size="17" fill="#A85F29" font-weight="700" text-anchor="start">複習翻轉</text><text x="8" y="120" font-size="15" fill="#506764" font-weight="600" text-anchor="start">老師一人</text><text x="8" y="250" font-size="24" fill="#167C80" font-weight="800" text-anchor="start">加入 AI</text><text x="8" y="282" font-size="14" fill="#506764" font-weight="600" text-anchor="start">多一步，</text><text x="8" y="306" font-size="14" fill="#506764" font-weight="600" text-anchor="start">交給 AI</text><rect x="140" y="8" width="223" height="132" rx="14" fill="#D5E5DF"/><text x="156" y="40" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">01 察覺</text><text x="156" y="82" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">找到卡關點</text><text x="156" y="116" font-size="15" fill="#506764" font-weight="600" text-anchor="start">反應、Zuvio、助教回饋</text><path d="M369 74.0 h16 m-6-5 l6 5-6 5" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="391" y="8" width="474" height="132" rx="14" fill="#F1E2D3"/><text x="407" y="40" font-size="18" fill="#A85F29" font-weight="800" text-anchor="start">02＋03 老師自己來</text><text x="407" y="82" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">課後補寫、修訂教材</text><text x="407" y="116" font-size="15" fill="#506764" font-weight="600" text-anchor="start">時間與心理負擔都沉重</text><path d="M871 74.0 h16 m-6-5 l6 5-6 5" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="893" y="8" width="223" height="132" rx="14" fill="#D5E5DF"/><text x="909" y="40" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">04 更新</text><text x="909" y="82" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">補進 Notion 教材</text><text x="909" y="116" font-size="15" fill="#506764" font-weight="600" text-anchor="start">筆記一改，線上跟著改</text><path d="M140 154 H1112" stroke="#D5E5DF" stroke-width="2" stroke-dasharray="6 6"/><rect x="140" y="220" width="223" height="132" rx="14" fill="#D5E5DF"/><text x="156" y="252" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">01 察覺</text><text x="156" y="294" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">找到卡關點</text><text x="156" y="328" font-size="15" fill="#506764" font-weight="600" text-anchor="start">反應、Zuvio、助教回饋</text><path d="M369 286.0 h16 m-6-5 l6 5-6 5" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="391" y="220" width="223" height="132" rx="14" fill="#FFFFFF" stroke="#167C80" stroke-width="2.4"/><text x="407" y="252" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">02 AI 補強</text><text x="407" y="294" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">訊息＋教材交給 AI</text><text x="407" y="328" font-size="15" fill="#506764" font-weight="600" text-anchor="start">補說明、例題、格式</text><path d="M620 286.0 h16 m-6-5 l6 5-6 5" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="642" y="220" width="223" height="132" rx="14" fill="#D5E5DF"/><text x="658" y="252" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">03 教師驗證</text><text x="658" y="294" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">最後驗證與細修</text><text x="658" y="328" font-size="15" fill="#506764" font-weight="600" text-anchor="start">概念、答案、例子要對</text><path d="M871 286.0 h16 m-6-5 l6 5-6 5" fill="none" stroke="#167C80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="893" y="220" width="223" height="132" rx="14" fill="#D5E5DF"/><text x="909" y="252" font-size="18" fill="#167C80" font-weight="800" text-anchor="start">04 更新</text><text x="909" y="294" font-size="21" fill="#163D40" font-weight="800" text-anchor="start">補進 Notion 教材</text><text x="909" y="328" font-size="15" fill="#506764" font-weight="600" text-anchor="start">再觀察學生如何使用</text></g></svg>