<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">第 31 頁概念圖</title><desc id="desc">依本頁來源與證據界線整理；概念圖不表示因果或已驗證效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#167C80" stroke-width="1.6"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="200" y="29" font-size="23" fill="#163D40" font-weight="800" text-anchor="middle">同一任務，回應可以不同</text><rect x="12" y="56" width="376" height="137" rx="18" fill="#D5E5DF"/><g transform="translate(25 82) scale(0.75)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="20" r="15"/><path d="M31 80 V58 q0-22 29-22 q29 0 29 22 v22 M42 57 v23 M78 57 v23"/></g><g transform="translate(110 89) scale(0.6)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M60 5 l15 24 29 5-21 22 4 27-27-13-27 13 4-27-21-22 29-5 Z"/></g><text x="213" y="104" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">挑戰帶來投入</text><text x="213" y="145" font-size="16" fill="#506764" font-weight="500" text-anchor="start">想多做 HDL 練習</text><rect x="12" y="211" width="376" height="137" rx="18" fill="#F1E2D3"/><g transform="translate(25 237) scale(0.75)" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="20" r="15"/><path d="M31 80 V58 q0-22 29-22 q29 0 29 22 v22 M42 57 v23 M78 57 v23"/></g><g transform="translate(110 244) scale(0.6)" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="81" height="58" rx="5"/><path d="M19 27 l-7 8 7 8 M42 27 l7 8-7 8 M33 66 v11 M18 79 h32"/><circle cx="93" cy="50" r="24" fill="#F7F4EC"/><path d="M85 42 q0-12 14-8 q12 5-2 14 l-4 5 M93 64 h0"/></g><text x="213" y="259" font-size="20" fill="#163D40" font-weight="800" text-anchor="start">負荷帶來壓力</text><text x="213" y="300" font-size="16" fill="#506764" font-weight="500" text-anchor="start">希望有中間階段任務</text><text x="200" y="397" font-size="19" fill="#506764" font-weight="500" text-anchor="middle">回饋例子，不代表全班比例</text><text x="200" y="430" font-size="21" fill="#167C80" font-weight="800" text-anchor="middle">支援設計要接住不同起點</text></g></svg>